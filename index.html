":1,"cat":"cards","en":{"name":"Slapjack","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Split the deck evenly, face-down. Players take turns flipping their top card onto a central pile, and the instant a Jack appears, everyone races to slap it. First hand down claims the whole pile. Win all the cards to win the game — but slap a non-Jack and you forfeit cards. Pure reflexes."},"ar":{"name":"صفعة الولد","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"اقسموا الورق بالتساوي مقلوبًا. يقلب اللاعبون بالتناوب ورقاتهم في كومة وسطى، ولحظة ظهور ورقة «الولد» (J) يتسابق الجميع على صفعها. أول يد تنزل تأخذ الكومة. اجمع كل الورق لتفوز — لكن الصفعة الخاطئة تكلّفك ورقًا."}},{"tags":["two"],"meter":1,"cat":"cards","en":{"name":"Speed","players":"2 players","needs":"<b>You need:</b> A deck of cards.","how":"A frantic, turn-free duel. Both players lay cards at the same time onto two shared piles, stacking up or down in rank, drawing fresh cards from their own stack as fast as their hands allow. There's no waiting and no mercy. First to shed every card shouts \"Speed!\" and wins."},"ar":{"name":"السرعة","players":"لاعبان","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"مبارزة ثنائية محمومة بلا أدوار. يلعب اللاعبان ورقاتهما في الوقت نفسه على كومتين وسطيّتين، بالبناء صعودًا أو نزولًا بالرتبة، مع السحب من كومتهما الخاصة بأسرع ما تسمح اليدان. لا انتظار ولا رحمة. أول من يُفرِغ يده وكومته يصيح «سرعة!» ويفوز."}},{"tags":["small"],"meter":2,"cat":"cards","en":{"name":"Hearts","players":"4 players","needs":"<b>You need:</b> A deck of cards.","how":"A trick-taking classic where you want the fewest points, not the most. Each heart you're forced to take costs a point, and the dreaded Queen of Spades costs thirteen. Lowest score after several rounds wins — unless you're bold enough to \"shoot the moon\" by taking every penalty card and flipping the score onto everyone else."},"ar":{"name":"القلوب","players":"4 لاعبين","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"كلاسيكية أخذ الأكلات هدفها أقل عدد من النقاط لا أكثرها. كل ورقة قلب نقطة، وملكة البستوني ثلاث عشرة نقطة مؤلمة، فتتفادى أخذها. أقل مجموع بعد عدة جولات يفوز — إلا إن تجرّأ أحدهم على «إصابة القمر» بأخذ كل ورقات العقاب فتنقلب النقاط على الجميع."}},{"tags":["two","small","big"],"meter":1,"cat":"cards","en":{"name":"Blackjack (21)","players":"2+ players","needs":"<b>You need:</b> A deck of cards (chips or matchsticks optional).","how":"Each player tries to build a hand as close to 21 as possible without going over, against a dealer doing the same. Number cards score their value, face cards ten, and aces one or eleven. \"Hit\" for another card or \"stand\" to hold — but bust past 21 and you're out. Plays perfectly well with counters and no real money."},"ar":{"name":"بلاك جاك (21)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب (رقائق أو أعواد كبديل اختياري).","how":"يحاول كل لاعب بناء يد أقرب إلى 21 من الموزّع دون تجاوزها. الأوراق الرقمية بقيمتها، والصور بعشرة، والإكس (A) بواحد أو أحد عشر. اطلب ورقة أخرى («سحب») أو توقّف («ثبات») — وتجاوز 21 يُخرجك. تُلعب جيّدًا برقائق أو أعواد وبلا أي مال."}},{"tags":["small"],"meter":2,"cat":"cards","en":{"name":"Palace","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"You juggle cards in your hand plus face-up and face-down \"palace\" cards on the table, shedding them onto a central pile in rising rank. Certain cards reset the pile, reverse the order, or blow it up, and if you can't play, you scoop the whole stack into your hand. The last player still holding cards loses."},"ar":{"name":"القصر","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"توازن بين ورق في يدك وورق «قصر» مكشوف ومقلوب على الطاولة، ترميه في كومة بترتيب صاعد. أوراق خاصة تعيد ضبط الكومة أو تعكسها أو تفجّرها، وإن عجزت عن اللعب أخذت الكومة كلها. آخر من يبقى ممسكًا بالورق يخسر."}},{"tags":["big"],"meter":2,"cat":"dice","en":{"name":"Bunco","players":"6+ players (great for 12)","needs":"<b>You need:</b> Three dice, groups of players, and scoresheets.","how":"A breezy dice game of pure luck played in six rounds at multiple tables. You roll three dice trying to match the round's target number for points, shouting \"Bunco!\" when all three come up as the target. Players shuffle between tables each round, so it's really a wonderfully social excuse to chat and roll."},"ar":{"name":"بونكو","players":"6 لاعبين فأكثر (الأفضل 12)","needs":"<b>تحتاج إلى:</b> ثلاثة أحجار نرد، ومجموعات لاعبين، وأوراق تسجيل.","how":"لعبة نرد اجتماعية حظّية خالصة تُلعب في جولات على عدة طاولات. ترمي ثلاثة أحجار محاولًا مطابقة رقم الجولة لتحصد النقاط، وتصيح «بونكو!» عند ثلاثية. يتنقّل اللاعبون بين الطاولات بين الجولات، فهي حقًّا ذريعة لأمسية ثرثارة."}},{"tags":["two","small","big"],"meter":1,"cat":"dice","en":{"name":"Ship, Captain, Crew","players":"2+ players","needs":"<b>You need:</b> Five dice.","how":"Roll five dice in up to three throws, aiming to lock in a six (the ship), a five (the captain), and a four (the crew) in that exact order. Only once you've got all three do your final two dice count as your cargo. Highest cargo total wins the round — but miss the ship and you score nothing."},"ar":{"name":"سفينة، قبطان، طاقم","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> خمسة أحجار نرد.","how":"ارمِ خمسة أحجار في ثلاث رميات كحد أقصى، مستهدفًا ٦ (السفينة) ثم ٥ (القبطان) ثم ٤ (الطاقم) بهذا الترتيب. فقط بعد الحصول على الثلاثة يُحتسَب حجراك الأخيران كحمولتك. أعلى حمولة تفوز بالجولة — لكن إن فاتتك السفينة لم تسجّل شيئًا."}},{"tags":["two","small","big"],"meter":1,"cat":"dice","en":{"name":"Threes","players":"2+ players","needs":"<b>You need:</b> Five dice.","how":"Roll five dice and, each turn, set at least one aside, chasing the lowest possible total. The twist: threes count as zero, so they're the best thing you can grab. Once everyone has used up all their dice, the player with the lowest score wins. Learnable in a minute, replayable all night."},"ar":{"name":"الثلاثات","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> خمسة أحجار نرد.","how":"ارمِ خمسة أحجار، وفي كل دور اعزل حجرًا واحدًا على الأقل، ساعيًا لأقل مجموع — لكن الثلاثات تُحتسَب صفرًا، فهي كنز. بعد أن يستعمل الجميع كل نردهم، أقل مجموع يفوز. سريعة، حظّية، وتُتعلَّم في دقيقة."}},{"tags":["two"],"meter":1,"cat":"paper","en":{"name":"Tic-Tac-Toe","players":"2 players","needs":"<b>You need:</b> Paper and a pen.","how":"Take turns marking your X or O in a three-by-three grid. The first to line up three in a row — across, down, or diagonally — wins. Two careful players will usually battle to a draw, which is part of its enduring, doodle-in-the-margin charm."},"ar":{"name":"إكس أو (تيك تاك تو)","players":"لاعبان","needs":"<b>تحتاج إلى:</b> ورقة وقلم.","how":"تناوبوا وضع X أو O في شبكة ثلاث في ثلاث. أول من يصفّ ثلاثة في خط — أفقيًّا أو رأسيًّا أو قُطريًّا — يفوز. تشتهر بانتهائها بالتعادل بين لاعبَين حذرين، وهذا نصف سحرها."}},{"tags":["two"],"meter":1,"cat":"paper","en":{"name":"Sprouts","players":"2 players","needs":"<b>You need:</b> Paper and a pen.","how":"Start with a few dots. Players take turns drawing a line between two dots (or looping one back to itself) and placing a new dot somewhere on that line — but lines can never cross, and no dot may sprout more than three connections. The last player able to make a legal move wins. A tiny pencil game with surprising depth."},"ar":{"name":"البراعم","players":"لاعبان","needs":"<b>تحتاج إلى:</b> ورقة وقلم.","how":"ابدؤوا ببضع نقاط. يرسم اللاعبون بالتناوب خطًّا بين نقطتين (أو من نقطة إلى نفسها) ويضيفون نقطة جديدة على ذلك الخط — لكن ممنوع تقاطع الخطوط، ولا يجوز لنقطة أن تتّصل بأكثر من ثلاثة خطوط. آخر لاعب يستطيع حركة قانونية يفوز. لعبة قلم صغيرة عميقة على نحو خادع."}},{"tags":["two"],"meter":1,"cat":"paper","en":{"name":"Bulls and Cows","players":"2 players","needs":"<b>You need:</b> Paper and a pen.","how":"One player secretly picks a four-digit number with no repeated digits; the other tries to guess it. Each guess earns feedback: a \"bull\" for every correct digit in the right position and a \"cow\" for a correct digit in the wrong spot. Use the clues to crack the code in as few guesses as you can — the classic ancestor of code-breaking games."},"ar":{"name":"الثيران والأبقار","players":"لاعبان","needs":"<b>تحتاج إلى:</b> ورقة وقلم.","how":"يختار لاعب سرًّا رقمًا من أربع خانات بلا تكرار؛ والآخر يخمّن. كل تخمين يحصل على تغذية راجعة: «ثور» لكل رقم صحيح في مكانه الصحيح، و«بقرة» لرقم صحيح في مكان خاطئ. استعملوا الأدلّة لفك الشيفرة بأقل عدد من التخمينات — الجدّ الأول لألعاب كسر الشيفرة."}},{"tags":["small","big"],"meter":1,"cat":"paper","en":{"name":"Categories Grid","players":"2+ players","needs":"<b>You need:</b> Paper, pens, and a timer.","how":"Agree on a handful of categories — animal, city, food, name — and pick a random letter. Everyone races to write a word starting with that letter for each category before time runs out. Score for every answer no one else thought of; matching answers cancel each other out, so the clever, obscure pick wins."},"ar":{"name":"شبكة الفئات","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> ورق وأقلام ومؤقّت.","how":"اتّفقوا على عدة فئات — حيوان، مدينة، طعام، اسم — واختاروا حرفًا عشوائيًّا. يتسابق الجميع على ملء كلمة تبدأ بذلك الحرف لكل فئة قبل انتهاء الوقت. سجّلوا نقاطًا لكل إجابة لم يكتبها غيركم؛ الإجابات المتطابقة تُلغى بعضها بعضًا، فالاختيار الذكي النادر يفوز."}},{"tags":["two","small"],"meter":1,"cat":"memory","en":{"name":"Concentration","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Lay the whole deck face-down in a neat grid. On your turn, flip two cards; if they match in rank you keep the pair and go again, otherwise flip them back and let the next player try. Remembering where each card sits is everything. Whoever collects the most pairs wins."},"ar":{"name":"التركيز (المطابقة)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"افرشوا المجموعة كلها مقلوبة في شبكة. في دورك اقلب ورقتين؛ إن تطابقتا بالرتبة احتفظت بالزوج ولعبت مجددًا، وإلا أعِدهما مقلوبتين ودع التالي يجرّب. تذكُّر مكان كل ورقة هو كل شيء. من يجمع أكثر الأزواج في النهاية يفوز."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Limbo","players":"3+ players","needs":"<b>You need:</b> A broom handle or rope, and music.","how":"Two people hold a bar (or a taut rope) while each player leans backward and shuffles underneath it without touching it or toppling over. Once everyone's cleared it, the bar drops lower. Knock the bar or fall and you're out — the last one bending under the lowest bar is the limbo champion."},"ar":{"name":"الليمبو","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> عصا مكنسة أو حبل، وموسيقى.","how":"يمسك شخصان قضيبًا (أو حبلًا مشدودًا) بينما يميل كل لاعب إلى الخلف ويتسلّل تحته دون أن يلمسه أو يقع. بعد أن يمرّ الجميع، يُخفَض القضيب. من يلمس القضيب أو يسقط يخرج — وآخر من ينحني تحت أخفض قضيب يفوز."}},{"tags":["two","small","big"],"meter":1,"cat":"active","en":{"name":"Keepy Uppy","players":"2+ players","needs":"<b>You need:</b> A balloon.","how":"Blow up a balloon and keep it from touching the floor using any part of your body. Play together to beat a group record or add rules — heads only, elbows only, everyone must touch it once before it lands. Astonishingly frantic and perfect for burning energy indoors on a rainy day."},"ar":{"name":"أبقِها في الهواء","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> بالون.","how":"انفخوا بالونًا وامنعوه من لمس الأرض بأي جزء من الجسم. العبوا معًا لتحطيم رقم قياسي، أو أضيفوا قواعد — بالرأس فقط، بالمرفقين فقط، عُدّوا عدد اللمسات قبل أن يهبط. محمومة على نحو مدهش ومثالية للداخل في يوم ممطر."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Musical Statues","players":"3+ players","needs":"<b>You need:</b> Music and someone to pause it.","how":"Everyone dances while the music plays and must freeze like a statue the very instant it stops. The person on music duty prowls around watching for the slightest wobble and calls out anyone who moves. Hold the stillest, steadiest pose to be the last statue standing."},"ar":{"name":"التماثيل الموسيقية","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> موسيقى وشخص يوقفها.","how":"يرقص الجميع ما دامت الموسيقى تعزف، وعليهم التجمّد كتمثال لحظة توقّفها. يراقب المتحكّم أي اهتزاز ويستبعد من يتحرّك. اثبتوا في أثبت وضعية لتكونوا آخر تمثال باقٍ."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Skipping Rope Games","players":"3+ players","needs":"<b>You need:</b> A long skipping rope.","how":"Two players turn a long rope while others jump in one at a time, usually to a chanted rhyme that sets the rhythm and calls out dares. Miss a beat or snag the rope and you swap in to turn the rope instead. A schoolyard tradition with countless rhymes to learn and race through."},"ar":{"name":"ألعاب حبل النطّ","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> حبل نطّ طويل.","how":"يدير لاعبان حبلًا طويلًا بينما يقفز الآخرون واحدًا تلو الآخر، غالبًا على وقع أهزوجة تضبط الإيقاع والتحدّيات. من يفوّت نبضة أو يعلق بالحبل يتبادل ليدير الحبل. تقليد مدرسي بأهازيج لا تنتهي لتجرّبوها."}},{"tags":["big"],"meter":3,"cat":"outdoor","en":{"name":"British Bulldog","players":"6+ players","needs":"<b>You need:</b> A large, open space.","how":"One or two \"bulldogs\" stand in the middle of the field while everyone else lines up at one end. On the shout, all the runners sprint for the far side, and anyone caught and held by a bulldog joins the middle for the next charge. With more catchers each round, the last runner to stay free wins. Agree a gentle version of \"caught\" first."},"ar":{"name":"البلدغ البريطاني","players":"6 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مساحة واسعة ومفتوحة.","how":"يقف «بلدغ» واحد أو اثنان في وسط الملعب بينما يصطفّ الباقون في طرف. عند النداء يندفع اللاعبون نحو الجهة المقابلة، ومن يُمسَك ويُثبَّت ينضمّ إلى الوسط. مع تزايد الماسكين كل جولة، آخر عدّاء يبقى حرًّا يفوز. اتفقوا على صيغة لطيفة لـ«الإمساك» أولًا."}},{"tags":["small","big"],"meter":2,"cat":"outdoor","en":{"name":"Kick the Can","players":"4+ players","needs":"<b>You need:</b> A can or object, and space to hide.","how":"A blend of hide-and-seek and tag built around a can in the open. One seeker guards it while everyone hides, then hunts them down — but any hider who sneaks in and kicks the can before being tagged frees everyone already caught. Slip through undetected, or be the hero who boots the can and springs the whole team."},"ar":{"name":"اركل العلبة","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> علبة أو غرض، ومساحة للاختباء.","how":"مزيج من الاستغماية والمطاردة حول علبة في العراء. يحرس باحث واحد العلبة بينما يختبئ الجميع، ثم يطاردهم — لكن أي مختبئ يتسلّل ويركل العلبة قبل أن يُلمَس يحرّر كل من أُمسِك. اعبر دون أن تُكتَشف، أو كن البطل الذي يركل العلبة ويحرّر الفريق."}},{"tags":["big"],"meter":3,"cat":"outdoor","en":{"name":"Red Rover","players":"8+ players","needs":"<b>You need:</b> A large space and two teams.","how":"Two teams face each other in long lines, holding hands. One side calls \"Red Rover, Red Rover, send [name] right over,\" and that player runs full-pelt at the opposing line, trying to burst through the linked arms. Break through and you claim a player for your team; fail and you join theirs. The longest line at the end wins."},"ar":{"name":"ريد روفر","players":"8 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مساحة واسعة وفريقان.","how":"يقف فريقان متقابلين في صفّين طويلين ممسكين بالأيدي. ينادي فريق «ريد روفر، أرسِلوا [الاسم] إلينا»، فينطلق ذلك اللاعب بأقصى سرعته محاولًا اختراق الأذرع المتشابكة. إن اخترق أخذ لاعبًا إلى فريقه؛ وإن فشل انضمّ إليهم. أطول صفّ في النهاية يفوز."}},{"tags":["small","big"],"meter":2,"cat":"outdoor","en":{"name":"Tug of War","players":"4+ players","needs":"<b>You need:</b> A strong rope.","how":"Two teams grip opposite ends of a rope with a marker (often a ribbon) tied at its centre over a line on the ground. On the signal, both sides heave with everything they've got. Drag the centre marker past your side's line to win. Pure muscle, timing, and teamwork — dig in and pull as one."},"ar":{"name":"شدّ الحبل","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> حبل متين.","how":"يمسك فريقان بطرفي حبل تُربَط علامة في وسطه فوق خط على الأرض، وعند الإشارة يشدّان بكل قوّة. اسحب العلامة الوسطى إلى ما بعد خطّك لتفوز. عضلات وتوقيت وعمل جماعي خالص — ثبّتوا أقدامكم واشدّوا كجسد واحد."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"The Alphabet Game","players":"2+ players","needs":"<b>You need:</b> Nothing but passing signs.","how":"On a journey, race to spot the letters A through Z in order on road signs, billboards, and number plates. Call out each letter the moment you find it and move to the next. First to reach Z wins — and the desperate hunt for a Q and a Z always turns into the best part."},"ar":{"name":"لعبة الحروف الأبجدية","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى اللافتات العابرة.","how":"في رحلة، تسابقوا على رصد الحروف من الألف إلى الياء بالترتيب على اللافتات واللوحات وأرقام السيارات. نادِ كل حرف لحظة إيجاده وانتقل للتالي. أول من يبلغ آخر الحروف يفوز — والبحث اليائس عن الحروف النادرة هو أطرف ما فيها."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"Geography","players":"2+ players","needs":"<b>You need:</b> Nothing but a bit of world knowledge.","how":"Name a place — a country, city, mountain, or river. The next player must name another place beginning with the last letter of yours: \"Canada, Athens, Spain, Nairobi.\" No repeats allowed; anyone stumped drops out. A gentle geography workout that's ideal for the car or the dinner table."},"ar":{"name":"الجغرافيا","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى بعض المعرفة بالعالم.","how":"اذكر مكانًا — دولة أو مدينة أو نهرًا. على التالي ذكر مكان يبدأ بالحرف الأخير من مكانك: «كندا، أثينا، إسبانيا». بلا تكرار؛ ومن يعجز يخرج. اختبار جغرافيا لطيف مثالي للسيارة أو لطاولة العشاء."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"Punch Buggy","players":"2+ players","needs":"<b>You need:</b> Nothing but traffic to watch.","how":"The classic car-spotting game: be first to spot a particular type of vehicle and call it out to score. Tradition says a certain rounded little car earns a (very gentle) tap on a fellow passenger's arm — but agree your own target car and keep it friendly. Most sightings by the end of the trip wins."},"ar":{"name":"بانش باغي","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى حركة المرور لمراقبتها.","how":"لعبة رصد السيارات الكلاسيكية: كن أول من يرصد نوعًا معيّنًا من السيارات ويناديه ليسجّل. التقليد أن سيارةً صغيرة مستديرة تمنح ربتة (لطيفة جدًّا) على ذراع رفيق — لكن اتفقوا على سيارتكم المستهدفة وأبقوها ودّية. من يرصد الأكثر بنهاية الرحلة يفوز."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"The Quiet Game","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Beloved by weary parents everywhere. On \"go,\" everyone must stay completely silent, and the last person to make a single sound wins. It's deceptively hard, quietly competitive, and blissfully peaceful — the only game whose real prize goes to whoever suggested playing it."},"ar":{"name":"لعبة الصمت","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"محبّبة للآباء المرهَقين في كل مكان. عند «ابدؤوا» على الجميع أن يلتزموا الصمت التام، وآخر من يصدر صوتًا يفوز. صعبة على نحو خادع وهادئة على نحو مريح — اللعبة الوحيدة التي تُكافئ من اقترح لعبها."}}];
</script>

{ no:"21", cat:"any", tone:"Absurd", cast:"2 actors", titleEn:"Two Socks in a Dryer", titleAr:"جوربان في النشّافة",

{ no:"49", cat:"any", tone:"Funny", cast:"2 actors", titleEn:"The Haircut You Didn't Ask For", titleAr:"القصّة التي لم تطلبها",

{ no:"51", cat:"any", tone:"Heartfelt", cast:"2 actors", titleEn:"You Changed My Life", titleAr:"أنت غيّرت حياتي",
  setupEn:"A teacher and a grown-up former student meet again by chance.",

{ no:"65", cat:"couple", tone:"Funny", cast:"2 actors", titleEn:"The Quietest Fight", titleAr:"أهدأ شجار",

{ no:"66", cat:"couple", tone:"Romantic", cast:"2 actors", titleEn:"Vows, No Preparation", titleAr:"عهود بلا تحضير",
  setupEn:"Say your wedding vows on the spot — no notes, just what you feel right now.",

  lines:[
    {who:"A · أ", en:"I didn't write anything down. I thought I'd know what to say when I looked at you.", ar:"لم أكتب شيئًا. ظننت أنني سأعرف ما أقول حين أنظر إليك."},

  ], outroEn:"Finish the vows in your own words.", outroAr:"أكملا العهود بكلماتكما." },

{ no:"71", cat:"any", tone:"Funny", cast:"1 actor", titleEn:"The Hero and the Bug", titleAr:"البطل والحشرة",

    {who:"Hero · البطل", en:"It has… eight legs. Or six. I won't get close enough to count.", ar:"لديها… ثماني أرجل. أو ستّ. لن أقترب بما يكفي لأعدّها."},
    {who:"Hero · البطل", en:"I've faced armies. Explosions. A very rude landlord. But THIS?", ar:"واجهتُ جيوشًا. انفجارات. ومالك عقار وقحًا جدًا. لكن هذه؟"},

    {who:"Hero · البطل", en:"(whisper) If I don't make it… tell my mother I was brave. Mostly.", ar:"(همسًا) إن لم أنجُ… أخبروا أمي أنني كنت شجاعًا. في الغالب."},
  ], outroEn:"Improvise the final showdown.", outroAr:"ارتجل المواجهة الأخيرة." },

{ no:"72", cat:"any", tone:"Heartfelt", cast:"2 actors", titleEn:"The Goodbye You Never Said", titleAr:"الوداع الذي لم يُقَل",
  setupEn:"Two people finally speak the farewell they never got to say. Slow. Honest.",

رهني ما هي الصفات التي أبحث عنها في شريك الحياة ؟ ماذا أريد من زوجي أن يكون؟ ايه حاجة انا وانت بنعملها مع بعض وانت ما بتعملهاش مع اي حد تاني من صحابك؟ ٢. ايه حاجة بتعصبك مني قوي بس عشان احنا قريبين انت خلاص اتعودت عليها؟ متى تشعر إنك بأكثر حالات القرب المعنوي مني؟ من 1 لـ 10 كيف تقيّم رومانسية شريكك؟ وش يرفع درجته؟ لو انت بتتكلم عني مع حد غريب ايه الحاجة الوحيدة اللي انت هتحذرهم منها لما يجوا يتعملوا معايا؟ لو لم يكن لي اسم ماذا ستسميني لنفترض اني سأقدم لك ما يجعلك سعيد ماذا ستطلب ؟ What am I better at than anyone else you have met? A) Listening B) Jokes C) Planning D) Vibes If you could ban me from doing one thing, what would it be? A) Late-night scrolling B) Overthinking C) Interrupting D) Snoozing alarms What is the most \"me\" moment you have ever seen? A) Laughing at my own joke B) Fixing everyone's plan C) Group therapist mode D) Making a playlist What is one habit of mine you secretly find funny? A) Repeating myself B) Dramatic sighs C) Random dancing D) Talking to myself What kind of mood do I bring into a room first? A) Calm energy B) Chaos C) Comfort D) Fun What's something you wish other people appreciated about you more? My crisis text starts with: A) Okay so · B) Don't freak . C) Hear me out . D) You'll laugh What do I overshare about? A) Work drama · B) Food opinions · C) Family tea D) Random facts? If I vanished at a party, where would you look to find me? A) Snack table · B) Bathroom mirror . C) Dog corner · D) New friends? If we could relive one chaotic day together, what are we choosing? What song immediately reminds you of old memories with me? What place instantly takes you back to a specific era of ours? What old argument feels funny now? What promise did we actually keep? What's something you'd tell me if you knew I'd fully believe you? What's one thing you wish I could see about myself? What part of me do you think people misunderstand the most? When do I seem the most like myself? شخص ستتصل به ان اخطأت و انت تعلم انه لن يلومك What side of me /* tone translations for On Stage */
const TONE_AR={Funny:"مرِح",Heartfelt:"مؤثّر",Absurd:"عبثي",Light:"خفيف",Flirty:"مغازلة",Romantic:"رومانسي"};
const CAST_AR=s=>s.replace(/(\d+)\+?\s*actors?/i,(m,n)=>n+"+ ممثلين").replace(/1 actor/i,"ممثل واحد").replace(/2 actors/i,"ممثلان").replace(/3\+ actors/i,"3+ ممثلين");

/* ============ state ============ */
let LANG = (navigator.language||'').toLowerCase().startsWith('ar') ? 'ar' : 'en';
let VIEW = 'home';
let PARAM = null;
const app = document.getElementById('app');
const crumb = document.getElementById('crumb');
const foot = document.getElementById('foot');
const T = ()=>UITX[LANG];

function setAccent(c){document.documentElement.style.setProperty('--accent',c);}
function applyDir(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';}

function go(v,p){VIEW=v;PARAM=p||null;window.scrollTo({top:0,behavior:'instant'});render();}

document.getElementById('brandBtn').onclick=()=>go('home');
document.getElementById('langBtn').onclick=()=>{LANG=LANG==='ar'?'en':'ar';render();};

/* ============ render root ============ */
function render(){
  applyDir();
  document.getElementById('langBtn').textContent=T().lang;
  crumb.className='crumb';
  const acc={home:'var(--plum)',qcats:'var(--plum)',qdeck:(deckByKey(PARAM||'')||{}).accent||'var(--plum)',
    onstage:'var(--curtain)',games:'var(--terra)'}[VIEW]||'var(--plum)';
  setAccent(acc);
  if(VIEW!=='home'){crumb.classList.add('show');
    const nm={qcats:T().qHead,qdeck:T().qHead,onstage:T().decks.s.name,games:T().decks.g.name}[VIEW];
    crumb.textContent='‹ '+nm;
    crumb.onclick=()=>go(VIEW==='qdeck'?'qcats':'home');
  }
  const R={home:renderHome,qcats:renderQCats,qdeck:renderQDeck,onstage:renderOnStage,games:renderGames}[VIEW];
  app.innerHTML=''; app.appendChild(R());
  foot.innerHTML = LANG==='ar'
    ? 'لمّة · Lammeh — بطاقات أسئلة، ومشاهد على الخشبة، وألعاب كلاسيكية. جميعها ملكية عامة أو من تأليف حُيّا، متاحة للجميع.'
    : 'Lammeh · لمّة — question cards, On Stage scenes, and classic games. Free for the whole table.';
}

/* ============ HOME ============ */
function renderHome(){
  const t=T(), w=el('div','view');
  const qCount=QORDER.reduce((n,k)=>n+Q[k].items.length,0);
  w.innerHTML=`
   <section class="hero">
     <div class="eyebrow">${t.heroEye}</div>
     <h1 class="disp">${LANG==='ar'?'لمّة':'Lam<span class="amp">·</span>meh'}</h1>
     <p>${t.heroSub}</p>
   </section>
   <div class="decks">
     ${deckCard('q','d-q','🎴',t.decks.q,t.countQ(qCount+importCount))}
     ${deckCard('s','d-s','🎭',t.decks.s,t.countS)}
     ${deckCard('g','d-g','🎲',t.decks.g,t.countG)}
   </div>
   <p class="home-note"><b>${LANG==='ar'?'٣ مجموعات · لغتان':'3 decks · 2 languages'}</b> — ${t.homeNote}</p>`;
  const map={q:()=>go('qcats'),s:()=>go('onstage'),g:()=>go('games')};
  w.querySelectorAll('.deck').forEach(d=>d.onclick=map[d.dataset.k]);
  return w;
}
function deckCard(k,cls,emoji,info,count){
  return `<button class="deck ${cls}" data-k="${k}">
    <span class="stack"><i></i><i></i></span>
    <span class="go">→</span>
    <span class="emoji">${emoji}</span>
    <h3>${info.name}</h3>
    <span class="sub">${info.sub}</span>
    <span class="count">${count}</span>
  </button>`;
}

/* ============ QUESTIONS — categories ============ */
function renderQCats(){
  const t=T(),w=el('div','view');
  const qCount=QORDER.reduce((n,k)=>n+Q[k].items.length,0);
  w.innerHTML=`<div class="shead"><div class="titles">
     <h2 class="disp">${t.qHead}</h2><p>${t.qSub}</p></div>
     <span class="badge">${t.qBadge(qCount+importCount)}</span></div>
     <div class="grouplab">${t.groupBilingual}</div><div class="cats" id="g1"></div>
     <div class="grouplab" style="margin-top:2rem">${t.groupImported}</div><div class="cats" id="g2"></div>`;
  const mk=(grid,key,c)=>{
    const b=el('button','catcard');
    b.style.background=`linear-gradient(155deg, ${lighten(c.accent)}, ${c.accent})`;
    b.innerHTML=`<span class="glow"></span><span class="ce">${c.emoji}</span>
      <span><span class="cn">${LANG==='ar'?c.labelAr:c.labelEn}</span>
      <span class="cc">${c.items.length} ${LANG==='ar'?'بطاقة':'cards'}</span></span>`;
    b.onclick=()=>go('qdeck',key);
    grid.appendChild(b);
  };
  const g1=w.querySelector('#g1'), g2=w.querySelector('#g2');
  QORDER.forEach(k=>mk(g1,k,Q[k]));
  IQORDER.forEach(k=>mk(g2,'i:'+k,IQ[k]));
  return w;
}

/* ============ QUESTIONS — draw deck ============ */
let qIdx=0, qShow2=false, qSeq=[];
function renderQDeck(){
  const t=T(),c=deckByKey(PARAM),w=el('div','view');
  const bilingual=c.items.some(it=>it.ar&&it.en);
  qSeq=shuffled(c.items.length); qIdx=0; qShow2=false;
  w.innerHTML=`
    <div class="shead"><div class="titles">
      <h2 class="disp">${c.emoji} ${LANG==='ar'?c.labelAr:c.labelEn}</h2>
      <p>${bilingual?t.tapCard:(LANG==='ar'?'اسحب، أو التالية للبطاقة التالية':'Draw a card, or Next to move on')}</p></div>
      <span class="badge">${c.items.length} ${LANG==='ar'?'بطاقة':'cards'}</span></div>
    <div class="deckwrap">
      <div class="qstage"><div class="qcard" id="qc"></div></div>
      <div class="qfoot">
        <button class="btn btn-ghost" id="qprev">‹ ${t.prev}</button>
        <span class="qprog" id="qprog"></span>
        <button class="btn btn-main" id="qnext">${t.next} ›</button>
        <button class="btn btn-ghost" id="qshuf">↻ ${t.shuffle}</button>
      </div>
    </div>`;
  const card=w.querySelector('#qc');
  const draw=()=>{
    const it=c.items[qSeq[qIdx]];
    const hasBoth=it.ar && it.en;
    // choose which language is primary; single-language items just show what they have
    let primary, alt, primDir, altDir;
    if(hasBoth){
      primary=LANG==='ar'?it.ar:it.en; alt=LANG==='ar'?it.en:it.ar;
      primDir=LANG==='ar'?'rtl':'ltr'; altDir=LANG==='ar'?'ltr':'rtl';
    }else{
      primary=it.ar||it.en; alt=''; primDir=it.ar?'rtl':'ltr';
    }
    const showP=(hasBoth&&qShow2)?alt:primary;
    const showPDir=(hasBoth&&qShow2)?altDir:primDir;
    const showA=hasBoth?((qShow2)?primary:alt):'';
    const showADir=(qShow2)?primDir:altDir;
    card.classList.remove('turn');void card.offsetWidth;card.classList.add('turn');
    card.innerHTML=`<div class="qnum">${LANG==='ar'?c.labelAr:c.labelEn} · ${qIdx+1}</div>
      <div class="qtxt" dir="${showPDir}">${showP}</div>
      ${hasBoth?`<div class="qalt" dir="${showADir}">${showA}</div>`:''}`;
    w.querySelector('#qprog').textContent=t.ofN(qIdx+1,c.items.length);
    w.querySelector('#qprev').disabled=qIdx===0;
  };
  card.onclick=()=>{qShow2=!qShow2;draw();};
  w.querySelector('#qnext').onclick=()=>{qIdx=(qIdx+1)%c.items.length;qShow2=false;draw();};
  w.querySelector('#qprev').onclick=()=>{if(qIdx>0){qIdx--;qShow2=false;draw();}};
  w.querySelector('#qshuf').onclick=()=>{qSeq=shuffled(c.items.length);qIdx=0;qShow2=false;draw();};
  setTimeout(draw,0);
  return w;
}

/* ============ ON STAGE ============ */
let sWho='all', sTone='all', sTab='scenes';
function renderOnStage(){
  const t=T(),w=el('div','view');
  w.innerHTML=`<div class="shead"><div class="titles">
     <h2 class="disp">${t.sHead}</h2><p>${t.sSub}</p></div>
     <span class="badge">${t.sBadge}</span></div>
     <div class="subnav" id="stabs"></div>
     <div id="sbody"></div>`;
  const tabs=w.querySelector('#stabs');
  [['scenes',t.scenesTab],['scripts',t.scriptsTab]].forEach(([k,lab])=>{
    const b=el('button','chip'+(sTab===k?' on':''));b.textContent=lab;
    b.onclick=()=>{sTab=k;renderSBody(w);};tabs.appendChild(b);
  });
  renderSBody(w);
  return w;
}
function renderSBody(w){
  const t=T(),body=w.querySelector('#sbody');
  // update tab states
  w.querySelectorAll('#stabs .chip').forEach((b,i)=>b.classList.toggle('on',(i===0)===(sTab==='scenes')));
  if(sTab==='scripts'){body.innerHTML='';body.appendChild(renderScripts());return;}
  body.innerHTML=`
    <div class="bar" id="sfilters"></div>
    <div class="deckwrap" style="margin-bottom:1.6rem">
      <div class="qstage" style="min-height:230px"><div class="qcard" id="sc" style="min-height:210px"></div></div>
      <div class="qfoot"><button class="btn btn-main" id="sdraw">🎭 ${t.drawScene}</button></div>
    </div>
    <div class="grid" id="sgrid"></div>`;
  // filters
  const fb=body.querySelector('#sfilters');
  const whoChips=[['all',t.all],['any',t.who.any],['couple',t.who.couple],['group',t.who.group]];
  whoChips.forEach(([k,lab])=>{const c=el('button','chip'+(sWho===k?' on':''));c.textContent=lab;
    c.onclick=()=>{sWho=k;renderSBody(w);};fb.appendChild(c);});
  const tones=['all',...Array.from(new Set(SCENES.map(s=>s.tone)))];
  tones.forEach(k=>{const lab=k==='all'?t.allTones:(LANG==='ar'?(TONE_AR[k]||k):k);
    const c=el('button','chip'+(sTone===k?' on':''));c.textContent=lab;
    c.onclick=()=>{sTone=k;renderSBody(w);};fb.appendChild(c);});
  const list=SCENES.filter(s=>(sWho==='all'||s.cat===sWho)&&(sTone==='all'||s.tone===sTone));
  // draw card
  const sc=body.querySelector('#sc');
  const drawScene=()=>{
    if(!list.length){sc.innerHTML=`<div class="qtxt">—</div>`;return;}
    const s=list[Math.floor(Math.random()*list.length)];
    sc.style.borderTopColor=({any:'#B8862F',couple:'#C25A70',group:'#2F8F83'})[s.cat];
    sc.classList.remove('turn');void sc.offsetWidth;sc.classList.add('turn');
    sc.innerHTML=`<div class="qnum">${LANG==='ar'?(TONE_AR[s.tone]||s.tone):s.tone} · ${LANG==='ar'?CAST_AR(s.cast):s.cast}</div>
      <div class="qtxt" style="font-size:clamp(1.2rem,3.6vw,1.55rem)" ${LANG==='ar'?'':'dir="ltr"'}>${LANG==='ar'?s.ar:s.en}</div>`;
  };
  body.querySelector('#sdraw').onclick=drawScene;
  drawScene();
  // grid
  const grid=body.querySelector('#sgrid');
  if(!list.length){grid.innerHTML=`<p class="empty">${LANG==='ar'?'لا مشاهد بهذا التصفية.':'No scenes match.'}</p>`;return;}
  list.forEach(s=>{
    const card=el('div','icard');
    card.innerHTML=`<div class="tags">
        <span class="pill p-${s.cat}">${T().who[s.cat]}</span>
        <span class="pill" style="background:#efe7f0;color:#5b3a54">${LANG==='ar'?(TONE_AR[s.tone]||s.tone):s.tone}</span></div>
      <div class="body" ${LANG==='ar'?'':'dir="ltr"'}>${LANG==='ar'?s.ar:s.en}</div>
      <div class="meta">${LANG==='ar'?CAST_AR(s.cast):s.cast}</div>`;
    grid.appendChild(card);
  });
}
function renderScripts(){
  const wrap=el('div','scripts');
  scripts.forEach((s,i)=>{
    const box=el('div','script');
    const roles={};let ci=0;const cols=speakerColors;
    const linesHtml=s.lines.map(l=>{
      if(!(l.who in roles)){roles[l.who]=cols[ci%cols.length];ci++;}
      const col=roles[l.who];
      const primary=LANG==='ar'?l.ar:l.en, alt=LANG==='ar'?l.en:l.ar;
      return `<div class="line"><span class="who" style="color:${col}">${l.who}</span>
        <span ${LANG==='ar'?'':'dir="ltr"'}>${primary}</span><br>
        <span class="alt" ${LANG==='ar'?'dir="ltr"':''}>${alt}</span></div>`;
    }).join('');
    box.innerHTML=`<button aria-expanded="false">
        <span class="stx"><span class="st">${LANG==='ar'?s.titleAr:s.titleEn}</span>
        <span class="stsub">${T().who[s.cat]} · ${LANG==='ar'?(TONE_AR[s.tone]||s.tone):s.tone} · ${LANG==='ar'?CAST_AR(s.cast):s.cast}</span></span>
        <span class="chev">▾</span></button>
      <div class="lines"><div class="in">
        <div class="setup" ${LANG==='ar'?'':'dir="ltr"'}>${LANG==='ar'?s.setupAr:s.setupEn}</div>
        ${linesHtml}
        <div class="outro" ${LANG==='ar'?'':'dir="ltr"'}>${LANG==='ar'?s.outroAr:s.outroEn}</div>
      </div></div>`;
    const btn=box.querySelector('button');
    btn.onclick=()=>{box.classList.toggle('open');btn.setAttribute('aria-expanded',box.classList.contains('open'));};
    wrap.appendChild(box);
  });
  return wrap;
}

/* ============ GAMES ============ */
let gSearch='', gSize='all';
function renderGames(){
  const t=T(),w=el('div','view');
  const cats=UI[LANG].cats;
  w.innerHTML=`<div class="shead"><div class="titles">
     <h2 class="disp">${t.gHead}</h2><p>${t.gSub}</p></div>
     <span class="badge">${t.gBadge}</span></div>
    <div class="bar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gsearch" type="search" placeholder="${t.searchG}" value="${gSearch}"></div>
    </div>
    <div class="bar" id="gchips"></div>
    <nav class="catnav" id="gnav"></nav>
    <div id="gsections"></div>`;
  const chips=w.querySelector('#gchips');
  Object.entries(t.size).forEach(([k,lab])=>{
    const c=el('button','chip'+(gSize===k?' on':''));c.textContent=lab;
    c.onclick=()=>{gSize=k;paintGames(w);};chips.appendChild(c);
  });
  const inp=w.querySelector('#gsearch');
  inp.oninput=()=>{gSearch=inp.value;paintGames(w);};
  paintGames(w);
  return w;
}
function paintGames(w){
  const t=T(),cats=UI[LANG].cats, q=gSearch.trim().toLowerCase();
  // filter
  const match=g=>{
    if(gSize!=='all' && !g.tags.includes(gSize)) return false;
    if(!q) return true;
    const blob=(g.en.name+' '+g.en.how+' '+g.en.needs+' '+g.ar.name+' '+g.ar.how+' '+g.tags.join(' ')).toLowerCase();
    return blob.includes(q);
  };
  const nav=w.querySelector('#gnav'); nav.innerHTML='';
  const sections=w.querySelector('#gsections'); sections.innerHTML='';
  let shown=0;
  cats.forEach(([key,name,desc])=>{
    const list=games.filter(g=>g.cat===key && match(g));
    if(!list.length) return;
    shown+=list.length;
    const chip=el('button','chip');chip.textContent=name;
    chip.onclick=()=>document.getElementById('gs-'+key).scrollIntoView({behavior:'smooth',block:'start'});
    nav.appendChild(chip);
    const sec=el('section','catsec');sec.id='gs-'+key;
    sec.innerHTML=`<h3>${name}</h3><div class="cdesc">${desc}</div><div class="grid"></div>`;
    const grid=sec.querySelector('.grid');
    list.forEach(g=>{
      const it=g[LANG];
      const card=el('article','icard');
      card.innerHTML=`<h4 ${LANG==='ar'?'':'dir="ltr"'}>${it.name}</h4>
        <div class="meta">${it.players} · <span class="meter">${[1,2,3].map(n=>`<i class="${n<=g.meter?'on':''}"></i>`).join('')}</span></div>
        <div class="body" ${LANG==='ar'?'':'dir="ltr"'}>${it.needs}</div>
        <div class="body" ${LANG==='ar'?'':'dir="ltr"'}>${it.how}</div>`;
      grid.appendChild(card);
    });
    sections.appendChild(sec);
  });
  if(!shown){sections.innerHTML=`<p class="empty">${t.noGames}</p>`;}
}

/* ============ helpers ============ */
function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function lighten(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16)+38,g=((n>>8)&255)+30,b=(n&255)+30;
  r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);return `rgb(${r},${g},${b})`;}

render();
