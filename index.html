<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لمّة · Lammeh — الأسئلة و على الخشبة و الألعاب</title>
<meta name="description" content="لمّة: كل ما تحتاجه لجمعة واحدة — 288 بطاقة سؤال، و85 مشهد تمثيل على الخشبة، و101 لعبة كلاسيكية. بالعربية والإنجليزية. Lammeh: everything for one gathering — question cards, roleplay scenes, and classic party games, in Arabic & English.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="لمّة · Lammeh">
<meta property="og:description" content="بطاقات أسئلة، مشاهد تمثيل، وألعاب — كل شيء للّمة، بالعربية والإنجليزية.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='10' width='52' height='72' rx='10' transform='rotate(-9 44 46)' fill='%23512B47'/%3E%3Crect x='30' y='18' width='52' height='72' rx='10' transform='rotate(7 56 54)' fill='%23E07A3E'/%3E%3Ccircle cx='56' cy='54' r='11' fill='%23FBF5F1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF5F1; --card:#FFFFFF; --ink:#2A2233; --soft:#7A6A70;
    --line:#EFE4DD; --line2:#E4D7CE;
    --plum:#512B47; --coral:#E05A54; --teal:#1E7A82; --amber:#E09B1E;
    --orange:#E07A3E; --indigo:#31456B; --terra:#C0603C; --dusty:#4C7CA6;
    --curtain:#3A1A2E; --gold:#E7B34A;
    --accent:#512B47;         /* set per-view */
    --shadow:0 18px 44px -20px rgba(42,34,51,.42);
    --shadow-sm:0 8px 20px -12px rgba(42,34,51,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  [dir="rtl"] body{font-family:'Tajawal',system-ui,sans-serif;line-height:1.75}
  .disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
  [dir="rtl"] .disp{font-family:'Cairo',sans-serif}
  em{font-style:italic}
  [dir="rtl"] em{font-style:normal}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:inherit}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.6rem;
    padding:.7rem clamp(1rem,4vw,2rem);
    background:rgba(251,245,241,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:700;letter-spacing:.01em}
  .brand .mk{width:26px;height:26px;flex:0 0 auto}
  .brand b{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem}
  [dir="rtl"] .brand b{font-family:'Cairo',sans-serif;font-weight:700}
  .brand small{color:var(--soft);font-weight:500;font-size:.9rem}
  .spacer{flex:1}
  .crumb{border:1px solid var(--line2);border-radius:999px;padding:.4rem .85rem;
    font-size:.82rem;color:var(--soft);font-weight:600;display:none;align-items:center;gap:.4rem}
  .crumb.show{display:inline-flex}
  .crumb:hover{color:var(--ink);border-color:var(--accent)}
  .lang{border:1px solid var(--line2);border-radius:999px;padding:.4rem .9rem;
    font-size:.82rem;font-weight:600;color:var(--ink);background:var(--card)}
  .lang:hover{border-color:var(--accent);color:var(--accent)}

  main{max-width:1120px;margin:0 auto;padding:clamp(1.4rem,4vw,3rem) clamp(1rem,4vw,2rem) 5rem}
  .view{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- HOME ---------- */
  .hero{text-align:center;padding:1.4rem 0 2.4rem}
  .hero .eyebrow{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--plum);font-weight:700;margin-bottom:1rem}
  [dir="rtl"] .hero .eyebrow{letter-spacing:.06em}
  .hero h1{font-size:clamp(2.8rem,9vw,5rem);line-height:1.02;font-weight:600;letter-spacing:-.02em}
  [dir="rtl"] .hero h1{font-weight:800;letter-spacing:0}
  .hero h1 .amp{color:var(--orange)}
  .hero p{max-width:38ch;margin:1.1rem auto 0;color:var(--soft);font-size:1.06rem}

  .decks{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1rem,2.6vw,1.7rem);margin-top:.6rem}

  @media(max-width:760px){.decks{grid-template-columns:1fr;max-width:440px;margin-inline:auto}
}
  .grouplab{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--soft);margin:.2rem 0 .8rem}
  [dir="rtl"] .grouplab{letter-spacing:.02em}
  .deck{position:relative;border-radius:22px;padding:1.7rem 1.5rem 1.5rem;text-align:start;
    color:#fff;overflow:hidden;min-height:230px;display:flex;flex-direction:column;
    justify-content:flex-end;box-shadow:var(--shadow);isolation:isolate;
    transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
  .deck:hover{transform:translateY(-6px)}
  .deck:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .deck::before,.deck::after{content:"";position:absolute;inset:0;border-radius:22px;z-index:-1}
  /* stacked-card illusion */
  .deck .stack{position:absolute;inset:0;z-index:-2}
  .deck .stack i{position:absolute;border-radius:20px;background:rgba(255,255,255,.16)}
  .deck .stack i:nth-child(1){inset:14px 26px auto 14px;height:34px;top:-12px;transform:rotate(-3deg)}
  .deck .stack i:nth-child(2){inset:8px 16px auto 24px;height:34px;top:-6px;transform:rotate(2.4deg)}
  .d-q{background:linear-gradient(150deg,#6a3a5e,var(--plum))}
  .d-s{background:linear-gradient(150deg,#5a2740,var(--curtain))}
  .d-g{background:linear-gradient(150deg,#d47a4e,var(--terra))}
  .deck .emoji{font-size:2rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
  .deck h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;margin-top:.7rem}
  [dir="rtl"] .deck h3{font-family:'Cairo',sans-serif;font-weight:700}
  .deck .sub{opacity:.86;font-size:.92rem;margin-top:.15rem}
  .deck .count{margin-top:.9rem;font-size:.8rem;font-weight:600;opacity:.92;
    border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:.28rem .7rem;align-self:flex-start}
  .deck .go{position:absolute;top:1.3rem;inset-inline-end:1.3rem;width:34px;height:34px;
    border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;
    font-size:1.1rem;transition:transform .25s,background .25s}
  [dir="rtl"] .deck .go{transform:scaleX(-1)}
  .deck:hover .go{background:rgba(255,255,255,.32);transform:translateX(3px)}
  [dir="rtl"] .deck:hover .go{transform:translateX(-3px) scaleX(-1)}

  .home-note{margin-top:2.4rem;text-align:center;color:var(--soft);font-size:.9rem}
  .home-note b{color:var(--ink);font-weight:600}

  /* ---------- section head ---------- */
  .shead{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
  .shead .titles h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.7rem);
    line-height:1.05;color:var(--accent)}
  [dir="rtl"] .shead .titles h2{font-family:'Cairo',sans-serif;font-weight:800}
  .shead .titles p{color:var(--soft);margin-top:.35rem;max-width:52ch}
  .shead .badge{margin-inline-start:auto;font-size:.8rem;font-weight:700;color:var(--accent);
    background:#f2ebe6;background:color-mix(in srgb,var(--accent) 12%,#fff);border-radius:999px;padding:.4rem .85rem;white-space:nowrap}

  /* ---------- category grid (questions) ---------- */
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.9rem}
  .catcard{position:relative;border-radius:18px;padding:1.2rem 1.1rem;text-align:start;color:#fff;
    min-height:132px;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .25s,box-shadow .25s}
  .catcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .catcard:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .catcard .ce{font-size:1.7rem;line-height:1}
  .catcard .cn{font-family:'Fraunces',serif;font-weight:600;font-size:1.12rem}
  [dir="rtl"] .catcard .cn{font-family:'Cairo',sans-serif;font-weight:700}
  .catcard .cc{font-size:.76rem;opacity:.85;font-weight:600;margin-top:.15rem}
  .catcard .glow{position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;
    border-radius:50%;background:rgba(255,255,255,.14)}

  /* ---------- deck / draw card ---------- */
  .deckwrap{max-width:560px;margin:0 auto}
  .qstage{position:relative;perspective:1400px;margin:.5rem auto 1.4rem;min-height:340px;
    display:grid;place-items:center}
  .qcard{position:relative;width:100%;background:var(--card);border-radius:24px;
    border:1px solid var(--line);box-shadow:var(--shadow);
    padding:2.2rem 1.8rem;min-height:320px;display:flex;flex-direction:column;
    border-top:6px solid var(--accent)}
  .qcard .qnum{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent)}
  .qcard .qtxt{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.4rem,4.4vw,2rem);
    line-height:1.32;margin:auto 0;text-align:center;color:var(--ink)}
  [dir="rtl"] .qcard .qtxt{font-family:'Cairo',sans-serif;font-weight:600;line-height:1.55}
  .qcard .qalt{margin-top:1.1rem;padding-top:1rem;border-top:1px dashed var(--line2);
    color:var(--soft);font-size:.98rem;text-align:center}
  .qcard.turn{animation:flip .42s ease both}
  @keyframes flip{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
  .qfoot{display:flex;align-items:center;gap:.7rem;justify-content:center;flex-wrap:wrap}
  .qprog{color:var(--soft);font-size:.85rem;font-weight:600;min-width:64px;text-align:center}
  .btn{border-radius:999px;padding:.72rem 1.4rem;font-weight:600;font-size:.95rem;
    display:inline-flex;align-items:center;gap:.45rem;transition:transform .15s,filter .2s,background .2s}
  .btn:active{transform:scale(.96)}
  .btn-main{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
  .btn-main:hover{filter:brightness(1.07)}
  .btn-ghost{border:1px solid var(--line2);background:var(--card);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .backrow{margin-bottom:1.2rem}

  /* ---------- filters / chips ---------- */
  .bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem;align-items:center}
  .search{flex:1;min-width:220px;display:flex;align-items:center;gap:.5rem;background:var(--card);
    border:1px solid var(--line2);border-radius:999px;padding:.55rem 1rem}
  .search:focus-within{border-color:var(--accent)}
  .search input{border:none;outline:none;background:none;flex:1;font:inherit;color:var(--ink)}
  .search svg{width:18px;height:18px;stroke:var(--soft);fill:none;stroke-width:2}
  .chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;
    padding:.5rem .95rem;font-size:.86rem;font-weight:600;color:var(--soft);white-space:nowrap;transition:.18s}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ---------- item grids (scenes / games) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1rem}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:1.15rem 1.15rem 1.2rem;box-shadow:var(--shadow-sm);position:relative;
    display:flex;flex-direction:column;gap:.5rem;transition:transform .2s,box-shadow .2s}
  .icard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .icard .tags{display:flex;gap:.4rem;flex-wrap:wrap;font-size:.7rem;font-weight:700}
  .pill{border-radius:999px;padding:.2rem .55rem;letter-spacing:.02em}
  .p-any{background:#f3e9d5;color:#8a6a1f}.p-couple{background:#f6dfe4;color:#a2465c}.p-group{background:#d7ecea;color:#1e6b64}
  .icard h4{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;line-height:1.25}
  [dir="rtl"] .icard h4{font-family:'Cairo',sans-serif;font-weight:700}
  .icard .body{color:var(--soft);font-size:.93rem;line-height:1.5}
  .icard .body b{color:var(--ink);font-weight:600}
  .icard .meta{font-size:.76rem;color:var(--soft);font-weight:600;margin-top:.1rem}
  .meter{display:inline-flex;gap:2px;vertical-align:middle}
  .meter i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
  .meter i.on{background:var(--accent)}

  .catsec{margin-top:2.2rem}
  .catsec > h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;color:var(--accent);
    margin-bottom:.2rem}
  [dir="rtl"] .catsec > h3{font-family:'Cairo',sans-serif;font-weight:700}
  .catsec > .cdesc{color:var(--soft);font-size:.9rem;margin-bottom:.9rem}
  .catnav{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.6rem}

  /* ---------- scripts accordion ---------- */
  .scripts{display:grid;gap:.7rem;max-width:760px}
  .script{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .script > button{width:100%;display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;text-align:start}
  .script .st{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem}
  [dir="rtl"] .script .st{font-family:'Cairo',sans-serif;font-weight:700}
  .script .stx{flex:1}
  .script .stsub{color:var(--soft);font-size:.8rem;font-weight:600;margin-top:.1rem}
  .script .chev{transition:transform .25s;color:var(--soft)}
  .script.open .chev{transform:rotate(180deg)}
  .script .lines{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .script.open .lines{max-height:1600px}
  .lines .in{padding:0 1.1rem 1.2rem}
  .setup{color:var(--soft);font-style:italic;font-size:.92rem;margin:.2rem 0 1rem;
    border-inline-start:3px solid var(--gold);padding-inline-start:.8rem}
  [dir="rtl"] .setup{font-style:normal}
  .line{margin:.55rem 0;font-size:.96rem;line-height:1.5}
  .line .who{font-weight:700;font-size:.82rem;display:block;margin-bottom:.1rem}
  .line .alt{color:var(--soft);font-size:.86rem}
  .outro{margin-top:1rem;padding-top:.9rem;border-top:1px dashed var(--line2);
    font-weight:600;color:var(--curtain)}
  [dir="rtl"] .outro{color:var(--plum)}

  .empty{text-align:center;color:var(--soft);padding:3rem 1rem;font-size:1rem}
  .subnav{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
  .subnav .chip.on{background:var(--accent);border-color:var(--accent)}

  footer{max-width:1120px;margin:0 auto;padding:1.6rem 1.5rem 3rem;color:var(--soft);
    font-size:.82rem;text-align:center;border-top:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="brand" id="brandBtn" aria-label="Home">
    <svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><rect x="18" y="10" width="52" height="72" rx="10" transform="rotate(-9 44 46)" fill="#512B47"/><rect x="30" y="18" width="52" height="72" rx="10" transform="rotate(7 56 54)" fill="#E07A3E"/><circle cx="56" cy="54" r="11" fill="#FBF5F1"/></svg>
    <b>لمّة</b><small>Lammeh</small>
  </button>
  <span class="spacer"></span>
  <button class="crumb" id="crumb"></button>
  <button class="lang" id="langBtn"></button>
</div>
<main id="app"></main>
<footer id="foot"></footer>

<script>
const games = [{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"conversation","en":{"name":"Two Truths and a Lie","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Each person, in turn, says three statements about themselves — two true, one made up. Everyone else debates and guesses which one is the lie. The trick is making your truths sound unbelievable and your lie sound ordinary. Great for getting to know new people or surprising old friends."},"ar":{"name":"حقيقتان وكذبة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يقول كل شخص بدوره ثلاث عبارات عن نفسه: اثنتان صحيحتان وواحدة مختلقة. على البقية أن يتناقشوا ويخمّنوا أيّها الكذبة. الحيلة أن تجعل حقائقك تبدو غير معقولة وكذبتك تبدو عادية. لعبة رائعة للتعرّف على الآخرين أو لمفاجأة الأصدقاء القدامى."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"conversation","en":{"name":"Would You Rather","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Pose an impossible choice between two options — silly, tough, or gross. Everyone answers and, more importantly, defends why. The fun lives in the arguments, so keep the dilemmas evenly matched so neither side is an easy pick."},"ar":{"name":"ماذا تفضّل؟","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"اطرح خيارًا مستحيلًا بين أمرين — طريفًا أو صعبًا أو مقزّزًا. يجيب الجميع، والأهمّ أن يبرّروا اختيارهم. المتعة في النقاش، لذا اجعل الخيارين متكافئين حتى لا يكون أحدهما سهلًا."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"guessing","en":{"name":"20 Questions","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"One person secretly thinks of a person, place, or object. Everyone else has twenty yes-or-no questions to narrow it down and guess what it is. Smart players start wide (\"Is it alive?\") before zeroing in. Guess it in time and the guessers win; stump them and the thinker does."},"ar":{"name":"عشرون سؤالًا","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يفكّر شخص سرًّا في إنسان أو مكان أو شيء. على البقية طرح عشرين سؤالًا إجابتها بنعم أو لا لتضييق الاحتمالات والتخمين. الأذكياء يبدؤون بأسئلة واسعة («هل هو كائن حيّ؟») ثم يقتربون. من يخمّن ضمن العدد يفوز، ومن يعجز يفوز صاحب السرّ."}},{"tags":["two","small","nosupplies"],"meter":1,"cat":"conversation","en":{"name":"The Question Game","players":"2+ players","needs":"<b>You need:</b> Nothing — a written list of prompts is optional.","how":"Take turns asking each other one honest question, from light to deep. Anything goes as long as both people agree to answer truthfully. It's a favourite for couples and close friends because it turns curiosity into a whole evening. Pass if a question is too much — no penalty."},"ar":{"name":"لعبة الأسئلة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء — وقائمة أسئلة مكتوبة اختيارية.","how":"تبادلوا الأسئلة الصادقة، من الخفيف إلى العميق. كل شيء مسموح ما دام الطرفان متّفقين على الإجابة بصدق. مفضّلة للأزواج والأصدقاء المقرّبين لأنها تحوّل الفضول إلى أمسية كاملة. تجاوز أي سؤال ثقيل بلا عقوبة."}},{"tags":["two","small","big"],"meter":1,"cat":"conversation","en":{"name":"Never Have I Ever","players":"2+ players","needs":"<b>You need:</b> Ten fingers each (or a drink/snack for the party version).","how":"Everyone holds up ten fingers. Going around, each person says something they've never done (\"Never have I ever ridden a horse\"). Anyone who has done it folds a finger down. Last person with fingers left wins — and you learn a lot about each other along the way. Keep the prompts as tame or as cheeky as your group prefers."},"ar":{"name":"لم يسبق لي قط","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> عشر أصابع لكل لاعب.","how":"يرفع الجميع عشرة أصابع. يقول كل شخص بدوره أمرًا لم يفعله قط («لم يسبق لي أن ركبت حصانًا»)، ومن سبق له فعله يطوي إصبعًا. آخر من يبقى لديه أصابع يفوز — وستعرفون الكثير عن بعضكم. اجعلوا العبارات لطيفة أو جريئة كما تشاء مجموعتكم."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"conversation","en":{"name":"Truth or Dare","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"On your turn you pick: truth (answer any question honestly) or dare (perform a harmless challenge). The rest of the group sets the question or the dare. Keep everything consensual and kind — the best rounds are funny, not humiliating. A classic that scales from a quiet pair to a loud party."},"ar":{"name":"صراحة أم تحدٍّ","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"في دورك تختار: صراحة (تجيب عن أي سؤال بصدق) أو تحدٍّ (تنفّذ مهمة بسيطة). تحدّد المجموعة السؤال أو التحدّي. أبقِ كل شيء بموافقة الجميع ولطيفًا — أفضل الجولات مضحكة لا مُحرِجة. كلاسيكية تناسب ثنائيًّا هادئًا أو حفلة صاخبة."}},{"tags":["two","small","nosupplies"],"meter":1,"cat":"word","en":{"name":"The Story Builder","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Build a single story together, adding one sentence — or just one word — each, going around the circle. Each person has to accept what came before and push it somewhere new. It spirals into wonderful nonsense fast. A gentler variant: everyone adds \"...and fortunately\" or \"...but unfortunately\" on their turn."},"ar":{"name":"بُناة الحكاية","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"ابنوا قصة واحدة معًا، يضيف كل شخص جملة — أو كلمة واحدة — بالتناوب. على كلٍّ أن يتقبّل ما سبق ويدفع الحكاية إلى مكان جديد. تتحوّل بسرعة إلى هراء بديع. صيغة ألطف: يضيف كل شخص «لحسن الحظ» أو «لسوء الحظ» في دوره."}},{"tags":["small","big"],"meter":2,"cat":"acting","en":{"name":"Charades","players":"4+ (teams)","needs":"<b>You need:</b> Slips of paper with words/phrases, a timer, two teams.","how":"One player silently acts out a word, film, or phrase while their team shouts guesses against the clock. No talking, no pointing at objects, no mouthing words — only gestures. Standard signals help: hold up fingers for the number of words, tug your ear for \"sounds like.\" Most correct guesses across rounds wins."},"ar":{"name":"التمثيل الصامت (شاراد)","players":"4 لاعبين فأكثر (فِرق)","needs":"<b>تحتاج إلى:</b> قصاصات ورق مكتوب عليها كلمات، ومؤقّت، وفريقان.","how":"يمثّل لاعب كلمة أو فيلمًا أو عبارة بصمت بينما يخمّن فريقه بأعلى صوت قبل انتهاء الوقت. ممنوع الكلام أو الإشارة إلى الأشياء أو تحريك الشفاه — الإيماءات فقط. إشارات معتادة تساعد: ارفع أصابعك لعدد الكلمات، والمس أذنك للدلالة على «قافية». الفريق الأكثر تخمينًا صحيحًا يفوز."}},{"tags":["small","big"],"meter":2,"cat":"guessing","en":{"name":"Who Am I?","players":"3+ players","needs":"<b>You need:</b> Sticky notes and a pen.","how":"Write a famous name (real or fictional) on a sticky note and press it to someone's forehead without letting them see it. Everyone wears one. On your turn you ask the group yes-or-no questions — \"Am I alive? Am I an athlete?\" — until you work out who you are. First to guess their own name wins."},"ar":{"name":"من أنا؟","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> أوراق لاصقة وقلم.","how":"اكتب اسم شخصية مشهورة (حقيقية أو خيالية) على ورقة لاصقة وألصقها على جبين لاعب دون أن يراها. الجميع يرتدي واحدة. في دورك تسأل المجموعة أسئلة بنعم أو لا — «هل أنا حيّ؟ هل أنا رياضي؟» — حتى تعرف من أنت. أول من يخمّن اسمه يفوز."}},{"tags":["small","big"],"meter":2,"cat":"acting","en":{"name":"Drawing & Guessing","players":"4+ (teams)","needs":"<b>You need:</b> Paper or a whiteboard, a pen, a timer, a list of words.","how":"One player draws a secret word while their teammates race to guess it before time runs out — no letters, numbers, or talking allowed, only pictures. Every correct guess scores a point, then the next person takes the pen. Fast, funny, and no artistic skill required (badly is often better)."},"ar":{"name":"ارسم وخمِّن","players":"4 لاعبين فأكثر (فِرق)","needs":"<b>تحتاج إلى:</b> ورق أو سبّورة، وقلم، ومؤقّت، وقائمة كلمات.","how":"يرسم لاعب كلمة سرّية بينما يتسابق فريقه على تخمينها قبل انتهاء الوقت — ممنوع الحروف أو الأرقام أو الكلام، صور فقط. كل تخمين صحيح نقطة، ثم ينتقل القلم للتالي. سريعة ومضحكة ولا تتطلّب موهبة في الرسم (الرسم السيّئ غالبًا أطرف)."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"word","en":{"name":"Categories","players":"3+ players","needs":"<b>You need:</b> Nothing — clap out a rhythm to keep the pace.","how":"Pick a category — say, fruits — and a starting letter. Going around the circle in rhythm, each person names something in that category that hasn't been said. Hesitate, repeat, or blank out and you're eliminated. Last one standing wins the round, then choose a new category."},"ar":{"name":"الفئات","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء — صفّقوا بإيقاع للحفاظ على السرعة.","how":"اختاروا فئة — مثلًا الفواكه — وحرفًا للبداية. بالتناوب على الإيقاع، يذكر كل شخص عنصرًا من الفئة لم يُقَل بعد. من يتردّد أو يكرّر أو ينسى يخرج. آخر من يبقى يفوز بالجولة، ثم اختاروا فئة جديدة."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"word","en":{"name":"Telephone","players":"4+ players","needs":"<b>You need:</b> Nothing at all.","how":"Sit in a line or circle. The first person whispers a sentence once to the next, who whispers what they heard to the next, and so on. No repeats allowed. The last person says it out loud — comparing the mangled result to the original is the whole joy of it."},"ar":{"name":"الهاتف (الأُذُن الطائشة)","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"اجلسوا في صفّ أو دائرة. يهمس الأول جملةً مرة واحدة للتالي، الذي يهمس ما سمعه للذي يليه، وهكذا. لا تكرار. يقول الأخير الجملة بصوت عالٍ — ومقارنة النتيجة المشوّهة بالأصل هي كل المتعة."}},{"tags":["small","big"],"meter":2,"cat":"paper","en":{"name":"Consequences","players":"3+ players","needs":"<b>You need:</b> A sheet of paper and pen for each player.","how":"Everyone writes the first line of a story on their paper, folds it to hide it, and passes it on. Round by round you each add the next part — a character, a place, some dialogue, what happened next — always folding and passing so no one sees the whole thing. Unfold the papers at the end and read the absurd tales aloud."},"ar":{"name":"العواقب","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> ورقة وقلم لكل لاعب.","how":"يكتب كلٌّ سطرًا أول من قصة على ورقته، يطويها ليخفيها، ثم يمرّرها. جولة بعد جولة يضيف كلٌّ الجزء التالي — شخصية، مكان، حوار، ماذا حدث بعد ذلك — مع الطيّ والتمرير دائمًا حتى لا يرى أحد كل شيء. افتحوا الأوراق في النهاية واقرؤوا الحكايات العبثية بصوت عالٍ."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"guessing","en":{"name":"Wink Murder","players":"5+ players","needs":"<b>You need:</b> A way to secretly pick one \"murderer\" (drawn slips work).","how":"Secretly assign one player as the murderer. Everyone mingles or sits in a circle making eye contact; the murderer \"kills\" people by discreetly winking at them, and a winked player dramatically pretends to die moments later. One detective tries to spot the winker before too many fall. Catch the culprit to win."},"ar":{"name":"جريمة الغمزة","players":"5 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> وسيلة لاختيار «قاتل» واحد سرًّا (قصاصات مسحوبة تفي بالغرض).","how":"عيّنوا لاعبًا واحدًا قاتلًا سرًّا. يتبادل الجميع النظرات في دائرة، ويقتل القاتل ضحاياه بغمزة خفية، ومن غُمِز يتظاهر بالموت بعد لحظات بطريقة مسرحية. يحاول محقّق واحد كشف الغامز قبل سقوط الكثيرين. اكشف الجاني لتفوز."}},{"tags":["big"],"meter":3,"cat":"guessing","en":{"name":"Mafia / Werewolf","players":"6+ players (best 8+)","needs":"<b>You need:</b> Cards or slips to assign hidden roles, plus a moderator.","how":"Players are secretly split into a hidden group of villains and an unsuspecting town. Each \"night\" the villains silently pick someone to eliminate; each \"day\" everyone debates who's suspicious and votes to remove one person. Town wins by rooting out all the villains; the villains win by outnumbering the town. It's a game of bluffing, reading faces, and accusing your friends."},"ar":{"name":"المافيا / المستذئبون","players":"6 لاعبين فأكثر (الأفضل 8)","needs":"<b>تحتاج إلى:</b> بطاقات أو قصاصات لتوزيع الأدوار السرّية، ومنسّق للّعبة.","how":"يُقسَّم اللاعبون سرًّا إلى مجموعة أشرار خفيّة وأهل بلدة لا يشكّون بشيء. كل «ليل» يختار الأشرار بصمت من يُقصونه، وكل «نهار» يتناقش الجميع في المشبوهين ويصوّتون لإخراج شخص. تفوز البلدة باستئصال كل الأشرار، ويفوز الأشرار حين يتساوى عددهم مع البلدة. لعبة خداع وقراءة وجوه واتهام أصدقائك."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"active","en":{"name":"Sardines","players":"4+ players","needs":"<b>You need:</b> A house or roomy space to hide in.","how":"Hide-and-seek in reverse. One person hides while everyone else counts, then all the seekers search separately. When you find the hider, you quietly squeeze into the hiding spot with them instead of announcing it. The group slowly piles in like sardines until the last person left searching loses — and hides next."},"ar":{"name":"السردين","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> منزل أو مساحة واسعة للاختباء.","how":"استغماية معكوسة: يختبئ شخص واحد بينما يعدّ الباقون، ثم يبحث الجميع كلٌّ على حدة. حين تجد المختبئ، تنسلّ بهدوء إلى مخبئه بدل أن تعلن. تتكدّس المجموعة كالسردين شيئًا فشيئًا حتى يخسر آخر من يبقى يبحث — ويختبئ في الجولة التالية."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Musical Chairs","players":"4+ players","needs":"<b>You need:</b> Chairs (one fewer than players) and music.","how":"Set chairs in a circle facing out, one short of the number of players. Play music while everyone walks around them; the moment it stops, everyone scrambles for a seat. Whoever's left standing is out. Remove one chair each round until two players fight over the final seat."},"ar":{"name":"الكراسي الموسيقية","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> كراسٍ (أقل بواحد من عدد اللاعبين) وموسيقى.","how":"رتّبوا الكراسي في دائرة تتّجه للخارج، أقل بكرسيّ من عدد اللاعبين. شغّلوا الموسيقى والجميع يدور حولها؛ وحين تتوقّف يتسابق الكل على مقعد. من يبقى واقفًا يخرج. أزيلوا كرسيًّا كل جولة حتى يتنافس لاعبان على المقعد الأخير."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Freeze Dance","players":"3+ players","needs":"<b>You need:</b> Music and someone to control it.","how":"Everyone dances while the music plays and freezes instantly when it stops. Anyone caught still moving after the music cuts is out. The person on music duty should stop it at sneaky, unexpected moments. Last dancer frozen the cleanest wins."},"ar":{"name":"رقصة التجمّد","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> موسيقى وشخص يتحكّم بها.","how":"يرقص الجميع ما دامت الموسيقى تعزف، ويتجمّدون فورًا حين تتوقّف. من يُضبَط متحرّكًا بعد توقّف الموسيقى يخرج. على المتحكّم أن يوقفها في لحظات ماكرة غير متوقّعة. آخر راقص يتجمّد بإتقان يفوز."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"active","en":{"name":"Simon Says","players":"3+ players","needs":"<b>You need:</b> Nothing at all.","how":"One person is \"Simon\" and calls out actions. Players only obey a command if it begins with \"Simon says\" — if Simon just says \"touch your nose\" and you do it, you're out. Simon tries to trick everyone with a fast mix of real and fake commands. Last player still in becomes the next Simon."},"ar":{"name":"سايمون يقول","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يكون شخص هو «سايمون» ويطلق الأوامر. لا ينفّذ اللاعبون الأمر إلا إذا بدأ بعبارة «سايمون يقول» — فإن قال سايمون «المس أنفك» فقط وفعلتها، خرجت. يحاول سايمون خداع الجميع بمزيج سريع من الأوامر الحقيقية والزائفة. آخر لاعب يبقى يصبح سايمون التالي."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Hot Potato","players":"4+ players","needs":"<b>You need:</b> A soft object to pass and some music.","how":"Sit in a circle and pass an object — the \"hot potato\" — from hand to hand as fast as you can while music plays. Whoever's holding it when the music suddenly stops is out. Keep going, dropping one player each round, until a single winner remains."},"ar":{"name":"البطاطا الساخنة","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> غرض ليّن للتمرير، وبعض الموسيقى.","how":"اجلسوا في دائرة ومرّروا غرضًا — «البطاطا الساخنة» — من يد إلى يد بأسرع ما يمكن ما دامت الموسيقى تعزف. من يمسكه حين تتوقّف الموسيقى فجأة يخرج. واصلوا وإسقاط لاعب كل جولة حتى يبقى فائز واحد."}},{"tags":["small","big"],"meter":2,"cat":"cards","en":{"name":"Spoons","players":"3+ players","needs":"<b>You need:</b> A deck of cards and spoons (one fewer than players).","how":"Place spoons in the middle, one short of the number of players. Everyone tries to collect four matching cards by rapidly passing cards around the table. The instant someone gets four of a kind they grab a spoon — and everyone else dives for the rest. The one left without a spoon takes a letter (S-P-O-O-N); spell the whole word and you're out."},"ar":{"name":"الملاعق","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب وملاعق (أقل بواحدة من عدد اللاعبين).","how":"ضعوا الملاعق في الوسط، أقل بواحدة من عدد اللاعبين. يحاول الجميع جمع أربع ورقات متطابقة بتمرير الورق حول الطاولة بسرعة. لحظة أن يجمع أحدهم أربعًا متطابقة يخطف ملعقة — ويندفع الباقون لالتقاط البقية. من يبقى بلا ملعقة يأخذ حرفًا من كلمة «ملعقة»؛ من يكمل الكلمة يخرج."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"active","en":{"name":"Rock, Paper, Scissors Tournament","players":"2+ players","needs":"<b>You need:</b> Nothing but your hands.","how":"The schoolyard classic scaled up. Pair off and play best-of-three; winners advance and losers become loud cheerleaders for whoever beat them, forming a growing entourage. Keep bracketing until two finalists face off in front of the whole crowd. Instant, chaotic, and weirdly thrilling."},"ar":{"name":"بطولة حجر ورقة مقص","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى يديك.","how":"الكلاسيكية المدرسية على نطاق أوسع. تبارَوا ثنائيًّا بأفضل ثلاث جولات؛ الفائزون يتقدّمون والخاسرون يتحوّلون إلى مشجّعين صاخبين لمن هزمهم، فتكبر حاشية كل فائز. واصلوا حتى يتواجه متأهّلان أمام الجمهور كله. فورية وفوضوية ومثيرة على نحو غريب."}},{"tags":["big"],"meter":3,"cat":"acting","en":{"name":"Celebrity (The Hat Game)","players":"6+ (two teams)","needs":"<b>You need:</b> Slips of paper, a bowl or hat, a timer.","how":"Everyone writes several famous names on slips and folds them into a bowl. The game runs in three rounds using the same names each time: round one you describe the name with any words except the name itself; round two you get only one word; round three you act it out silently. Teams take turns pulling slips against the clock, and remembering names from earlier rounds is the secret to winning."},"ar":{"name":"المشاهير (لعبة القبعة)","players":"6 لاعبين فأكثر (فريقان)","needs":"<b>تحتاج إلى:</b> قصاصات ورق، ووعاء أو قبعة، ومؤقّت.","how":"يكتب الجميع عدة أسماء مشاهير على قصاصات تُطوى في الوعاء. تجري اللعبة في ثلاث جولات بالأسماء نفسها: في الأولى تصف الاسم بأي كلمات عدا الاسم نفسه؛ في الثانية بكلمة واحدة فقط؛ في الثالثة تمثّله بصمت. تتناوب الفرق سحب القصاصات ضدّ الوقت، وتذكُّر الأسماء من الجولات السابقة هو سرّ الفوز."}},{"tags":["two","small","big"],"meter":1,"cat":"outdoor","en":{"name":"Scavenger Hunt","players":"2+ players","needs":"<b>You need:</b> A written list of items or tasks; a phone camera is handy.","how":"Write a list of things to find or do — an object, a photo of something red, a stranger's autograph. Send players or teams off to collect or photograph as many as they can before a set time. Whoever brings back the most wins. Works indoors, around a neighbourhood, or as a couples' date around town."},"ar":{"name":"رحلة البحث عن الكنز","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> قائمة مكتوبة بالأشياء أو المهام؛ كاميرا الهاتف مفيدة.","how":"اكتب قائمة بأشياء تُجمَع أو مهام تُنجَز — غرض ما، صورة لشيء أحمر، توقيع من غريب. أرسل اللاعبين أو الفرق لجمع أو تصوير أكبر قدر قبل انتهاء الوقت. من يعود بالأكثر يفوز. تصلح داخل المنزل، أو في الحيّ، أو كموعد للأزواج في أنحاء المدينة."}},{"tags":["two","small","nosupplies"],"meter":1,"cat":"guessing","en":{"name":"I Spy","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"One person picks something they can see and says \"I spy with my little eye something beginning with…\" and the first letter. Everyone else looks around and guesses what it is. Whoever guesses correctly chooses the next object. Perfect for waiting rooms, car rides, or quiet moments with no supplies."},"ar":{"name":"أرى بعيني","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يختار شخص شيئًا يراه ويقول: «أرى بعيني الصغيرة شيئًا يبدأ بحرف…» ثم الحرف الأول. يبحث الباقون حولهم ويخمّنون. من يخمّن بصواب يختار الشيء التالي. مثالية لغرف الانتظار أو رحلات السيارة أو اللحظات الهادئة بلا أدوات."}},{"tags":["two","small","nosupplies"],"meter":1,"cat":"word","en":{"name":"Ghost","players":"2+ players","needs":"<b>You need:</b> Nothing — just a shared vocabulary.","how":"Players take turns adding one letter to a growing string, always with a real word in mind, but never completing a word. Finish a word (of four letters or more) and you earn a letter of the word G-H-O-S-T. Bluffing is allowed: if you think someone added a letter with no real word in mind, challenge them — if they can't name one, they take a letter instead. Spell GHOST and you're out."},"ar":{"name":"الشبح","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء — سوى حصيلة لغوية مشتركة.","how":"يضيف اللاعبون بالتناوب حرفًا إلى سلسلة متنامية، وفي ذهن كلٍّ كلمة حقيقية، دون إكمال أي كلمة. من يُكمل كلمة (من أربعة أحرف فأكثر) يكسب حرفًا من كلمة «ش‑ب‑ح». والخداع مسموح: إن ظننت أن أحدهم أضاف حرفًا بلا كلمة حقيقية في ذهنه فتحدَّه — فإن عجز عن ذكرها أخذ حرفًا بدلًا منك. من يُكمل «شبح» يخرج."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"memory","en":{"name":"I'm Going on a Picnic","players":"2+ players","needs":"<b>You need:</b> Nothing but a good memory.","how":"The first player says \"I'm going on a picnic and I'm bringing…\" and names something. The next player repeats the whole list and adds a new item, and so on around the circle. Miss an item or get the order wrong and you drop out. The chain grows hilariously long until only one memory champion is left."},"ar":{"name":"ذاهبٌ في نزهة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى ذاكرة جيّدة.","how":"يقول اللاعب الأول: «ذاهبٌ في نزهة وسآخذ معي…» ويذكر شيئًا. يكرّر التالي القائمة كاملة ويضيف عنصرًا جديدًا، وهكذا حول الدائرة. من ينسى عنصرًا أو يخطئ في الترتيب يخرج. تطول السلسلة بشكل مضحك حتى يبقى بطل الذاكرة وحده."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"The Yes/No Game","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"One player fires off a rapid stream of questions, and the person in the hot seat must answer every one without ever saying \"yes\" or \"no\" — or nodding or shaking their head. Slip up and your turn ends. The questioner's job is to lull you into an automatic \"yeah.\" See who can survive the longest."},"ar":{"name":"لعبة نعم/لا","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يطلق لاعب سيلًا سريعًا من الأسئلة، وعلى من في «كرسي الاستجواب» أن يجيب عن كلٍّ دون أن يقول «نعم» أو «لا» — ولا حتى بإيماءة رأس. أي زلّة تُنهي دوره. مهمّة السائل أن يستدرجك إلى «أيوه» تلقائية. جرّبوا من يصمد أطول."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Hide and Seek","players":"3+ players","needs":"<b>You need:</b> A space with hiding spots.","how":"One player closes their eyes and counts to an agreed number while everyone else hides. The seeker then hunts for the others, and the last person found becomes the next seeker. A timeless favourite that works in a house, a garden, or a park — just agree on the boundaries first."},"ar":{"name":"الاستغماية (الغمّيضة)","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مكان به مخابئ.","how":"يغمض لاعب عينيه ويعدّ إلى رقم متّفق عليه بينما يختبئ الباقون. ثم يبحث عنهم، وآخر من يُعثَر عليه يصبح الباحث التالي. لعبة خالدة تصلح في منزل أو حديقة أو حديقة عامة — فقط اتفقوا على الحدود أولًا."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Red Light, Green Light","players":"3+ players","needs":"<b>You need:</b> A bit of open space.","how":"One player is the caller and stands at the far end with their back turned. On \"green light\" everyone creeps forward; on \"red light\" the caller spins around, and anyone caught still moving is sent back to the start. The first player to sneak up and tag the caller wins and takes over calling."},"ar":{"name":"إشارة حمراء، إشارة خضراء","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> بعض المساحة المفتوحة.","how":"يقف لاعب واحد مناديًا في الطرف البعيد وظهره للجميع. عند «إشارة خضراء» يتسلّل الجميع للأمام؛ وعند «إشارة حمراء» يستدير المنادي فجأة، ومن يُضبَط متحرّكًا يعود إلى نقطة البداية. أول من يتسلّل ويلمس المنادي يفوز ويتولّى المناداة."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Duck, Duck, Goose","players":"5+ players","needs":"<b>You need:</b> Floor space to sit in a circle.","how":"Everyone sits in a circle while one person walks around the outside, tapping each head and saying \"duck… duck… duck…\" — until they tap someone and shout \"goose!\" That person leaps up and chases the tapper around the circle, trying to tag them before they steal the empty spot. Get caught and you go again."},"ar":{"name":"بطة، بطة، إوزة","players":"5 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مساحة أرضية للجلوس في دائرة.","how":"يجلس الجميع في دائرة بينما يدور شخص حول الخارج، يربّت على الرؤوس قائلًا «بطة… بطة… بطة…» حتى يربّت على أحدهم ويصيح «إوزة!». يقفز ذلك اللاعب ويطارد الملامِس حول الدائرة محاولًا لمسه قبل أن يخطف مكانه الفارغ. من يُمسَك يعيد الكرّة."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Blind Man's Buff","players":"4+ players","needs":"<b>You need:</b> A blindfold and a safe, clear space.","how":"One player is blindfolded and spun gently in the middle while everyone else scatters just out of reach. The blindfolded player gropes around trying to catch someone, then must identify who they've caught by touch alone. Guess right and the caught player takes the blindfold. Clear obstacles first so nobody trips."},"ar":{"name":"لعبة الأعمى","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> عصابة للعينين ومساحة آمنة وخالية.","how":"يُعصَب أحد اللاعبين ويُدار برفق في الوسط بينما يتفرّق الباقون بعيدًا عن متناوله بقليل. يتحسّس المعصوب طريقه محاولًا الإمساك بأحد، ثم عليه تمييزه باللمس وحده. إن خمّن صوابًا انتقلت العصابة إليه. أزيلوا العوائق أولًا حتى لا يتعثّر أحد."}},{"tags":["small","big"],"meter":2,"cat":"cards","en":{"name":"Cheat (I Doubt It)","players":"3+ players","needs":"<b>You need:</b> A deck of cards.","how":"Deal the whole deck out. Players take turns placing cards face-down and announcing them in rank order — \"two threes\" — but you're allowed to lie about what you put down. If anyone suspects a bluff they shout \"Cheat!\" and the pile is flipped: a caught liar takes the whole pile, but a wrong accuser takes it themselves. First to empty their hand wins."},"ar":{"name":"الغش (لا أصدّقك)","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"وزّعوا كل الورق. يضع اللاعبون بالتناوب ورقات مقلوبة معلنين رتبتها بالترتيب — «ثلاثتان من فئة الثلاثة» — ويُسمح بالكذب في ما تضعه. إن شكّ أحد في كذبة صاح «غش!» فيُقلَب الكومة: الكاذب المضبوط يأخذها كلها، لكن المتّهِم المخطئ يأخذها هو. أول من يُفرِغ يده يفوز."}},{"tags":["two","small"],"meter":1,"cat":"cards","en":{"name":"Go Fish","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Everyone gets a hand of cards and the rest form a draw pile. On your turn you ask another player for a rank you're holding — \"Got any sevens?\" If they do, they hand them over; if not, they say \"Go fish\" and you draw from the pile. Collect four of a kind to set them aside. Most sets when the cards run out wins."},"ar":{"name":"اصطَد سمكة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"يأخذ الجميع أوراقًا وتُشكّل البقية كومة سحب. في دورك تطلب من لاعب آخر رتبةً تحملها — «هل لديك سبعات؟» فإن كان لديه يسلّمها، وإلا قال «اصطَد سمكة» فتسحب من الكومة. اجمع أربعًا متطابقة وضعها جانبًا. من يجمع أكثر المجموعات عند نفاد الورق يفوز."}},{"tags":["two","small"],"meter":1,"cat":"paper","en":{"name":"Hangman","players":"2+ players","needs":"<b>You need:</b> Paper and a pen.","how":"One player thinks of a word and draws a blank for each letter. The others guess letters one at a time: correct guesses get filled in, wrong ones add a piece to a little stick figure. Solve the word before the drawing is completed to win — leave it unsolved and the word-setter does. Great one-on-one or with a guessing team."},"ar":{"name":"المشنقة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> ورقة وقلم.","how":"يفكّر لاعب في كلمة ويرسم فراغًا لكل حرف. يخمّن الباقون الحروف واحدًا تلو الآخر: الصحيح يُملأ، والخاطئ يضيف جزءًا إلى رسم رجل صغير. حلّوا الكلمة قبل اكتمال الرسم لتفوزوا — واتركوها دون حلّ ليفوز واضع الكلمة. رائعة لاثنين أو مع فريق يخمّن."}},{"tags":["two","nosupplies"],"meter":1,"cat":"paper","en":{"name":"Dots and Boxes","players":"2 players","needs":"<b>You need:</b> Paper and a pen.","how":"Draw a grid of dots. Players take turns joining two neighbouring dots with a line. Complete the fourth side of a small box and you claim it with your initial — and take another turn. When every box is filled, whoever owns the most wins. Deceptively simple, quietly cutthroat."},"ar":{"name":"النقاط والمربّعات","players":"لاعبان","needs":"<b>تحتاج إلى:</b> ورقة وقلم.","how":"ارسموا شبكة من النقاط. يصل اللاعبون بالتناوب بين نقطتين متجاورتين بخطّ. من يكمل الضلع الرابع لمربّع صغير يملكه بوضع حرفه الأول — ويحصل على دور إضافي. حين تمتلئ كل المربّعات، من يملك الأكثر يفوز. بسيطة في ظاهرها، شرسة في باطنها."}},{"tags":["two","small","big"],"meter":1,"cat":"dice","en":{"name":"Yacht (Dice)","players":"2+ players","needs":"<b>You need:</b> Five dice and a scoresheet.","how":"On your turn you roll five dice, then get two re-rolls where you can keep the dice you like and throw the rest again. You're chasing combinations — three of a kind, a run, a full house, five alike — and each scores into a category you can only fill once. The whole table plays the same categories; the highest total after everyone fills their sheet wins. This is the folk ancestor of the boxed dice games you may know."},"ar":{"name":"اليخت (نرد)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> خمسة أحجار نرد وورقة تسجيل.","how":"في دورك ترمي خمسة أحجار نرد، ثم تحصل على رميتين إضافيتين تحتفظ فيهما بما يعجبك وترمي الباقي. تطارد تركيبات — ثلاثة متماثلة، تسلسل، بيت مليء، خمسة متماثلة — وتُسجَّل كلٌّ في خانة تُملأ مرة واحدة. الجميع يلعب الخانات نفسها؛ وأعلى مجموع بعد أن يملأ الكل ورقته يفوز. هذه الجدّة الشعبية لألعاب النرد المعلّبة التي قد تعرفها."}},{"tags":["small","big"],"meter":2,"cat":"dice","en":{"name":"Liar's Dice","players":"3+ players","needs":"<b>You need:</b> Five dice and a cup per player.","how":"Everyone rolls their dice under a cup, hidden from the others. Players take turns making bolder and bolder bids about how many of a given number are on the table across all cups — \"there are six fives.\" You can raise the bid or call the last player a liar. Lift the cups: if the bid was a lie the bluffer loses a die, otherwise the challenger does. Lose all your dice and you're out."},"ar":{"name":"نرد الكذّاب","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> خمسة أحجار نرد وكوب لكل لاعب.","how":"يرمي كلٌّ نرده تحت كوب مخفيًّا عن الآخرين. يقدّم اللاعبون بالتناوب مزايدات أجرأ فأجرأ حول عدد ظهور رقم معيّن على الطاولة في كل الأكواب — «هناك ستّ خمسات». يمكنك رفع المزايدة أو اتهام السابق بالكذب. ارفعوا الأكواب: إن كانت المزايدة كذبًا خسر المخادع حجرًا، وإلا خسر المتحدّي. من يخسر كل نرده يخرج."}},{"tags":["two","small","big"],"meter":1,"cat":"dice","en":{"name":"Pig (Dice)","players":"2+ players","needs":"<b>You need:</b> A single die.","how":"A pure nerve game. On your turn you keep rolling one die, adding each roll to a running tally — but if you ever roll a one, you lose everything gained that turn and pass the die on. Stop and \"bank\" whenever you like to lock in the points. First to a hundred wins. The agony is deciding when greed becomes foolish."},"ar":{"name":"الخنزير (نرد)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> حجر نرد واحد.","how":"لعبة أعصاب خالصة. في دورك تواصل رمي حجر واحد وتضيف كل رمية إلى رصيد الجولة — لكن إن ظهر الرقم واحد خسرت كل ما جمعته في هذا الدور ومرّرت النرد. توقّف و«أودِع» متى شئت لتثبّت نقاطك. أول من يبلغ مئة يفوز. العذاب في تحديد متى يتحوّل الطمع إلى حماقة."}},{"tags":["two","small","big"],"meter":1,"cat":"dice","en":{"name":"Beetle","players":"2+ players","needs":"<b>You need:</b> One die, paper, and pens.","how":"Race to draw a complete bug. Each number on the die unlocks a body part — you must roll a six for the body before anything else can attach, a five for the head, and so on down to the legs, eyes, and feelers. Roll, draw the part you're allowed, and pass the die. First to finish a full beetle shouts \"Beetle!\" and wins. A gentle, giggly one that even small children can play."},"ar":{"name":"الخنفساء","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> حجر نرد واحد، وورق، وأقلام.","how":"تسابقوا على رسم حشرة كاملة. يفتح كل رقم على النرد جزءًا من الجسم — عليك رمي ٦ للجسم قبل أي شيء، و٥ للرأس، ونزولًا إلى الأرجل والعينين وقرون الاستشعار. ارمِ، وارسم الجزء المسموح، ومرّر النرد. أول من ينهي خنفساء كاملة يصيح «خنفساء!» ويفوز. لطيفة ومضحكة ويلعبها الصغار بسهولة."}},{"tags":["two","small"],"meter":1,"cat":"cards","en":{"name":"Snap","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Deal the whole deck out face-down. Players take turns flipping their top card onto a shared pile, and the instant two cards of the same rank land in a row, the first person to slap the pile and yell \"Snap!\" wins it all. Fast reflexes beat everything. Win all the cards and you win the game."},"ar":{"name":"سناب (المطابقة)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"وزّعوا كل الورق مقلوبًا. يقلب اللاعبون بالتناوب ورقتهم العليا في كومة مشتركة، ولحظة أن تتوالى ورقتان بالرتبة نفسها، أول من يصفع الكومة ويصيح «سناب!» يكسبها كلها. السرعة تتغلّب على كل شيء. من يفوز بكل الورق يفوز باللعبة."}},{"tags":["two"],"meter":1,"cat":"cards","en":{"name":"War","players":"2 players","needs":"<b>You need:</b> A deck of cards.","how":"Split the deck evenly, face-down. Both players flip their top card at once; the higher card takes both. If they tie, it's \"war\" — each player lays a few cards down and flips again, winner takes the whole stack. Keep going until one player holds every card. No skill, all suspense — perfect for passing time with a kid."},"ar":{"name":"الحرب","players":"لاعبان","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"اقسموا الورق بالتساوي مقلوبًا. يقلب اللاعبان ورقتهما العليا معًا؛ الأعلى يأخذ الاثنتين. عند التعادل تقع «حرب» — يضع كلٌّ بضع ورقات ويقلب مجدّدًا، والفائز يأخذ الكومة كلها. واصلوا حتى يملك أحدهما كل الورق. لا مهارة، كل التشويق — مثالية لتمضية الوقت مع طفل."}},{"tags":["two","small"],"meter":1,"cat":"cards","en":{"name":"Crazy Eights","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Everyone gets a hand and one card is turned up to start a discard pile. On your turn you must play a card matching the top one by suit or rank, or draw until you can. Eights are wild — play one and you name the suit everyone must follow. First to empty their hand wins. It's the folk game that inspired many modern shedding card games."},"ar":{"name":"الثمانيات المجنونة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"يأخذ الجميع أوراقًا وتُقلَب ورقة لبدء كومة الرمي. في دورك تلعب ورقة تطابق العليا في النوع أو الرتبة، أو تسحب حتى تستطيع. الثمانيات جوكر — العبها وسمِّ النوع الذي يجب أن يتبعه الجميع. أول من يُفرِغ يده يفوز. هي الجدّة الشعبية لكثير من ألعاب الورق الحديثة."}},{"tags":["small","big"],"meter":2,"cat":"cards","en":{"name":"President","players":"4+ players","needs":"<b>You need:</b> A deck of cards.","how":"Deal all the cards out. Players take turns shedding cards of ever-higher value, and anyone who can't or won't beat the last play passes. The first to run out becomes President for the next round, the last stuck holding cards becomes the Scum — and in the following deal the Scum hands their best cards up to the President. Climbing the social ladder (and gloating) is the whole point."},"ar":{"name":"الرئيس","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"وزّعوا كل الورق. يرمي اللاعبون بالتناوب ورقات ذات قيمة أعلى فأعلى، ومن لا يستطيع أو لا يريد تجاوز آخر رمية يمرّر دوره. أول من ينفد ورقه يصبح «الرئيس» في الجولة التالية، وآخر من يعلق بورقه يصبح «الحقير» — وفي التوزيع التالي يسلّم الحقير أفضل ورقاته إلى الرئيس. تسلّق السلّم الاجتماعي (والتباهي) هو كل الهدف."}},{"tags":["two","small"],"meter":1,"cat":"cards","en":{"name":"Rummy","players":"2+ players","needs":"<b>You need:</b> A deck of cards.","how":"Draw and discard one card each turn, trying to organise your hand into \"melds\" — runs of the same suit in sequence, or sets of the same rank. Lay them down when you can. The first player to arrange their entire hand into valid melds and discard their last card wins the round. A relaxed classic that rewards a little planning."},"ar":{"name":"الرَّمي (رَمّي)","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"اسحب وارمِ ورقة كل دور، محاولًا تنظيم يدك إلى «مجموعات» — تسلسلات من النوع نفسه، أو مجموعات من الرتبة نفسها. اعرضها متى استطعت. أول من يرتّب يده كلها في مجموعات صحيحة ويرمي ورقته الأخيرة يفوز بالجولة. كلاسيكية هادئة تكافئ قليلًا من التخطيط."}},{"tags":["small","big"],"meter":2,"cat":"cards","en":{"name":"Kemps","players":"4+ (pairs)","needs":"<b>You need:</b> A deck of cards.","how":"Play in pairs sitting across from each other. Before the game each pair invents a secret signal — a wink, a tap, a stretch. As cards are swapped through a shared middle, you try to collect four of a kind, then signal your partner so they can shout \"Kemps!\" and win the round. But if an opposing player spots your signal and calls \"Kemps!\" on you first, you lose. Half card game, half spy game."},"ar":{"name":"كِمبس","players":"4 لاعبين فأكثر (أزواج)","needs":"<b>تحتاج إلى:</b> مجموعة ورق لعب.","how":"العبوا في أزواج يجلس كلٌّ مقابل شريكه. قبل اللعبة يبتكر كل زوج إشارة سرّية — غمزة، نقرة، تمطٍّ. مع تبادل الورق عبر وسط مشترك، تحاول جمع أربع متطابقة ثم تشير لشريكك ليصيح «كِمبس!» ويفوز بالجولة. لكن إن رصد خصم إشارتك وصاح «كِمبس!» عليك أولًا، خسرت. نصفها لعبة ورق، ونصفها لعبة تجسّس."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"Fortunately, Unfortunately","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Tell a story together, alternating turns, where every sentence flips the mood. One person adds a line starting \"Fortunately…\" and the next must answer with \"Unfortunately…\" — a lucky break followed by a fresh disaster, over and over. The story lurches from triumph to catastrophe and back until it collapses in laughter. No supplies, endless replay."},"ar":{"name":"لحسن الحظ، لسوء الحظ","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"احكوا قصة معًا بالتناوب، وكل جملة تقلب المزاج. يضيف أحدهم سطرًا يبدأ بـ«لحسن الحظ…» وعلى التالي أن يردّ بـ«لسوء الحظ…» — فرصة سعيدة تتبعها كارثة جديدة، مرارًا وتكرارًا. تتأرجح القصة بين الظفر والنكبة حتى تنهار ضحكًا. بلا أدوات، وإعادة لا تنتهي."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"The Minister's Cat","players":"2+ players","needs":"<b>You need:</b> Nothing — clap a steady beat.","how":"Going around the circle in rhythm, each person describes \"the minister's cat\" with an adjective starting with the letter A — \"an angry cat, an amazing cat\" — no repeats. When everyone's had a go, move on to B, then C, all the way through the alphabet. Miss the beat or repeat a word and you're out. Simple, musical, and quietly competitive."},"ar":{"name":"قطّة الوزير","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء — صفّقوا بإيقاع ثابت.","how":"حول الدائرة على الإيقاع، يصف كلٌّ «قطّة الوزير» بصفة تبدأ بالحرف «أ» — «قطّة أنيقة، قطّة أليفة» — بلا تكرار. حين يأخذ الجميع دورهم، انتقلوا إلى «ب» ثم «ت»، وهكذا عبر الحروف. من يفوّت الإيقاع أو يكرّر يخرج. بسيطة وموسيقية وتنافسية بهدوء."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"Word Association","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"One person says a word; the next instantly says the first word it makes them think of, and so on around the circle without pausing. Hesitate too long, repeat a word, or say something with no clear link and you drop out. It's fast, revealing, and often hilarious where the chain ends up compared to where it started."},"ar":{"name":"تداعي الكلمات","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يقول شخص كلمة؛ ويقول التالي فورًا أول كلمة تخطر له مرتبطة بها، وهكذا حول الدائرة بلا توقّف. من يتردّد طويلًا أو يكرّر أو يقول شيئًا بلا رابط واضح يخرج. سريعة وكاشفة وغالبًا مضحكة أين تنتهي السلسلة مقارنة ببدايتها."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"guessing","en":{"name":"Botticelli","players":"3+ players","needs":"<b>You need:</b> Nothing but general knowledge.","how":"One player thinks of a famous person and reveals only the first letter of their surname. The others try to guess by asking indirect questions — \"Are you a scientist?\" — which the thinker must deflect by naming any matching person themselves (\"No, I'm not Einstein\"). Only when the group stumps them do they earn a direct yes-or-no question. Piece together the clues to unmask the mystery figure."},"ar":{"name":"بوتيتشيلّي","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى الثقافة العامة.","how":"يفكّر لاعب في شخصية مشهورة ويكشف الحرف الأول من لقبها فقط. يحاول الباقون التخمين بأسئلة غير مباشرة — «هل أنت عالِم؟» — وعلى صاحب السرّ صدّها بذكر أي شخص مطابق («لا، لست أينشتاين»). فقط حين تعجزه المجموعة يكسبون سؤالًا مباشرًا بنعم أو لا. اجمعوا الأدلّة لكشف الشخصية الغامضة."}},{"tags":["small","big"],"meter":2,"cat":"acting","en":{"name":"Describe It","players":"4+ (teams)","needs":"<b>You need:</b> Slips of paper with words and a timer.","how":"One player draws a secret word and has to get their team to say it — but without using the word itself or a short list of the most obvious related words agreed in advance. Race the clock to land as many as possible before passing to the other team. It's a brilliant test of quick thinking and how well your friends are on your wavelength."},"ar":{"name":"صِفها","players":"4 لاعبين فأكثر (فِرق)","needs":"<b>تحتاج إلى:</b> قصاصات ورق بكلمات ومؤقّت.","how":"يسحب لاعب كلمة سرّية وعليه أن يجعل فريقه يقولها — دون استخدام الكلمة نفسها أو قائمة قصيرة من أوضح الكلمات المرتبطة المتّفق عليها مسبقًا. تسابقوا مع الوقت لتحصدوا أكبر عدد قبل التمرير للفريق الآخر. اختبار بديع للبديهة السريعة ولمدى انسجامكم مع أصدقائكم."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Tag & Freeze Tag","players":"3+ players","needs":"<b>You need:</b> Open space to run.","how":"One player is \"it\" and chases everyone else; whoever gets tagged becomes \"it\" instead. In the freeze version, a tagged player must freeze in place until a teammate crawls under or touches them to set them free — so \"it\" tries to freeze everyone at once. Pure, breathless fun that needs nothing but room to move."},"ar":{"name":"المطاردة والتجمّد","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مساحة مفتوحة للجري.","how":"يكون لاعب «هو» ويطارد الجميع؛ ومن يُلمَس يصبح «هو» بدلًا منه. في صيغة التجمّد، على من يُلمَس أن يتجمّد مكانه حتى يزحف زميل تحته أو يلمسه لتحريره — فيحاول «هو» تجميد الجميع دفعة واحدة. متعة خالصة لا تحتاج سوى مساحة للحركة."}},{"tags":["big"],"meter":3,"cat":"outdoor","en":{"name":"Capture the Flag","players":"6+ (two teams)","needs":"<b>You need:</b> A large space, two markers for flags, two teams.","how":"Split into two teams, each guarding a flag at their end of a divided field. The goal is to sneak into enemy territory, grab their flag, and carry it back to your side — but if you're tagged on their half, you're sent to \"jail\" until a teammate frees you. Combines stealth, speed, and strategy. First team to capture the other's flag wins."},"ar":{"name":"اختطاف العلَم","players":"6 لاعبين فأكثر (فريقان)","needs":"<b>تحتاج إلى:</b> مساحة واسعة، وعلامتان للعلَمين، وفريقان.","how":"انقسموا إلى فريقين، يحرس كلٌّ علَمه في طرفه من ملعب مقسوم. الهدف التسلّل إلى أرض الخصم وخطف علَمه وحمله إلى جهتك — لكن إن لُمِست في نصفهم أُرسِلت إلى «السجن» حتى يحرّرك زميل. تمزج التخفّي والسرعة والتخطيط. أول فريق يخطف علَم الآخر يفوز."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"What's the Time, Mr. Wolf?","players":"3+ players","needs":"<b>You need:</b> A bit of open space.","how":"One player is the Wolf, standing with their back to the others at the far end. The group calls \"What's the time, Mr. Wolf?\" and creeps forward by however many steps the Wolf's answer suggests (\"Three o'clock\" = three steps). But if the Wolf turns and shouts \"Dinner time!\" they give chase — and anyone caught becomes the next Wolf. Reach the Wolf without being caught to win."},"ar":{"name":"كم الساعة يا سيّد ذئب؟","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> بعض المساحة المفتوحة.","how":"يكون لاعب هو الذئب، واقفًا وظهره للآخرين في الطرف البعيد. تنادي المجموعة «كم الساعة يا سيّد ذئب؟» فتتقدّم خطوات بعدد ما توحي به إجابته («الثالثة» = ثلاث خطوات). لكن إن استدار الذئب وصاح «وقت العشاء!» انطلق مطاردًا — ومن يُمسَك يصبح الذئب التالي. صِل إلى الذئب دون أن تُمسَك لتفوز."}},{"tags":["small","big"],"meter":2,"cat":"active","en":{"name":"Marco Polo","players":"3+ players","needs":"<b>You need:</b> A swimming pool (or a safe open space).","how":"One player closes their eyes and is \"it,\" calling out \"Marco!\" — to which everyone else must answer \"Polo!\" Using only those sounds to locate people, the blind player tries to tag someone, who then takes over. Usually played in a pool, but it works anywhere flat and hazard-free. A game of ears over eyes."},"ar":{"name":"ماركو بولو","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> حوض سباحة (أو مساحة آمنة مفتوحة).","how":"يغمض لاعب عينيه وهو «هو»، مناديًا «ماركو!» — وعلى الجميع أن يردّوا «بولو!». مستخدمًا هذه الأصوات وحدها لتحديد مواقع الآخرين، يحاول الملامسة، فيتولّى من يُلمَس الدور. تُلعب عادة في المسبح، لكنها تصلح في أي مكان مستوٍ وآمن. لعبة الأذن على العين."}},{"tags":["small","big"],"meter":2,"cat":"outdoor","en":{"name":"Classic Relay Races","players":"4+ players","needs":"<b>You need:</b> Simple props — spoons, eggs or balls, sacks, scarves.","how":"The staples of every fete and field day, best run as teams. Balance an egg on a spoon and don't drop it; hop to the finish inside a sack; tie your ankle to a partner's for the three-legged dash. Line up, race to a marker and back, then tag the next runner. Mix and match events for a whole afternoon of friendly chaos."},"ar":{"name":"سباقات التتابع الكلاسيكية","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> أدوات بسيطة — ملاعق، بيض أو كرات، أكياس، أوشحة.","how":"أساسيات كل مهرجان ويوم رياضي، وأفضلها بالفرق. وازن بيضة على ملعقة دون أن تسقط؛ اقفز إلى النهاية داخل كيس؛ اربط كاحلك بكاحل شريك للركض ثلاثيّ الأرجل. اصطفّوا، اركضوا إلى علامة وارجعوا، ثم المسوا العدّاء التالي. امزجوا الفعاليات لعصر كامل من الفوضى المرحة."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"The License Plate Game","players":"2+ players","needs":"<b>You need:</b> Nothing but a journey and passing traffic.","how":"A road-trip classic. Watch the license plates of passing cars and try to spot ones from as many different regions or states as you can, ticking each off as you go. Whoever spots the most by the end of the trip wins. A variant: make words or silly phrases from the plates' letters. Turns a boring drive into a hunt."},"ar":{"name":"لعبة لوحات السيارات","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى رحلة وسيارات عابرة.","how":"كلاسيكية الطريق. راقبوا لوحات السيارات العابرة وحاولوا رصد أكبر عدد من مناطق أو مدن مختلفة، مع شطب كلٍّ عند رؤيته. من يرصد الأكثر بنهاية الرحلة يفوز. صيغة أخرى: كوّنوا كلمات أو عبارات طريفة من حروف اللوحات. تحوّل رحلة مملّة إلى مطاردة."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"travel","en":{"name":"The Movie Game","players":"2+ players","needs":"<b>You need:</b> Nothing but film knowledge.","how":"Name an actor. The next player names a film that actor was in; the following player names someone else from that film; then another film with that person, and so on, back and forth. Stall for too long or get a link wrong and you're out. A great one for the car or a lazy evening, and it settles who really knows their movies."},"ar":{"name":"لعبة الأفلام","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى معرفة بالأفلام.","how":"اذكر ممثّلًا. يذكر التالي فيلمًا شارك فيه؛ ثم يذكر من يليه شخصًا آخر من ذلك الفيلم؛ ثم فيلمًا آخر لذلك الشخص، وهكذا ذهابًا وإيابًا. من يتأخّر طويلًا أو يخطئ في الرابط يخرج. رائعة للسيارة أو لأمسية كسولة، وتحسم من يعرف أفلامه حقًّا."}},{"tags":["two","small","big"],"meter":1,"cat":"memory","en":{"name":"Kim's Game","players":"2+ players","needs":"<b>You need:</b> A tray of small objects, a cloth, paper and pens.","how":"Gather a dozen or so random objects on a tray and let everyone study them for a minute. Cover the tray with a cloth, then have each player write down as many items as they can remember. Whoever recalls the most wins — and for a harder round, secretly remove one object and see who can name what's missing. A brilliant test of observation."},"ar":{"name":"لعبة كِم","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> صينية أغراض صغيرة، وقطعة قماش، وورق وأقلام.","how":"اجمعوا نحو اثني عشر غرضًا عشوائيًّا على صينية ودعوا الجميع يتأمّلونها دقيقة. غطّوا الصينية بقماش، ثم يكتب كلٌّ ما يتذكّره من الأغراض. من يتذكّر الأكثر يفوز — وللجولة الأصعب، أزيلوا غرضًا سرًّا وانظروا من يكتشف المفقود. اختبار بديع للملاحظة."}},{"tags":["two"],"meter":1,"cat":"paper","en":{"name":"Sea Battle","players":"2 players","needs":"<b>You need:</b> Paper and a pen each.","how":"Each player secretly draws a grid and marks a small fleet of ships across squares. Taking turns, you call out grid coordinates to \"fire\" at your opponent's hidden fleet; they tell you hit or miss, and you track it on a second grid. Pinpoint and sink every enemy ship before yours are destroyed. The classic pen-and-paper guessing duel."},"ar":{"name":"المعركة البحرية","players":"لاعبان","needs":"<b>تحتاج إلى:</b> ورقة وقلم لكل لاعب.","how":"يرسم كل لاعب شبكة سرًّا ويوزّع أسطولًا صغيرًا من السفن عبر المربّعات. بالتناوب، تنادي إحداثيات لـ«قصف» أسطول خصمك الخفي؛ يخبرك بإصابة أو خطأ، وتتتبّع ذلك على شبكة ثانية. حدّد وأغرِق كل سفن العدو قبل أن تُدمَّر سفنك. مبارزة التخمين الكلاسيكية بالورقة والقلم."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"conversation","en":{"name":"Most Likely To","players":"3+ players","needs":"<b>You need:</b> Nothing at all.","how":"Someone poses a question — \"Who's most likely to sleep through their own wedding?\" On the count of three, everyone points at the person they think fits best. Whoever gets the most fingers pointed their way owns that title (and the teasing that comes with it). Endless gentle roasting with zero setup."},"ar":{"name":"الأكثر احتمالًا أن…","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يطرح أحدهم سؤالًا مثل «من الأكثر احتمالًا أن ينام في يوم زفافه؟» وعند العدّ إلى ثلاثة يشير الجميع إلى من يظنّونه الأنسب. من يُشار إليه بأكثر الأصابع يحمل ذلك اللقب (وما يرافقه من مزاح). تنمُّر لطيف لا نهاية له وبلا أي تحضير."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"conversation","en":{"name":"The Hot Seat","players":"3+ players","needs":"<b>You need:</b> Nothing — a timer helps.","how":"One person takes the \"hot seat\" for a set stretch of time while everyone else fires off rapid questions about them. They answer as quickly and honestly as they can before the round ends and someone new sits down. A fast, funny way for a group to get to know one person deeply."},"ar":{"name":"كرسي الاعتراف","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء — ومؤقّت يساعد.","how":"يجلس شخص في «كرسي الاعتراف» لمدة محدّدة بينما يمطره الباقون بأسئلة سريعة عنه. يجيب بأسرع وأصدق ما يمكن قبل انتهاء الجولة، ثم يجلس غيره. طريقة سريعة ومضحكة لتتعرّف المجموعة على شخص واحد بعمق."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"conversation","en":{"name":"Desert Island","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Everyone answers what they'd take to a desert island — a few songs, books, foods, or luxuries — and then defends their choices to the group. Swap the category each round for endless variations. It's a warm, revealing conversation starter that shows what people truly treasure."},"ar":{"name":"جزيرة مهجورة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يجيب الجميع عمّا سيأخذونه إلى جزيرة مهجورة — بضع أغانٍ أو كتب أو أطعمة أو أشخاص — ثم يدافعون عن اختياراتهم. غيّروا الفئة كل جولة لتنويعات لا تنتهي. بداية حديث دافئة تكشف ما يعزّه كلٌّ منّا."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"conversation","en":{"name":"Paranoia","players":"3+ players","needs":"<b>You need:</b> Nothing at all.","how":"One player leans in and quietly asks their neighbour a question only they can hear — \"Who here would survive the longest in a horror film?\" The neighbour answers out loud with just a name, while everyone else is left guessing what on earth was asked. The delicious paranoia of not knowing is the whole game; flip a coin to decide whether the question gets revealed."},"ar":{"name":"جنون الشك","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يهمس لاعب لجاره بسؤال لا يسمعه سواه — «من هنا سيصمد أطول في فيلم رعب؟» فيجيب الجار بصوت عالٍ باسم فقط، بينما يبقى الباقون يخمّنون ما السؤال أصلًا. متعة عدم المعرفة هي اللعبة كلها؛ ارموا قطعة نقد لتقرّروا هل يُكشَف السؤال."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"Word Chain","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Each player says a word that begins with the last letter of the word before it — \"apple, elephant, tiger, rabbit.\" No repeats, and no long pauses. Stumble or stall and you drop out. Restrict it to a single category, like animals or cities, to crank up the challenge."},"ar":{"name":"سلسلة الكلمات","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يقول كل لاعب كلمة تبدأ بالحرف الأخير من الكلمة السابقة — «قمر، رمل، لبن، نور». بلا تكرار ولا توقّف طويل. من يتعثّر أو يتردّد يخرج. اقصروها على فئة واحدة، كالحيوانات أو المدن، لزيادة الصعوبة."}},{"tags":["small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"Fizz Buzz","players":"3+ players","needs":"<b>You need:</b> Nothing at all.","how":"Count upward around the circle, but swap any multiple of three for \"fizz,\" any multiple of five for \"buzz,\" and any multiple of both for \"fizzbuzz.\" Say the wrong thing or hesitate and you're out. It sounds easy until the numbers climb and your brain ties itself in knots."},"ar":{"name":"فِز باز","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"عُدّوا تصاعديًّا حول الدائرة، لكن استبدلوا كل مضاعف للعدد ثلاثة بكلمة «فِز»، وكل مضاعف للعدد خمسة بكلمة «باز» (و«فِزباز» لِما يقبل القسمة عليهما معًا). أي خطأ يُخرجك. تبدو سهلة حتى تعلو الأرقام فيتشابك عقلك."}},{"tags":["two","small","big"],"meter":1,"cat":"word","en":{"name":"Spelling Bee","players":"2+ players","needs":"<b>You need:</b> A word list or dictionary.","how":"One person reads out words of rising difficulty, and each player in turn must spell theirs aloud, letter by letter. Get it right and you stay in; miss one and you're eliminated. The last speller standing takes the crown — a living-room version of the schoolroom classic."},"ar":{"name":"مسابقة التهجئة","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> قائمة كلمات أو معجم.","how":"يقرأ شخص كلمات متصاعدة الصعوبة، وعلى كل لاعب بدوره تهجئة كلمته بصوت عالٍ حرفًا حرفًا. الصواب يبقيك، والخطأ يُخرجك. آخر من يبقى يفوز — نسخة منزلية من كلاسيكية المدرسة."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"word","en":{"name":"Contact","players":"3+ players","needs":"<b>You need:</b> Nothing at all.","how":"One player thinks of a secret word and reveals only its first letter. The guessers try to work it out by giving each other cryptic clues (\"a jungle cat?\") and, when two of them think of the same answer, they count down and say it together — \"contact!\" If they match and the thinker can't guess their word first, the next letter is revealed."},"ar":{"name":"تواصُل","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يفكّر لاعب في كلمة سرّية ويكشف حرفها الأول. يحاول المخمّنون الوصول إليها بإعطاء بعضهم أدلّة خفية («قطّة برّية؟»)، وحين يفكّر اثنان في الكلمة نفسها يعدّان ويقولانها معًا — «تواصُل!». إن تطابقا وعجز صاحب السرّ عن تخمين كلمتهما أولًا، كُشِف الحرف التالي."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"word","en":{"name":"Tongue Twister Challenge","players":"2+ players","needs":"<b>You need:</b> Nothing at all.","how":"Take turns attempting fiendish tongue twisters — \"she sells seashells,\" \"red lorry, yellow lorry\" — faster and faster each round. Trip over the words and you're out or you pass the challenge on. Whoever can rattle theirs off cleanest at top speed wins the giggles and the glory."},"ar":{"name":"تحدّي عثرة اللسان","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"تناوبوا على محاولة جُمَل مربكة للّسان — «خيط حرير على حائط خليل» — أسرع فأسرع كل جولة. من يتعثّر في الكلمات يخرج أو يمرّر التحدّي. من ينطقها أنظف بسرعة يفوز بالضحك والمجد."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"guessing","en":{"name":"Psychiatrist","players":"4+ players","needs":"<b>You need:</b> Nothing at all.","how":"One player, the \"psychiatrist,\" steps away while the group secretly agrees on a rule for how they'll answer — say, everyone responds as though they were the person on their left. The psychiatrist returns and asks anyone questions, trying to diagnose the hidden pattern behind the strange, mismatched answers. Crack the rule to win."},"ar":{"name":"الطبيب النفسي","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"يبتعد لاعب ليكون «الطبيب»، وتتّفق المجموعة سرًّا على قاعدة لإجاباتها — مثلًا يجيب كلٌّ كأنه الشخص على يساره. يعود الطبيب ويسأل الجميع، محاولًا تشخيص النمط الخفي من الإجابات الغريبة المتنافرة. من يكتشف القاعدة يفوز."}},{"tags":["two","small","big"],"meter":1,"cat":"guessing","en":{"name":"Hot and Cold","players":"2+ players","needs":"<b>You need:</b> A small object to hide.","how":"One player hides an object or picks a secret target while another searches for it. The rest guide the seeker purely with temperature — \"warmer\" as they close in, \"colder\" as they drift away, \"boiling!\" when they're almost on it. Simple, gleeful, and endlessly replayable, especially with little ones."},"ar":{"name":"ساخن وبارد","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> غرض صغير للإخفاء.","how":"يخفي لاعب غرضًا أو يختار هدفًا سرّيًّا بينما يبحث آخر عنه. يوجّهه الباقون بالحرارة — «أسخن» كلما اقترب، و«أبرد» كلما ابتعد، و«يغلي!» حين يكاد يصل. بسيطة ومبهجة وإعادتها لا تنتهي، خصوصًا مع الصغار."}},{"tags":["two","small","big","nosupplies"],"meter":1,"cat":"guessing","en":{"name":"Name That Tune","players":"2+ players","needs":"<b>You need:</b> Nothing but songs in your head.","how":"One person hums, whistles, or taps out the rhythm of a song and everyone races to name it. For a bolder round, challenge each other to guess a tune from just the first few notes. A point for every correct call, and bonus bragging rights for naming it fastest."},"ar":{"name":"خمّن اللحن","players":"لاعبان فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء سوى أغانٍ في رأسك.","how":"يدندن أحدهم لحن أغنية أو ينقر إيقاعها ويتسابق الجميع على تسميتها. لجولة أجرأ، تحدّوا بعضكم على تخمين اللحن من أول بضع نغمات فقط. نقطة لكل تخمين صحيح، وتباهٍ إضافي لأسرع من يسمّيها."}},{"tags":["small","big","nosupplies"],"meter":2,"cat":"guessing","en":{"name":"Who's the Leader?","players":"5+ players","needs":"<b>You need:</b> Nothing at all.","how":"Send one player out of earshot to be the detective. The rest sit in a circle and pick a secret leader who starts an action — clapping, then patting knees, then waving — that everyone copies at once. The detective returns to the middle and gets three guesses to spot who's quietly changing the moves while the whole circle follows."},"ar":{"name":"من القائد؟","players":"5 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> لا شيء على الإطلاق.","how":"أرسلوا لاعبًا بعيدًا عن السمع ليكون المحقّق. يجلس الباقون في دائرة ويختارون قائدًا سرّيًّا يبدأ حركة — تصفيق، ثم نقر على الركب، ثم تلويح — يقلّدها الجميع دفعة واحدة. يعود المحقّق إلى الوسط وله ثلاث محاولات لكشف من يغيّر الحركات سرًّا بينما تتبعه الدائرة كلها."}},{"tags":["small","big"],"meter":2,"cat":"acting","en":{"name":"Reverse Charades","players":"4+ (teams)","needs":"<b>You need:</b> Word slips and a timer.","how":"Charades turned upside down: instead of one actor, the whole team acts out the word together while a single teammate tries to guess it. It's gloriously chaotic and takes the pressure off any one person. Race to land as many words as you can before the timer runs out."},"ar":{"name":"التمثيل الصامت المعكوس","players":"4 لاعبين فأكثر (فِرق)","needs":"<b>تحتاج إلى:</b> قصاصات كلمات ومؤقّت.","how":"التمثيل الصامت بالمقلوب: يمثّل الفريق كله الكلمة معًا بينما يحاول زميل واحد معيّن تسميتها. فوضوية وسريعة ورائعة لأنها ترفع الضغط عن أي شخص بمفرده. تسابقوا على أكبر عدد من الكلمات قبل انتهاء الوقت."}},{"tags":["small","big"],"meter":2,"cat":"acting","en":{"name":"Drawing Telephone","players":"4+ players","needs":"<b>You need:</b> Paper and pens for everyone.","how":"A hilarious cross between Telephone and sketching. Everyone writes a phrase at the top of their page and passes it on; the next person draws it, folds the words out of sight, and passes just the picture; the next writes what they think the drawing shows. Unfold the stacks at the end to watch \"a cat riding a bicycle\" mutate into glorious nonsense."},"ar":{"name":"الهاتف بالرسم","players":"4 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> ورق وأقلام للجميع.","how":"مزيج مضحك بين «الهاتف» والرسم. يكتب الجميع عبارة أعلى ورقتهم ويمرّرونها؛ يرسمها التالي، ويطوي الكلمات بعيدًا، ويمرّر الرسم فقط؛ ثم يكتب من يليه ما يظنّ أن الرسم يصوّره — وهكذا. افتحوا الأكوام في النهاية لتروا كيف تحوّلت «قطّة تركب دراجة» إلى شيء لا يُعرَف."}},{"tags":["small","big"],"meter":1,"cat":"cards","en":{"name":"Old Maid","players":"3+ players","needs":"<b>You need:</b> A deck with one card removed to leave an odd one out.","how":"Deal the cards out and everyone discards any pairs from their hand. Then take turns drawing a card from the player beside you, making and discarding new pairs as you go. One lonely card has no match — whoever's left holding the \"old maid\" when everything else is paired off loses the round."},"ar":{"name":"العانس","players":"3 لاعبين فأكثر","needs":"<b>تحتاج إلى:</b> مجموعة ورق تُنزَع منها ورقة لتبقى فردية.","how":"وزّعوا الورق ويرمي الجميع أي أزواج في أيديهم. ثم تناوبوا سحب ورقة من اللاعب المجاور، وتكوين ورمي أزواج جديدة. ورقة واحدة وحيدة — «العانس» — بلا شريك؛ من يبقى ممسكًا بها بعد نفاد كل الأزواج يخسر الجولة."}},{"tags":["two","small"],"meter
