م الذي أجّلناه ونستحق أن نبدأ به هذا العام؟"},{"en":"When did you recently feel understood by me without needing words?","ar":"متى شعرت مؤخراً بأنني أفهمك دون أن تحتاج للكلام؟"},{"en":"What do you miss about me when I'm away for even a day?","ar":"ما الشيء الذي تفتقده فيّ حين أغيب عنك ليوم واحد؟"},{"en":"If we wrote one rule to protect us forever, what would it be?","ar":"لو كتبنا «قانوناً» واحداً يحمي علاقتنا للأبد، فماذا سيكون؟"},{"en":"What's the loveliest compliment I've paid you that you still remember?","ar":"ما أجمل مجاملة سمعتها مني وما زلت تتذكرها؟"},{"en":"How have I changed for the better since you've known me?","ar":"في أي شيء تراني قد تغيّرت للأفضل منذ عرفتني؟"},{"en":"If I gifted you a trip anywhere tomorrow, where would we go?","ar":"لو أهديتك رحلة إلى أي مكان في العالم غداً، أين تريد أن نذهب؟"},{"en":"What makes you feel truly loved, beyond words?","ar":"ما الذي يجعلك تشعر بأنك محبوب فعلاً وليس بالكلام فقط؟"},{"en":"Which tiny daily ritual would leave you feeling something's missing if we stopped?","ar":"ما الطقس اليومي الصغير الذي لو توقّفنا عنه لشعرت أن شيئاً ناقص؟"},{"en":"When did I stand up for you without you ever knowing?","ar":"ما الموقف الذي دافعتُ فيه عنك دون أن تعلم؟"},{"en":"One word for our marriage this year — what is it?","ar":"لو وصفت زواجنا بكلمة واحدة هذا العام، فما هي؟"},{"en":"What do I need to hear from you more often?","ar":"ما الشيء الذي أحتاج أن أسمعه منك أكثر؟"},{"en":"Which decision we made together are you still proudest of?","ar":"ما أكثر قرار اتخذناه معاً وتفخر به حتى اليوم؟"},{"en":"How has your view of love changed from the start of our marriage to now?","ar":"كيف تغيّرت نظرتك للحب بين بداية زواجنا والآن؟"},{"en":"What habit do you wish we'd let go of together, for our own peace?","ar":"ما العادة التي أتمنى لو نتخلّى عنها معاً لأجل راحتنا؟"},{"en":"When were you proud of me but never said it out loud?","ar":"متى شعرت بأنك فخور بي ولم تقلها بصوت عالٍ؟"},{"en":"Which place reminds you of our best days?","ar":"ما المكان ال n":"What's the weirdest crush you've had?","ar":"ما أغرب إعجابٍ راودك؟"},{"en":"What's something that I don't know?","ar":"ما الشيء الذي لا أعرفه عنك؟"},{"en":"If I woke up tomorrow and our marriage was perfect, what would I be saying and doing differently than I did today? What difference would it make to our marriage if I chose to start doing those things today?","ar":"لو استيقظت غداً وصار زواجنا مثالياً، فماذا سأقول وأفعل بشكلٍ مختلف عن اليوم؟ وما الفرق الذي سيُحدثه لو بدأت بفعل ذلك اليوم؟"},{"en":"What's something you can wake your partner up for?","ar":"ما الشيء الذي يستحقّ أن تُوقظني لأجله؟"},{"en":"What is something that you have always wanted to tell me but haven't yet?","ar":"ما الشيء الذي طالما أردت أن تخبرني به ولم تفعل بعد؟"},{"en":"Have you thought about whether or not this will lead to a relationship?","ar":"هل فكّرت فيما إن كانت هذه العلاقة ستقود إلى ارتباط؟"},{"en":"Can we check in on where we are emotionally?","ar":"هل يمكننا أن نتفقّد أين نحن عاطفياً؟"},{"en":"have you considered if this has the potential to develop into a committed relationship? i've become more invested in this. how do you feel about it?","ar":"هل فكّرت إن كان لهذا أن يتطوّر إلى علاقة جادّة؟ لقد صرت أكثر تعلّقاً؛ فما شعورك؟"},{"en":"If my answer was \\"yes\\" What would be your question?","ar":"لو كان جوابي «نعم»، فما سيكون سؤالك؟"},{"en":"What are you most proud of us for doing/ achieving over the last few years?","ar":"ما أكثر ما تفخر بنا لأننا فعلناه أو حقّقناه في السنوات الأخيرة؟"},{"en":"When was the last time I made you feel very loved?","ar":"متى آخر مرة جعلتك تشعر بحبٍّ عميق؟"},{"en":"What's a story from your childhood that you've never shared with me, but think about often?","ar":"ما قصةٌ من طفولتك لم تُشاركني بها قط لكنك تفكّر فيها كثيراً؟"},{"en":"In 3 words, what was your first impression of me?","ar":"بثلاث كلمات، ما كان انطباعك الأول عنّي؟"},{"en":"Would you have dated me if we met five years before we did?","ar":"هل كنت ستواعدني لو التقينا قبل خمس سنوات ممّا حدث؟"},{"en":"When we first met, did you have any concerns about dating me? What were they?","ar":"حين التقينا أول مرة، هل ساورتك مخاوف من مواعدتي؟ وما كانت؟"},{"en":"If I was game for anything... What would a perfect day together look like?","ar":"لو كنت مستعداً لأي شيء… كيف سيبدو يومٌ مثالي معاً؟"},{"en":"What's the one thing you consider a deal breaker in our relationship?","ar":"ما الشيء الذي تعتبره خطاً أحمر في علاقتنا؟"},{"en":"Have you ever been jealous?","ar":"هل شعرت بالغيرة يوماً؟"},{"en":"Would you trust me in a room full of opportunistic and flirtatious people?","ar":"هل تثق بي في غرفةٍ مليئة بالانتهازيين والمُغازلين؟"},{"en":"What's something I do that you'll just never understand?","ar":"ما الشيء الذي أفعله ولن تفهمه أبداً؟"},{"en":"What's the one thing you think | don't support you on? How can I do better?","ar":"ما الشيء الذي تظن أنني لا أدعمك فيه؟ وكيف أتحسّن؟"},{"en":"What's one quality you think holds me back?","ar":"ما الصفة التي تظن أنها تعيقني؟"},{"en":"If my best friend flirted with you, would you tell me?","ar":"لو غازلَتك صديقتي المقرّبة، هل ستخبرني؟"},{"en":"What is one pet peeve you have about me that you would change in a heartbeat?","ar":"ما التصرّف المزعج الوحيد لديّ الذي كنت ستغيّره في لحظة؟"},{"en":"What's the worst thing about being with me?","ar":"ما أسوأ ما في كونك معي؟"},{"en":"Where do you actually see our relationship in five years?","ar":"أين ترى علاقتنا فعلاً بعد خمس سنوات؟"},{"en":"What are the top three traits you thought you wanted in a partner that i don't have?","ar":"ما أهمّ ثلاث صفات ظننت أنك تريدها في شريك ولا أملكها؟"},{"en":"What could i do that would make you reconsider our entire relationship?","ar":"ما الذي قد أفعله ويجعلك تعيد النظر في علاقتنا كلها؟"},{"en":"What's the one concern you have about us being together for life?","ar":"ما القلق الوحيد الذي يساورك بشأن بقائنا معاً مدى العمر؟"},{"en":"What's something I wouldn't guess about you?","ar":"ما الشيء الذي لن تخمّنه عنّي؟"},{"en":"Name three things you and your partn  of?","ar":"ما أجمل طلب زواجٍ سمعت عنه؟"},{"en":"Can you forgive betrayal?","ar":"هل تستطيع أن تسامح الخيانة؟"},{"en":"Is jealousy a sign of love?","ar":"هل الغيرة دليل على الحب؟"},{"en":"What's the difference between love and infatuation?","ar":"ما الفرق بين الحب والإعجاب؟"},{"en":"Can real love come back to life after it fades?","ar":"هل يمكن للحب الحقيقي أن يعود بعد أن يخبو؟"},{"en":"What are the signs of love, to you?","ar":"ما علامات الحب بالنسبة لك؟"},{"en":"What's the difference between loving and liking someone?","ar":"ما الفرق بين أن تحبّ شخصاً وأن تُعجب به؟"},{"en":"Do we choose a place for love, or does love change us?","ar":"هل نختار مكاناً للحب، أم أن الحب يغيّرنا؟"},{"en":"Are you searching for love, or waiting for it to find you?","ar":"هل تبحث عن الحب أم تنتظر أن يجدك؟"},{"en":"Do relationships need constant work?","ar":"هل تحتاج العلاقات إلى عملٍ مستمر؟"},{"en":"Can you be drawn to someone who's wrong for you?","ar":"هل يمكن أن ينجذب قلبك لشخصٍ لا يناسبك؟"},{"en":"Do you find it easy to express your feelings?","ar":"هل يسهل عليك التعبير عن مشاعرك؟"},{"en":"Do you believe the right person comes at the right time?","ar":"هل تؤمن أن الشخص المناسب يأتي في الوقت المناسب؟"},{"en":"Would you marry someone your parents didn't approve of?","ar":"هل تتزوّج شخصاً لا يوافق عليه والداك؟"},{"en":"Do you think marriage limits your freedom?","ar":"هل تظن أن الزواج يحدّ من حرّيتك؟"},{"en":"In which past relationship were you happiest, and why did it end?","ar":"في أي علاقةٍ سابقة كنت أسعد، ولماذا انتهت؟"},{"en":"How long does love live?","ar":"كم يعيش الحب؟"},{"en":"How would you describe falling in love?","ar":"كيف تصف الوقوع في الحب؟"},{"en":"Something you wish the other person understood about you?","ar":"شيءٌ تتمنى لو يفهمه الطرف الآخر عنك؟"},{"en":"What's challenging about being a spouse?","ar":"ما التحدّي في أن تكون زوجاً أو زوجة؟"},{"en":"What made you fall in love with your partner?","ar":"ما الذي جعلك تقع في حبّ شريكك؟"},{"en":"Whose relationship do you admire, and why?","ar":"أي علاقةٍ تُعجب بها، ولماذا؟"},{"en":"What did you learn about marriage from your parents — good and bad?","ar":"ماذا تعلّمت عن الزواج من والديك، في الخير والخطأ؟"},{"en":"What would you say to your children on their wedding day?","ar":"ماذا ستقول لأبنائك في يوم زفافهم؟"},{"en":"Something you wish the opposite sex understood about you?","ar":"شيءٌ تتمنى لو يفهمه الجنس الآخر عنك؟"}]},"engaged":{"labelEn":"Engaged","labelAr":"المخطوبون","emoji":"💍","accent":"#E05A54","items":[{"en":"How do you picture an ordinary day in our life after marriage?","ar":"ما الصورة التي ترسمها في خيالك عن «يوم عادي» في حياتنا بعد الزواج؟"},{"en":"What value could you never compromise on in our future home?","ar":"ما القيمة التي لا يمكن أن تتنازل عنها في بيت المستقبل؟"},{"en":"How would you want us to handle our first big disagreement?","ar":"كيف تحب أن نتعامل مع أول خلاف كبير بيننا؟"},{"en":"What does 'home' mean to you beyond a place?","ar":"ما الذي يعنيه لك «البيت» أكثر من كونه مكاناً؟"},{"en":"Which family tradition you grew up with do you want to pass on to our kids?","ar":"ما العادة العائلية التي نشأت عليها وتتمنى أن ننقلها لأولادنا؟"},{"en":"What do you fear might change in you or me after marriage?","ar":"ما الشيء الذي تخاف أن يتغيّر فيك أو فيّ بعد الزواج؟"},{"en":"How should we split home responsibilities so it feels fair to us both?","ar":"كيف نوزّع مسؤوليات البيت بشكل يشعر كلانا بالإنصاف؟"},{"en":"What dream do you want us to reach in our first five years?","ar":"ما الحلم الذي تريد أن نحققه في أول خمس سنوات من زواجنا؟"},{"en":"Who in your family do you want me to know better, and why?","ar":"من هو الشخص في عائلتك الذي تريدني أن أعرفه أكثر ولماذا؟"},{"en":"How do you like me to support you on your hard days?","ar":"كيف تحب أن أدعمك في أيامك الصعبة؟"},{"en":"What do you consider a red line in any relationship?","ar":"ما الحدّ الذي تعتبره خطاً أحمر في أي علاقة؟"},{"en":"If we disagreed on a big money decision, how would we reach a solution we both accept?","ar" as greatly improved the world?","ar":"ما الاختراع الذي لا يُقدَّر كفايةً رغم أنه حسّن العالم كثيراً؟"},{"en":"What are you interested in that most people aren't?","ar":"ما الذي يهمّك ولا يهتمّ به معظم الناس؟"},{"en":"What's something people don't worry about but really should?","ar":"ما الشيء الذي لا يقلق الناس بشأنه بينما يجب أن يفعلوا؟"},{"en":"When was the last time you felt you had a new lease on life?","ar":"متى آخر مرة شعرت وكأن لك حياةً جديدة؟"},{"en":"What's the hardest you've ever worked?","ar":"ما أشدّ ما عملت بجدٍّ في حياتك؟"},{"en":"What's the most depressing meal you've eaten?","ar":"ما أكثر وجبةٍ كئيبة أكلتها؟"},{"en":"Which of your vices or bad habits would be the hardest to give up?","ar":"أي عاداتك السيّئة سيكون التخلّي عنها الأصعب؟"},{"en":"How comfortable are you speaking in front of large groups of people?","ar":"ما مدى ارتياحك للحديث أمام حشدٍ كبير؟"},{"en":"When was the last time you immediately regretted something you said?","ar":"متى آخر مرة ندمت فوراً على شيءٍ قلته؟"},{"en":"What would be the best thing you could reasonably expect to find in a cave?","ar":"ما أفضل شيءٍ يمكن أن تتوقّع إيجاده في كهف؟"},{"en":"What's something that everyone, absolutely everyone, in the entire world can agree on?","ar":"ما الشيء الذي يتّفق عليه كل البشر في العالم بلا استثناء؟"},{"en":"What's some insider knowledge that only people in your line of work have?","ar":"ما المعرفة الخاصة التي لا يملكها إلا من في مجال عملك؟"},{"en":"If people receive a purple heart for bravery, what would other color hearts represent?","ar":"لو مُنح الشجعان قلباً أرجوانياً، فماذا ستمثّل القلوب بالألوان الأخرى؟"},{"en":"What's the most historic thing that has happened in your lifetime?","ar":"ما أهمّ حدثٍ تاريخي وقع في حياتك؟"},{"en":"What happens in your country regularly that people in most countries would find strange or bizarre?","ar":"ما الذي يحدث في بلدك بشكلٍ اعتيادي ويجده أهل معظم البلدان غريباً؟"},{"en":"What scientific discovery would change the course of humanity overnight if  place was your own private world when you were small?","ar":"ما المكان الذي كان بمثابة «عالمك الخاص» وأنت صغير؟"},{"en":"Who taught you the first skill you're still proud of?","ar":"من علّمك أول مهارة تفخر بها حتى اليوم؟"},{"en":"What's the best summer holiday stuck in your memory?","ar":"ما أجمل عطلة صيفية عالقة في ذاكرتك؟"},{"en":"What did you collect or care for with passion as a child?","ar":"ما الشيء الذي كنت تجمعه أو تعتني به بشغف وأنت طفل؟"},{"en":"What's the cheekiest thing you did that no one ever found out?","ar":"ما أطرف موقف مشاغب فعلته ولم يكتشفه أحد؟"},{"en":"What dish meant 'a special day' in your childhood?","ar":"ما الطبق الذي كان يعني لك «يوماً مميزاً» في طفولتك؟"},{"en":"Who was your closest childhood friend, and where are they now?","ar":"من كان أقرب أصدقاء الطفولة إليك، وأين هو الآن؟"},{"en":"What story shaped your imagination as a child?","ar":"ما القصة أو الحكاية التي شكّلت خيالك وأنت صغير؟"},{"en":"What was your biggest neighborhood adventure as a kid?","ar":"ما أكبر مغامرة خضتها في الحيّ وأنت طفل؟"},{"en":"What phrase did your parents repeat that you understand better now?","ar":"ما الجملة التي كان يردّدها والداك وتفهمها الآن أكثر؟"},{"en":"What gift changed your childhood the moment you got it?","ar":"ما الهدية التي غيّرت طفولتك حين استلمتها؟"},{"en":"When did you suddenly feel you'd grown up?","ar":"ما اللحظة التي شعرت فيها أنك «كبرت» فجأة؟"},{"en":"What did you long to do as a child but never dared?","ar":"ما الشيء الذي كنت تتمنى فعله في طفولتك ولم تجرؤ؟"},{"en":"Where was your favorite hiding spot?","ar":"ما أكثر مكان كنت تحب الاختباء فيه؟"},{"en":"What childhood habit have you kept to this day?","ar":"ما العادة الطفولية التي ما زلت تحتفظ بها حتى اليوم؟"},{"en":"Who made your childhood better simply by being there?","ar":"من الشخص الذي جعل طفولتك أجمل بمجرّد وجوده؟"},{"en":"What's the hardest lesson you learned young?","ar":"ما أصعب درس تعلّمته وأنت صغير؟"},{"en":"What did you believe as a child and later discover was wrong?","ar":"ما ا seum, what kind of museum would you create?","ar":"لو مُنحت خمسة ملايين لافتتاح متحفٍ صغير، فأي نوعٍ من المتاحف ستنشئ؟"},{"en":"If you could know the truth behind every conspiracy, but you would instantly die if you hinted that you knew the truth, would you want to know?","ar":"لو أمكنك معرفة الحقيقة خلف كل نظرية مؤامرة، لكنك ستموت فوراً إن ألمحت أنك تعرفها، فهل تودّ أن تعرف؟"},{"en":"If you were given one thousand acres of land that you didn't need to pay taxes on but couldn't sell, what would you do with it?","ar":"لو مُنحت ألف فدّانٍ من الأرض بلا ضرائب لكن دون بيعها، فماذا ستفعل بها؟"},{"en":"If you could hack into any one computer, which computer would you choose?","ar":"لو أمكنك اختراق جهاز حاسوبٍ واحد، فأيّها ستختار؟"},{"en":"If you had to disappear and start a whole new life, what would you want your new life to look like?","ar":"لو اضطررت للاختفاء وبدء حياةٍ جديدة كلياً، فكيف تريدها أن تبدو؟"},{"en":"If you had a HUD that showed three stats about any person you looked at, what three stats would you want it to show?","ar":"لو كان لديك شاشةٌ تُظهر ثلاث إحصاءاتٍ عن أي شخص تنظر إليه، فما الثلاث التي تريدها؟"},{"en":"If you could talk to animals and they would understand you, but you couldn't understand them, what would you do with that power?","ar":"لو أمكنك أن تكلّم الحيوانات وتفهمك دون أن تفهمها أنت، فماذا ستفعل بهذه القدرة؟"},{"en":"If you were a clown themed super hero, what powers would you have?","ar":"لو كنت بطلاً خارقاً بطابع مهرّج، فما القوى التي ستملكها؟"},{"en":"If you could airdrop anything you want, worth two million dollars or less, anywhere you want, what would you airdrop and where would you airdrop it?","ar":"لو أمكنك إسقاط أي شيءٍ بقيمة مليونين أو أقل في أي مكانٍ تريد، فماذا ستُسقط وأين؟"},{"en":"If you lived in a virtual reality world of your own creation, what would it look like?","ar":"لو عشت في عالم واقعٍ افتراضي من صنعك، فكيف سيبدو؟"},{"en":"If you were given unlimited resources, how would you lure the worst of humanity into one stadium at the same time?","ar":"لو مُنحت موارد لا محدودة، فكيف ستستدرج أسوأ البشر إلى ملعبٍ واحد في وقتٍ واحد؟"},{"en":"What piece of \\"art\\" would you create if you had to pretend to be an artist and submit something to a gallery?","ar":"أي «عملٍ فني» ستصنع لو اضطررت للتظاهر بأنك فنان وتقديم شيءٍ لمعرض؟"},{"en":"If you were in charge renaming things so that their names would be more accurate, what names would you come up with?","ar":"لو كُلّفت بإعادة تسمية الأشياء لتصير أسماؤها أدقّ، فما الأسماء التي ستبتكرها؟"},{"en":"If you were hired to show tourists what life is really like where you live, what would you show them / have them do?","ar":"لو استُؤجرت لتُري السيّاح كيف هي الحياة حقاً حيث تعيش، فماذا ستُريهم أو تجعلهم يفعلون؟"},{"en":"What was the last situation where some weird stuff went down and everyone acted like it was normal, and you weren't sure if you were crazy or everyone around you was crazy?","ar":"ما آخر موقفٍ حدثت فيه أمورٌ غريبة وتصرّف الجميع كأنها عادية، ولم تكن متأكداً إن كنت أنت المجنون أم من حولك؟"},{"en":"How much of your body would you cybernetically enhance if you could?","ar":"لو أمكنك تعزيز جسدك آلياً، فكم منه ستعزّز؟"},{"en":"If you had a giraffe that you needed to hide, where would you hide it?","ar":"لو كان لديك زرافةٌ عليك إخفاؤها، فأين ستخفيها؟"},{"en":"If you could \\"un-invent\\" something, what would it be? Why?","ar":"لو أمكنك «إلغاء اختراع» شيءٍ، فماذا سيكون؟ ولماذا؟"},{"en":"If you were paid your current salary to do any other job for a year, what would you do?","ar":"لو دُفع لك راتبك الحالي لتؤدّي أي عملٍ آخر لعام، فماذا ستفعل؟"},{"en":"If you could take a year off to pursue something with no financial constraints, what would it be?","ar":"لو أمكنك أخذ سنةٍ لتلاحق شيئاً دون قيودٍ مالية، فماذا سيكون؟"},{"en":"If you could relive one year of your life, which one would it be and why?","ar":"لو أمكنك أن تعيش سنةً من حياتك من جديد، فأيّها ولماذا؟"},{"en":"If you could have one conversation with someone from your past, who would it be and what would you discuss?","ar":"لو أمكنك إجراء حديثٍ واحد مع شخصٍ من ماضيك، فمن يكون وعمَّ ستتحدثان؟"},{"en":"If you had the power to change one law, policy, or rule in the world, what would it be and why?","ar":"لو ملكت القدرة على تغيير قانونٍ أو سياسةٍ أو قاعدة في العالم، فماذا ولماذا؟"},{"en":"If you could immerse yourself in a new culture or way of life for a year,where and how would you choose to live?","ar":"لو أمكنك الانغماس في ثقافةٍ أو نمط حياةٍ جديد لعام، فأين وكيف ستختار أن تعيش؟"},{"en":"If you could teleport to any place in the world at this very moment, where would you go and why?","ar":"لو أمكنك الانتقال فوراً إلى أي مكانٍ في العالم الآن، فأين ستذهب ولماذا؟"},{"en":"If you could send a message to the entire world and have them listen, what would you say?","ar":"لو أمكنك إرسال رسالةٍ للعالم كلّه ويُصغي إليك، فماذا ستقول؟"},{"en":"If you had 24 hours with me and I couldn't say NO What would we do?","ar":"لو كان لك 24 ساعة معي ولا يمكنني أن أرفض، فماذا سنفعل؟"},{"en":"If you could spend a day in my body/head, what would you do?","ar":"لو أمكنك أن تقضي يوماً في جسدي أو رأسي، فماذا ستفعل؟"},{"en":"If you had to choose one thing you never want me to stop doing for you, what would it be?","ar":"لو اضطررت لاختيار شيءٍ واحد لا تريدني أن أتوقّف عن فعله لك، فماذا سيكون؟"},{"en":"If you had to choose one thing you want me to start doing for you, what would it be?","ar":"لو اضطررت لاختيار شيءٍ واحد تريدني أن أبدأ بفعله لك، فماذا سيكون؟"},{"en":"if you were offered a billion dollars to call Someone and only got The money if they don't answer. Who would you call?","ar":"لو عُرض عليك مليار مقابل الاتصال بشخصٍ ولن تحصل على المال إلا إن لم يُجب، فبمن ستتّصل؟"},{"en":"If you could invite anyone in the world to dinner, who would it be?","ar":"لو أمكنك دعوة أي شخصٍ في العالم للعشاء، فمن سيكون؟"},{"en":"If you were able to live to the age of 90 and retain either the mind or body of a 3o year old for the last 6o years of your life, which would you want?","ar":"لو أمكنك أن تعيش حتى التسعين محتفظاً إما بعقل أو بجسد شابٍّ في الثلاثين للستين سنة الأخيرة، فأيّهما تختار؟"},{"en":"If you could wake up tomorror having gained any one quality or ability, that would it be?","ar":"لو استيقظت غداً وقد اكتسبت أي صفةٍ أو قدرة، فماذا تختار؟"},{"en":"If you could change anything about the way you were raised, that would it be?","ar":"لو أمكنك تغيير أي شيءٍ في طريقة تربيتك، فماذا سيكون؟"},{"en":"What, if anything, is too serious to be joked about?","ar":"ما الذي — إن وُجد — جادٌّ أكثر من أن يُمزَح فيه؟"},{"en":"If you were to die this evening with no opportunity to communicate ith anyone, what would you most regret not having told someone? Why haven't you told them yet?","ar":"لو رحلت هذا المساء دون فرصةٍ لمخاطبة أحد، فما أكثر ما ستندم أنك لم تقله لشخص؟ ولماذا لم تقله بعد؟"},{"en":"if you could get a chance go back in time and change your decision that you made what would you have done?","ar":"لو أُتيحت لك فرصةٌ للعودة في الزمن وتغيير قرارٍ اتخذته، فماذا كنت ستفعل؟"},{"en":"If you were going to be an object, what object would you be?","ar":"لو كان عليك أن تصير شيئاً جماداً، فأي شيءٍ ستكون؟"},{"en":"\\"What's your favourite memory or moment you spent with me?\\" If you had to describe me to someone who's never met me, what would you say? What's one thing she does that instantly calms you down?","ar":"لو وصفتني لشخصٍ لم يقابلني قط، فماذا ستقول، وما الشيء الذي أفعله ويُهدّئك فوراً؟"},{"en":"If you could have one do-over in life, what would it be?","ar":"لو أُتيحت لك إعادة واحدة في الحياة، فماذا ستكون؟"},{"en":"If you were to apologize to your mom for anything, what would it be?","ar":"لو اعتذرت لأمّك عن أي شيء، فعمَّ سيكون؟"},{"en":"What's a superpower you'd love to have?","ar":"ما القوة الخارقة التي تتمنى امتلاكها؟"},{"en":"If you could make one change in the world, what would it be?","ar":"لو أمكنك إحداث تغييرٍ واحد في العالم، فماذا سيكون؟"},{"en":"If you could have a superpower, what would it be and why?","ar":"لو ملكت قوةً خارقة، فماذا ستكون ولماذا؟"},{" e?","ar":"لو أمكنك تغيير شيءٍ واحد في العالم، فماذا سيكون؟"},{"en":"What's the first thing you'd do if you were the only person left on Earth?","ar":"ما أول ما ستفعله لو كنت آخر إنسانٍ على الأرض؟"},{"en":"If you had one year left to live, what would you do?","ar":"لو بقيت لك سنةٌ واحدة لتعيشها، فماذا ستفعل؟"},{"en":"If you woke up tomorrow with no fear, what would you do first?","ar":"لو استيقظت غداً بلا خوف، فما أول ما ستفعله؟"},{"en":"If you could change one thing in this relationship, what would you change?","ar":"لو أمكنك تغيير شيءٍ واحد في هذه العلاقة، فماذا ستغيّر؟"},{"en":"If you could pick one year of your life to do over, which would it be and why?","ar":"لو أمكنك اختيار سنةٍ من حياتك لتعيدها، فأيّها ولماذا؟"},{"en":"If a magic mirror showed us our future, what's the first thing you'd want to check?","ar":"لو أرانا مرآةٌ سحرية مستقبلنا، فما أول ما تودّ أن تتحقّق منه؟"},{"en":"If you could go back in time, would you change anything?","ar":"لو أمكنك العودة في الزمن، فهل ستغيّر شيئاً؟"},{"en":"If you could get a message from your future self, what would you want it to say?","ar":"لو أمكنك تلقّي رسالةٍ من نفسك المستقبلي، فماذا تودّ أن تقول؟"},{"en":"If you had to give everyone alive one piece of advice, what would it be?","ar":"لو اضطررت لإعطاء كل الأحياء نصيحةً واحدة، فماذا ستكون؟"},{"en":"If you could give a TED Talk, what would it be about?","ar":"لو ألقيت محاضرة، فعمَّ ستكون؟"},{"en":"If you could master any skill instantly, what would it be?","ar":"لو أمكنك إتقان أي مهارةٍ فوراً، فماذا ستكون؟"},{"en":"What's the one what if that keeps you awake at night?","ar":"ما «ماذا لو» الوحيد الذي يُبقيك مستيقظاً في الليل؟"},{"en":"If you could tell your past self anything, what would you say?","ar":"لو أمكنك أن تقول لنفسك في الماضي أي شيء، فماذا ستقول؟"},{"en":"What's the part of me you would fix if you could?","ar":"ما الجزء منّي الذي كنت ستصلحه لو استطعت؟"},{"en":"If you could confront anyone from your past, who would it be?","ar":"لو أمكنك مواجهة أي شخصٍ من ماضيك،  your favorite thing I've introduced you to?","ar":"ما الشيء المفضّل الذي عرّفتك عليه؟"},{"en":"What is your love language?","ar":"ما لغة حبّك؟"},{"en":"What's the most heartfelt text message they ever sent you?","ar":"ما أصدق رسالةٍ أرسلوها لك يوماً؟"},{"en":"What's the best gift I've given you? Material and Immaterial?","ar":"ما أفضل هديةٍ قدّمتها لك، مادّية وغير مادّية؟"},{"en":"How do you know I'm having a bad day?","ar":"كيف أعرف أنك تمرّ بيومٍ سيّئ؟"},{"en":"What's your favorite nickname I've given you?","ar":"ما اللقب المفضّل الذي أطلقته عليك؟"},{"en":"What would you hate for everyone to know about you?","ar":"ما الذي ستكره أن يعرفه الجميع عنك؟"},{"en":"What's a promise you made to yourself that you failed to keep?","ar":"ما الوعد الذي قطعته لنفسك وأخفقت في الوفاء به؟"},{"en":"What's more important: forgiveness or acceptance?","ar":"أيّهما أهمّ: المسامحة أم التقبّل؟"},{"en":"How do you think others see you? How would you like to be seen?","ar":"كيف تظن أن الآخرين يرونك؟ وكيف تودّ أن تُرى؟"},{"en":"What are you saving up for right now?","ar":"لأي شيءٍ تدّخر المال الآن؟"},{"en":"What's something I'm too hard on myself about?","ar":"ما الشيء الذي أقسو فيه على نفسي أكثر من اللازم؟"},{"en":"If your life was a movie, which scene would you replay over and over?","ar":"لو كانت حياتك فيلماً، فأي مشهدٍ ستعيده مراراً وتكراراً؟"}]}}`),scenes:[{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`You're both stuck in an elevator that just stopped. One of you is terrified of small spaces; the other won't stop humming.`,ar:`عالقان في مصعد توقّف فجأة — أحدكما يرعبه المكان الضيّق، والآخر لا يتوقّف عن الدندنة.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A customer tries to return a “haunted” toaster to a shop clerk who stays perfectly calm.`,ar:`زبون يحاول إرجاع محمّصة «مسكونة» إلى بائع يبقى هادئ الأعصاب تمامًا.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`Two old friends meet by pure chance after ten years apart.`,ar:`صديقان قديمان يلتقيان مصادفةً بعد عشر سنوات من الفراق.`},{cat:`any`,tone:`Absurd`,cast:`2 actors`,en:`Aliens visit Earth and try to order food at a restaurant for the very first time.`,ar:`كائنات فضائية تزور الأرض وتحاول طلب الطعام في مطعم لأول مرة.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A wildly dramatic weather reporter covers a light drizzle like it's the end of the world.`,ar:`مذيع نشرة جوية شديد الدراما يغطّي رذاذ مطر خفيف وكأنه نهاية العالم.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A job interview where the candidate keeps inventing ridiculous “skills.”`,ar:`مقابلة عمل، والمرشّح يخترع باستمرار «مهارات» سخيفة.`},{cat:`any`,tone:`Heartfelt`,cast:`1 actor`,en:`Someone works up the courage to finally apologize to a person they hurt.`,ar:`شخص يجمع شجاعته أخيرًا ليعتذر لشخص جرحه.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A tour guide walking visitors through the most boring museum in the world.`,ar:`مرشد سياحي يجول بالزوّار في أكثر متحف ممل في العالم.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A superhero whose only power is being mildly, endlessly annoying.`,ar:`بطل خارق قوّته الوحيدة أنه مزعج بشكل بسيط ولا ينتهي.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`Two chefs on a cooking show whose dish just exploded on live TV.`,ar:`طاهيان في برنامج طبخ وطبقهما انفجر للتو على الهواء مباشرة.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`A parent gives advice to a child leaving home for the very first time.`,ar:`أحد الوالدين يقدّم نصيحة لابنه وهو يغادر البيت لأول مرة.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A detective very seriously solving the mystery of who ate the last slice of cake.`,ar:`محقّق يحلّ بجدّية بالغة لغز مَن أكل آخر قطعة كيك.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A ghost trying to scare people — but who is extremely polite about it.`,ar:`شبح يحاول إخافة الناس، لكنه مؤدّب للغاية في ذلك.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`Two strangers share a bench, both clearly having the hardest day of their lives.`,ar:`غريبان يتشاركان مقعدًا، وكلاهما يمرّ بأصعب يوم في حياته بوضوح.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A magician whose tricks keep failing, but who refuses to admit it.`,ar:`ساحر تفشل خدعه باستمرار لكنه يرفض الاعتراف بذلك.`},{cat:`any`,tone:`Light`,cast:`2 actors`,en:`A phone call between two people who clearly dialed the wrong number, but keep talking anyway.`,ar:`مكالمة بين شخصين اتّصلا بالرقم الخطأ بوضوح، لكنهما يواصلان الحديث رغم ذلك.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A houseplant slowly realizing it might be the last plant on Earth. (Yes — be the plant.)`,ar:`نبتة تدرك ببطء أنها قد تكون آخر نبتة على الأرض. (نعم، مثّل دور النبتة.)`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`Saying goodbye to someone at an airport, not knowing when you'll meet again.`,ar:`توديع شخص في المطار دون أن تعرف متى ستلتقيان من جديد.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A GPS voice that has completely given up and is now just guessing the directions.`,ar:`صوت ملّاح استسلم تمامًا وصار يخمّن الاتجاهات فقط.`},{cat:`any`,tone:`Light`,cast:`1 actor`,en:`A first day at a new job where everything that can go wrong, does.`,ar:`أول يوم في وظيفة جديدة، وكل ما يمكن أن يسوء يسوء فعلًا.`},{cat:`any`,tone:`Absurd`,cast:`2 actors`,en:`Two socks in a dryer arguing about why one of them always disappears.`,ar:`جوربان داخل النشّافة يتجادلان حول سبب اختفاء أحدهما دائمًا.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`A person meets their childhood self and gives them one piece of advice.`,ar:`شخص يلتقي بنفسه في الطفولة ويمنحها نصيحة واحدة.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A wildly intense yoga instructor leading a class that clearly does not want to be there.`,ar:`مدرّب يوغا شديد الحماس يقود صفًّا من الواضح أنه لا يريد أن يكون هناك.`},{cat:`any`,tone:`Light`,cast:`2 actors`,en:`Ordering coffee from a barista who takes the order far too seriously.`,ar:`طلب قهوة من بائع يأخذ الطلب على محمل الجدّ أكثر من اللازم.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A king calls an emergency royal meeting because the kingdom ran out of niture together, with instructions written in a language neither of you understands.`,ar:`ركّبا أثاثًا معًا، وتعليماته مكتوبة بلغة لا يفهمها أيٌّ منكما.`},{cat:`couple`,tone:`Romantic`,cast:`2 actors`,en:`Roleplay meeting each other again for the first time — thirty years in the future.`,ar:`مثّلا لقاءكما من جديد لأول مرة — بعد ثلاثين عامًا في المستقبل.`},{cat:`couple`,tone:`Funny`,cast:`2 actors`,en:`One of you is a waiter, the other a very picky customer, on an awkward blind date.`,ar:`أحدكما نادل، والآخر زبون شديد التطلّب، في موعد أعمى محرج.`},{cat:`couple`,tone:`Heartfelt`,cast:`2 actors`,en:`One of you gives a heartfelt toast at the other's imaginary big celebration.`,ar:`أحدكما يلقي كلمة صادقة من القلب في احتفال كبير خيالي للآخر.`},{cat:`couple`,tone:`Flirty`,cast:`2 actors`,en:`You're two spies pretending not to know each other at a very fancy party.`,ar:`أنتما جاسوسان يتظاهران بأنهما لا يعرفان بعضهما في حفلة فاخرة جدًا.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A hairdresser who's clearly not listening gives you a haircut you never asked for.`,ar:`حلّاق من الواضح أنه لا ينصت يقصّ لك قصّة لم تطلبها أبدًا.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A pigeon delivering a very serious TED talk about the future of breadcrumbs.`,ar:`حمامة تلقي محاضرة «تِد» جادّة جدًا عن مستقبل فُتات الخبز.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`A teacher runs into a former student who says, “You changed my life.”`,ar:`معلّم يصادف طالبًا قديمًا يقول له: «أنت غيّرت حياتي».`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`Two people loudly pretending to understand a movie neither of them followed.`,ar:`شخصان يتظاهران بصوتٍ عالٍ بفهم فيلم لم يتابعه أيٌّ منهما.`},{cat:`any`,tone:`Light`,cast:`1 actor`,en:`Someone trying to eat a very loud, crunchy snack in a totally silent library.`,ar:`شخص يحاول تناول وجبة مقرمشة صاخبة في مكتبة صامتة تمامًا.`},{cat:`any`,tone:`Absurd`,cast:`2 actors`,en:`A knight and a dragon negotiating a peace treaty over a pot of tea.`,ar:`فارس وتنّين يتفاوضان على معاهدة سلام على إبريق شاي.`},{cat:`any`,tone:`Heartfelt`,cast:`1 actor`,en:`Someone writing a letter to their future self — out loud.`,ar:`شخص يكتب رسالة لنفسه في المستقبل — بصوتٍ مسموع.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A customer and a barista who keep mishearing each other's names.`,ar:`زبون وبائع قهوة يسيء كلٌّ منهما سماع اسم الآخر باستمرار.`},{cat:`any`,tone:`Light`,cast:`2 actors`,en:`Two neighbours in a passive-aggressive contest over whose garden is nicer.`,ar:`جاران في منافسة عدائية مبطّنة حول حديقة مَن أجمل.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A spider agonizing over where to build its web, as if it's the biggest decision in history.`,ar:`عنكبوت يتعذّب في اختيار مكان بناء شبكته وكأنه أهمّ قرار في التاريخ.`},{cat:`group`,tone:`Funny`,cast:`3+ actors`,en:`A group of friends trying to carry a giant, completely invisible object up the stairs.`,ar:`مجموعة أصدقاء يحاولون حمل شيء ضخم غير مرئيّ تمامًا إلى أعلى الدرج.`},{cat:`group`,tone:`Absurd`,cast:`3+ actors`,en:`A devoted cult — but only for people who really, really love one breakfast cereal.`,ar:`جماعة متعصّبة — لكن فقط لمن يعشقون نوعًا واحدًا من حبوب الفطور.`},{cat:`group`,tone:`Light`,cast:`3+ actors`,en:`A meeting that could have been an email, performed with maximum importance.`,ar:`اجتماع كان يكفي أن يكون بريدًا إلكترونيًا، يُمثَّل بأقصى درجات الأهمية.`},{cat:`group`,tone:`Funny`,cast:`3+ actors`,en:`Museum statues that only come alive when nobody is looking at them.`,ar:`تماثيل متحف لا تدبّ فيها الحياة إلا حين لا ينظر إليها أحد.`},{cat:`group`,tone:`Heartfelt`,cast:`3+ actors`,en:`A team loses the final match — and the captain gives the locker-room speech.`,ar:`فريق يخسر المباراة النهائية — ويلقي الكابتن خطبته في غرفة الملابس.`},{cat:`group`,tone:`Absurd`,cast:`3+ actors`,en:`Vegetables in a fridge holding a democratic vote on who gets eaten first.`,ar:`خضار داخل ثلّاجة تُجري تصويتًا ديمقراطيًا على مَن يُؤكَل أولًا.`},{cat:`couple`,tone:`Funny`,cast:`2 actors`,en:`A couple whisper-arguing, trying not to wake an (imaginary) sleeping baby.`,ar:`ثنائي يتشاجران همسًا، محاولَين عدم إيقاظ رضيع نائم (خيالي).`},{cat:`couple`,tone:`Romantic`,cast:`2 actors`,en:`Writing your wedding vows on the spot, out loud, with zero preparation.`,ar:`كتابة عهود زواجكما ارتجالًا، بصوتٍ مسموع، دون أيّ تحضير.`},{cat:`couple`,tone:`Flirty`,cast:`2 actors`,en:`You're both actors auditioning for the same romantic movie scene.`,ar:`كلاكما ممثّل يؤدّي تجربة أداء للمشهد الرومانسي نفسه.`},{cat:`couple`,tone:`Heartfelt`,cast:`2 actors`,en:`One of you describes the other to a stranger, not knowing they can hear every word.`,ar:`أحدكما يصف الآخر لغريب، دون أن يدري أن الآخر يسمع كل كلمة.`},{cat:`couple`,tone:`Funny`,cast:`2 actors`,en:`A couple on a cooking show who have, in fact, never cooked together before.`,ar:`ثنائي في برنامج طبخ لم يطبخا معًا من قبل قط.`},{cat:`couple`,tone:`Romantic`,cast:`2 actors`,en:`Slow-dancing to a song only the two of you can hear.`,ar:`رقصة بطيئة على أغنية لا يسمعها سواكما.`},{cat:`any`,tone:`Funny`,cast:`1 actor`,en:`A tough, fearless action hero who is absolutely terrified of one tiny bug.`,ar:`بطل حركة شجاع لا يخاف شيئًا، لكنه يرتعب من حشرة صغيرة واحدة.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`Two people finally saying the goodbye they never got the chance to say.`,ar:`شخصان يقولان أخيرًا الوداع الذي لم تُتَح لهما فرصة قوله.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A barista and a customer who insists their very ordinary coffee order is a state secret.`,ar:`نادل قهوة وزبون يصرّ على أن طلبه العادي جداً سرّ من أسرار الدولة.`},{cat:`any`,tone:`Absurd`,cast:`1 actor`,en:`A sock explaining, with great dignity, why it left its partner in the dryer.`,ar:`جورب يشرح بكل وقار لماذا ترك شريكه في النشّافة.`},{cat:`any`,tone:`Heartfelt`,cast:`2 actors`,en:`Two coworkers on their last day, realizing they became real friends without noticing.`,ar:`زميلا عمل في يومهما الأخير يكتشفان أنهما صارا صديقين حقيقيين دون أن ينتبها.`},{cat:`any`,tone:`Light`,cast:`1 actor`,en:`A self-checkout machine slowly losing patience with the entire human race.`,ar:`آلة دفع ذاتي تفقد صبرها ببطء مع الجنس البشري كلّه.`},{cat:`any`,tone:`Funny`,cast:`2 actors`,en:`A fortune teller whose predictions are all suspiciously, boringly accurate.`,ar:`عرّافة تنبّؤاتها كلها دقيقة بشكل مريب وممل.`},{cat:`any`,tone:`Heartfelt`,cast:`1 actor`,en:`Someone writing a letter to the version of themselves from five years ago.`,ar:`شخص يكتب رسالة إلى نفسه قبل خمس سنوات.`},{cat:`couple`,tone:`Funny`,cast:`2 actors`,en:`A couple assembling flat-pack furniture with only one, deeply unhelpful instruction sheet.`,ar:`ثنائي يركّبان أثاثاً جاهزاً بورقة تعليمات واحدة عديمة الفائدة تماماً.`},{cat:`couple`,tone:`Heartfelt`,cast:`2 actors`,en:`Two people deciding, on a quiet night, what their little home should feel like.`,ar:`شخصان يقرّران في ليلة هادئة كيف يريدان أن يشعر بيتهما الصغير.`},{cat:`couple`,tone:`Light`,cast:`2 actors`,en:`A pair planning a trip, wildly disagreeing on everything except that they want to go together.`,ar:`ثنائي يخطّطان لرحلة، يختلفان على كل شيء إلا أنهما يريدان الذهاب معاً.`},{cat:`group`,tone:`Funny`,cast:`3+ actors`,en:`A committee that has been meeting for three hours to name the office plant.`,ar:`لجنة تجتمع منذ ثلاث ساعات لتسمية نبتة المكتب.`},{cat:`group`,tone:`Absurd`,cast:`3+ actors`,en:`A family portrait photo shoot where nobody can agree which way is 'the camera.'`,ar:`جلسة تصوير عائلية ولا أحد يتّفق على أي اتجاه هو «الكاميرا».`},{cat:`group`,tone:`Heartfelt`,cast:`3+ actors`,en:`Old friends reuniting and each remembering the same night completely differently.`,ar:`أصدقاء قدامى يجتمعون ويتذكّر كلٌّ منهم الليلة نفسها بشكل مختلف تماماً.`}],scripts:[{no:`02`,cat:`any`,tone:`Funny`,cast:`2 actors`,titleEn:`The Haunted Toaster`,titleAr:`المحمّصة المسكونة`,setupEn:`A customer returns a toaster they swear is haunted. The clerk has seen it all and does not blink.`,setupAr:`زبون يُرجع محمّصة يُقسم أنها مسكونة. والبائع رأى كل شيء ولا يرفّ له جفن.`,lines:[{who:`Customer · الزبون`,en:`I need to return this. It's… it's haunted.`,ar:`أريد إرجاع هذه. إنها… إنها مسكونة.`},{who:`Clerk · البائع`,en:`(not looking up) Do you have the receipt?`,ar:`(دون أن يرفع نظره) هل معك الفاتورة؟`},{who:`Customer · الزبون`,en:`The receipt?? It burned toast into the shape of a screaming face. Twice.`,ar:`الفاتورة؟؟ لقد حرقت الخبز على شكل وجه يصرخ. مرتين.`},{who:`Clerk · البائع`,en:`That's the “artisan” setting. Very popular.`,ar:`هذا وضع «الحِرَفيّة». مطلوب جدًا.`},{who:`Customer · الزبون`,en:`It whispers my name at three in the morning!`,ar:`إنها تهمس باسمي الساعة الثالثة فجرًا!`},{who:`Clerk · البائع`,en:`The warranty doesn't cover whispering. Only screaming.`,ar:`الضمان لا يغطّي الهمس. الصراخ فقط.`},{who:`Customer · الزبون`,en:`…What kind of shop is this?`,ar:`…أيّ نوع من المحلّات هذا؟`},{who:`Clerk · البائع`,en:`The kind with a strict no-refund policy on the supernatural.`,ar:`النوع الذي لا يقبل إرجاع ما هو خارق للطبيعة.`}],outroEn:`Now improvise: the toaster does something — right now. What?`,outroAr:`الآن ارتجلا: تفعل المحمّصة شيئًا — الآن. ماذا؟`},{no:`04`,cat:`any`,tone:`Absurd`,cast:`2 actors`,titleEn:`Aliens Order Food`,titleAr:`كائنات فضائية تطلب الطعام`,setupEn:`An alien and a very patient waiter meet over their first-ever restaurant order.`,setupAr:`كائن فضائي ونادل شديد الصبر يلتقيان في أول طلب طعام على الإطلاق.`,lines:[{who:`Alien · الكائن`,en:`Greetings, Earth-servant. We shall consume… “the menu.”`,ar:`تحياتنا يا خادم الأرض. سنلتهم… «القائمة».`},{who:`Waiter · النادل`,en:`You'd like to order the whole menu?`,ar:`تريد أن تطلب القائمة كاملة؟`},{who:`Alien · الكائن`,en:`No. The paper. We eat the paper. It is our custom.`,ar:`لا. الورقة. نأكل الورقة. هذه عادتنا.`},{who:`Waiter · النادل`,en:`…Sir, that's the menu. The food is listed on it.`,ar:`…سيدي، هذه هي القائمة. الطعام مكتوب عليها.`},{who:`Alien · الكائن`,en:`There is food that is NOT paper?? Explain this “pizza.”`,ar:`يوجد طعام ليس ورقًا؟؟ اشرح لي هذه «البيتزا».`},{who:`Waiter · النادل`,en:`It's a circle. With cheese.`,ar:`إنها دائرة. مع جبنة.`},{who:`Alien · الكائن`,en:`A CIRCLE. (to companion) They have solved geometry AND hunger.`,ar:`دائـرة! (لرفيقه) لقد حلّوا الهندسة والجوع معًا.`},{who:`Waiter · النادل`,en:`Do you… want something to drink?`,ar:`هل… تريد مشروبًا؟`}],outroEn:`Improvise: the alien tastes water for the first time.`,outroAr:`ارتجلا: يتذوّق الكائن الماء لأول مرة.`},{no:`05`,cat:`any`,tone:`Funny`,cast:`1 actor`,titleEn:`Breaking News: A Light Drizzle`,titleAr:`عاجل: رذاذ مطر خفيف`,setupEn:`A solo monologue. Report a tiny drizzle as if it's the apocalypse.`,setupAr:`مونولوج فردي. انقل خبر رذاذ بسيط وكأنه نهاية العالم.`,lines:[{who:`Reporter · المذيع`,en:`(grave) Good evening. I'm live from the edge of catastrophe… my own front yard.`,ar:`(بجدّية) مساء الخير. أنقل مباشرةً من حافة الكارثة… باحة منزلي.`},{who:`Reporter · المذيع`,en:`Behind me, the unthinkable unfolds: (pause) a light drizzle.`,ar:`خلفي، يتكشّف ما لا يُصدَّق: (وقفة) رذاذ مطر خفيف.`},{who:`Reporter · المذيع`,en:`Yes. Water. Falling. From the sky itself.`,ar:`نعم. ماء. يسقط. من السماء نفسها.`},{who:`Reporter · المذيع`,en:`I have seen grown men… open umbrellas.`,ar:`لقد رأيت رجالًا… يفتحون مظلّاتهم.`},{who:`Reporter · المذيع`,en:`A single drop has touched my forehead. I may not survive this broadcast.`,ar:`لمست جبهتي قطرة واحدة. قد لا أنجو من هذا البثّ.`},{who:`Reporter · المذيع`,en:`Stay indoors. Hold your loved ones. And whatever you do — (whisper) don't forget your jacket.`,ar:`ابقوا في الداخل. عانقوا أحبّتكم. ومهما فعلتم — (همسًا) لا تنسوا معاطفكم.`}],outroEn:`Push it further: a leaf falls. How do you report it?`,outroAr:`زد الأمر: تسقط ورقة شجر. كيف تنقل الخبر؟`},{no:`03`,cat:`any`,tone:`Heartfelt`,cast:`2 actors`,titleEn:`Ten Years Later`,titleAr:`بعد عشر سنوات`,setupEn:`Two old friends run into each other by pure chance. Let the pauses breathe.`,setupAr:`صديقان قديمان يلتقيان مصادفةً. اتركا الصمت يتنفّس.`,lines:[{who:`A · أ`,en:`…No. No way. Is that you?`,ar:`…لا. مستحيل. هل هذا أنت؟`},{who:`B · ب`,en:`(slowly) I don't believe it. Ten years?`,ar:`(ببطء) لا أصدّق. عشر سنوات؟`},{who:`A · أ`,en:`Eleven, actually. You look… exactly the same. Somehow.`,ar:`إحدى عشرة، في الحقيقة. تبدو… كما أنت تمامًا. بطريقةٍ ما.`},{who:`B · ب`,en:`You're lying, but I'll take it. God, we were kids.`,ar:`أنت تكذب، لكنني سأقبلها. يا إلهي، كنّا صغارًا.`},{who:`A · أ`,en:`Do you still—? Never mind. It's silly.`,ar:`هل ما زلت—؟ انسَ الأمر. إنه سخيف.`},{who:`B · ب`,en:`No. Say it.`,ar:`لا. قلها.`},{who:`A · أ`,en:`Do you still keep that photo of us? The blurry one?`,ar:`هل ما زلت تحتفظ بصورتنا؟ تلك المشوّشة؟`},{who:`B · ب`,en:`(quietly) It's in my wallet. Right now.`,ar:`(بهدوء) إنها في محفظتي. الآن.`}],outroEn:`Sit with it. What do you say next?`,outroAr:`اتركا اللحظة تمتدّ. ماذا تقولان بعدها؟`},{no:`33`,cat:`group`,tone:`Funny`,cast:`3+ actors`,titleEn:`The Game Show That Forgot Its Rules`,titleAr:`المسابقة التي نسيت قواعدها`,setupEn:`One host, two or more contestants. The host is confidently, cheerfully lost.`,setupAr:`مقدّم واحد، ومتسابقان أو أكثر. المقدّم تائه بثقة وبهجة.`,lines:[{who:`Host · المقدّم`,en:`WELCOME back to… the show! First contestant — tell us your name!`,ar:`أهلًا بعودتكم إلى… البرنامج! أول متسابق — أخبرنا باسمك!`},{who:`Contestant 1 · المتسابق ١`,en:`It's me. I was here last round—`,ar:`أنا. كنت هنا في الجولة السابقة—`},{who:`Host · المقدّم`,en:`WRONG. Or… right? What are the rules again?`,ar:`خطأ. أو… صحيح؟ ما القواعد أصلًا؟`},{who:`Contestant 2 · المتسابق ٢`,en:`You never told us the rules!`,ar:`لم تخبرنا بالقواعد أبدًا!`},{who:`Host · المقدّم`,en:`Exactly! THAT is the rule! Ten points!`,ar:`بالضبط! هذه هي القاعدة! عشر نقاط!`},{who:`Contestant 1 · المتسابق ١`,en:`For what?!`,ar:`مقابل ماذا؟!`},{who:`Host · المقدّم`,en:`For believing. Buzz in if you agree!`,ar:`مقابل التصديق. اضغطوا الجرس إن وافقتم!`},{who:`Host · المقدّم`,en:`A tie! To break it — everyone, interpretive dance. NOW.`,ar:`تعادل! لحسمه — الجميع، رقصة تعبيرية. الآن.`}],outroEn:`Improvise the tiebreaker round together.`,outroAr:`ارتجلوا جولة كسر التعادل معًا.`},{no:`46`,cat:`couple`,tone:`Flirty`,cast:`2 actors`,titleEn:`Two Spies, One Party`,titleAr:`جاسوسان في حفلة واحدة`,setupEn:`You know each other. You must pretend you don't. Play it cool.`,setupAr:`تعرفان بعضكما. عليكما التظاهر بالعكس. حافظا على برودة الأعصاب.`,lines:[{who:`A · أ`,en:`(sliding over) You look lost. Or exactly where you mean to be?`,ar:`(يقترب) تبدين تائهة. أم أنك تمامًا حيث تنوين؟`},{who:`B · ب`,en:`I never get lost. I get… redirected.`,ar:`أنا لا أتوه أبدًا. أنا فقط… يُعاد توجيهي.`},{who:`A · أ`,en:`Interesting. And that watch — Swiss?`,ar:`مثير للاهتمام. وتلك الساعة — سويسرية؟`},{who:`B · ب`,en:`A gift. From someone who no longer knows my real name.`,ar:`هدية. ممّن لم يعد يعرف اسمي الحقيقي.`},{who:`A · أ`,en:`(leaning in) And what is your real name?`,ar:`(يقترب أكثر) وما اسمك الحقيقي؟`},{who:`B · ب`,en:`(smiling) You'll have to earn that. Dance with me — it's good cover.`,ar:`(مبتسمة) عليك أن تستحقّه. ارقص معي — إنه غطاء جيّد.`},{who:`A · أ`,en:`For the mission?`,ar:`من أجل المهمة؟`},{who:`B · ب`,en:`Sure. The mission.`,ar:`بالتأكيد. المهمة.`}],outroEn:`Dance and keep trading secrets — real or invented.`,outroAr:`ارقصا وواصلا تبادل الأسرار — حقيقية أو مختلَقة.`},{no:`44`,cat:`couple`,tone:`Romantic`,cast:`2 actors`,titleEn:`Thirty Years From Now`,titleAr:`بعد ثلاثين عامًا`,setupEn:`You meet again as strangers, decades in the future. Slow and tender.`,setupAr:`تلتقيان من جديد كغريبين، بعد عقود في المستقبل. ببطء وحنان.`,lines:[{who:`A · أ`,en:`Excuse me — is this seat taken?`,ar:`عذرًا — هل هذا المقعد محجوز؟`},{who:`B · ب`,en:`(looks up, pauses) …Have we met? You seem so familiar.`,ar:`(يرفع نظره، يتوقّف) …هل التقينا من قبل؟ تبدو مألوفًا جدًا.`},{who:`A · أ`,en:`I get that a lot. Maybe in another life.`,ar:`يقولون لي ذلك كثيرًا. ربما في حياة أخرى.`},{who:`B · ب`,en:`I lost someone, years ago. You have his eyes.`,ar:`فقدت شخصًا، منذ سنوات. عيناك تشبهان عينيه.`},{who:`A · أ`,en:`Tell me about him.`,ar:`أخبريني عنه.`},{who:`B · ب`,en:`He was terrible at directions. Wonderful at everything else.`,ar:`كان سيّئًا جدًا في الاتجاهات. رائعًا في كل شيء آخر.`},{who:`A · أ`,en:`(softly) He sounds lucky — to be remembered like that.`,ar:`(بهدوء) يبدو محظوظًا — أن يُذكَر هكذا.`}],outroEn:`Do they recognize each other? You decide.`,outroAr:`هل يتعرّف كلٌّ منهما على الآخر؟ القرار لكما.`},{no:`21`,cat:`any`,tone:`Absurd`,cast:`2 actors`,titleEn:`Two Socks in a Dryer`,titleAr:`جوربان في النشّافة`,setupEn:`It's hot in here, and one sock has gone missing. High stakes. Full drama.`,setupAr:`الجو حارّ هنا، وقد اختفى جورب. المخاطر عالية. دراما كاملة.`,lines:[{who:`Sock A · الجورب أ`,en:`It's warm in here. Too warm. Where's your brother?`,ar:`الجو حارّ هنا. حارّ جدًا. أين أخوك؟`},{who:`Sock B · الجورب ب`,en:`(panicking) He was beside me a second ago! LEFT SOCK! LEEEFT!`,ar:`(بذعر) كان بجانبي قبل لحظة! أيها الجورب الأيسر! يساااار!`},{who:`Sock A · الجورب أ`,en:`They never come back from the spin cycle. You know that.`,ar:`لا أحد يعود من دورة العصر. تعرف ذلك.`},{who:`Sock B · الجورب ب`,en:`There has to be another world. A better place. Behind the machine.`,ar:`لا بدّ من عالم آخر. مكان أفضل. خلف الغسّالة.`},{who:`Sock A · الجورب أ`,en:`That's just a myth we tell the new socks.`,ar:`تلك مجرّد أسطورة نرويها للجوارب الجديدة.`},{who:`Sock B · الجورب ب`,en:`(dramatic) Then I'll find it. For him. For all the lost socks.`,ar:`(بدراما) إذًا سأجده. من أجله. من أجل كل الجوارب الضائعة.`},{who:`Sock A · الجورب أ`,en:`You're a sock. You have no legs.`,ar:`أنت جورب. ليس لديك ساقان.`},{who:`Sock B · الجورب ب`,en:`…Details.`,ar:`…تفاصيل.`}],outroEn:`The dryer buzzes. What happens?`,outroAr:`تُصدر النشّافة صوتها. ماذا يحدث؟`},{no:`49`,cat:`any`,tone:`Funny`,cast:`2 actors`,titleEn:`The Haircut You Didn't Ask For`,titleAr:`القصّة التي لم تطلبها`,setupEn:`A client wants a small trim. The barber has other, bigger plans.`,setupAr:`زبون يريد تهذيبًا بسيطًا. لكن للحلّاق خططًا أخرى أكبر.`,lines:[{who:`Client · الزبون`,en:`Just a trim, please. Nothing dramatic.`,ar:`تهذيب بسيط فقط، من فضلك. لا شيء درامي.`},{who:`Barber · الحلّاق`,en:`(already cutting) Say no more. I know EXACTLY what you need.`,ar:`(يقصّ فعلًا) لا تُكمل. أعرف تمامًا ما تحتاجه.`},{who:`Client · الزبون`,en:`Wait — that was a lot of hair. That felt like a LOT of hair.`,ar:`مهلًا — كان ذلك كثيرًا من الشعر. شعرت أنه كثير جدًا.`},{who:`Barber · الحلّاق`,en:`Trust the process. You'll look like a whole new person.`,ar:`ثق بالعملية. ستبدو شخصًا جديدًا تمامًا.`},{who:`Client · الزبون`,en:`I liked the old person! Can we go back to him?`,ar:`كنت أحبّ الشخص القديم! هل يمكننا العودة إليه؟`},{who:`Barber · الحلّاق`,en:`(spinning the chair) And… voilà. A masterpiece.`,ar:`(يدير الكرسي) و… ها هو. تحفة فنية.`},{who:`Client · الزبون`,en:`(staring in the mirror) …Why is one side longer?`,ar:`(يحدّق في المرآة) …لماذا أحد الجانبين أطول؟`},{who:`Barber · الحلّاق`,en:`That's the style. It's called “asymmetry.” Very Paris.`,ar:`هذا هو الطراز. يُسمّى «اللاتناظر». باريسيّ جدًا.`}],outroEn:`Improvise: the client tries to escape the chair.`,outroAr:`ارتجلا: يحاول الزبون الهرب من الكرسي.`},{no:`54`,cat:`any`,tone:`Absurd`,cast:`2 actors`,titleEn:`A Peace Treaty Over Tea`,titleAr:`معاهدة سلام على الشاي`,setupEn:`A nervous knight and a surprisingly civilized dragon sit down to negotiate.`,setupAr:`فارس متوتّر وتنّين متحضّر بشكل مفاجئ يجلسان للتفاوض.`,lines:[{who:`Knight · الفارس`,en:`I come in peace, mighty dragon. Also — please don't eat me.`,ar:`أتيت مسالمًا أيها التنّين العظيم. وأيضًا — أرجوك، لا تأكلني.`},{who:`Dragon · التنّين`,en:`(sipping tea) I only eat knights who forget the sugar. Did you bring sugar?`,ar:`(يرتشف الشاي) لا آكل إلا الفرسان الذين ينسون السكّر. هل أحضرت سكّرًا؟`},{who:`Knight · الفارس`,en:`I… brought a scroll. A peace treaty.`,ar:`أحضرت… لفافة. معاهدة سلام.`},{who:`Dragon · التنّين`,en:`A treaty. How quaint. What are your terms?`,ar:`معاهدة. كم هذا طريف. ما شروطك؟`},{who:`Knight · الفارس`,en:`You stop burning the village. We stop sending knights to annoy you.`,ar:`تتوقّف عن حرق القرية. ونتوقّف عن إرسال الفرسان لإزعاجك.`},{who:`Dragon · التنّين`,en:`Tempting. But the burning is how I keep warm.`,ar:`مغرٍ. لكن الحرق هو ما يبقيني دافئًا.`},{who:`Knight · الفارس`,en:`…We could get you a very large blanket?`,ar:`…يمكننا أن نحضر لك بطانية كبيرة جدًا؟`},{who:`Dragon · التنّين`,en:`(long pause) …I'm listening.`,ar:`(وقفة طويلة) …أنا أنصت.`}],outroEn:`Improvise: negotiate the rest of the treaty.`,outroAr:`ارتجلا: تفاوضا على بقية المعاهدة.`},{no:`51`,cat:`any`,tone:`Heartfelt`,cast:`2 actors`,titleEn:`You Changed My Life`,titleAr:`أنت غيّرت حياتي`,setupEn:`A teacher and a grown-up former student meet again by chance.`,setupAr:`معلّم وطالب قديم صار راشدًا يلتقيان صدفةً من جديد.`,lines:[{who:`Student · الطالب`,en:`Sir — do you remember me? You taught me, years ago.`,ar:`أستاذ — هل تذكرني؟ درّستني، منذ سنوات.`},{who:`Teacher · المعلّم`,en:`(studying the face) …Give me a second. That smile — the back row?`,ar:`(يتأمّل الوجه) …أمهلني لحظة. تلك الابتسامة — الصفّ الخلفي؟`},{who:`Student · الطالب`,en:`Always the back row. I wasn't an easy student.`,ar:`دائمًا الصفّ الخلفي. لم أكن طالبًا سهلًا.`},{who:`Teacher · المعلّم`,en:`No. But you asked the best questions. What are you doing now?`,ar:`لا. لكنك كنت تطرح أفضل الأسئلة. ماذا تعمل الآن؟`},{who:`Student · الطالب`,en:`I teach. Because of you. You told me I mattered when no one else did.`,ar:`أُعلّم. بسببك. قلت لي إنني مهمّ حين لم يقل أحد ذلك.`},{who:`Teacher · المعلّم`,en:`(quietly) …I didn't know that landed.`,ar:`(بهدوء) …لم أكن أعرف أن ذلك تركَ أثرًا.`},{who:`Student · الطالب`,en:`It landed. It's still landing.`,ar:`ترك أثرًا. وما زال.`}],outroEn:`Sit in the moment. What does the teacher say?`,outroAr:`اتركا اللحظة تمتدّ. ماذا يقول المعلّم؟`},{no:`59`,cat:`group`,tone:`Funny`,cast:`3+ actors`,titleEn:`Carrying the Invisible Thing`,titleAr:`حمل الشيء غير المرئي`,setupEn:`A group hauls a huge, invisible object upstairs. Everyone must agree on its shape as they go.`,setupAr:`مجموعة تحمل شيئًا ضخمًا غير مرئي إلى الأعلى. على الجميع الاتفاق على شكله أثناء ذلك.`,lines:[{who:`A · أ`,en:`Okay, everybody grab a corner. It's heavier than it looks.`,ar:`حسنًا، ليمسك كلٌّ منكم زاوية. إنه أثقل ممّا يبدو.`},{who:`B · ب`,en:`What… exactly are we carrying?`,ar:`ما الذي… نحمله بالضبط؟`},{who:`A · أ`,en:`Don't ask questions. Lift with your knees! KNEES!`,ar:`لا تسأل. ارفعوا بركبكم! الرُّكب!`},{who:`C · ج`,en:`It's slipping! It's slipping on my side!`,ar:`إنه ينزلق! ينزلق من جهتي!`},{who:`A · أ`,en:`Do NOT drop it. Do you know how much this costs?`,ar:`إياكم أن تُسقطوه. هل تعرفون كم يكلّف هذا؟`},{who:`B · ب`,en:`I genuinely don't. I can't even see it.`,ar:`صدقًا لا أعرف. لا أستطيع حتى رؤيته.`},{who:`C · ج`,en:`(straining) Left! Turn it left for the stairs!`,ar:`(بجهد) يسار! أديروه يسارًا عند الدرج!`},{who:`A · أ`,en:`(panicking) Mind the corner — THE CORNER —`,ar:`(بذعر) انتبهوا للزاوية — الزاوية —`}],outroEn:`Improvise: it gets stuck. How do you free it?`,outroAr:`ارتجلوا: يعلَق. كيف تحرّرونه؟`},{no:`65`,cat:`couple`,tone:`Funny`,cast:`2 actors`,titleEn:`The Quietest Fight`,titleAr:`أهدأ شجار`,setupEn:`A couple argues in furious whispers, desperate not to wake the sleeping baby.`,setupAr:`ثنائي يتشاجران بهمسات غاضبة، يائسَين ألّا يوقظا الرضيع النائم.`,lines:[{who:`A · أ`,en:`(whisper-yelling) I told you to buy diapers!`,ar:`(تصرخ همسًا) قلت لك أن تشتري الحفّاضات!`},{who:`B · ب`,en:`(whisper-yelling) You said milk! You clearly said milk!`,ar:`(يصرخ همسًا) قلتِ حليب! قلتِ حليب بوضوح!`},{who:`A · أ`,en:`Shh — shh — you'll wake her!`,ar:`صهْ — صهْ — ستوقظها!`},{who:`B · ب`,en:`I AM whispering! This is the quietest fight of my life!`,ar:`أنا أهمس فعلًا! هذه أهدأ معركة في حياتي!`},{who:`A · أ`,en:`(freezing) …Did she move? She moved.`,ar:`(تتجمّد) …هل تحرّكت؟ لقد تحرّكت.`},{who:`B · ب`,en:`(freezing) …Nobody breathe.`,ar:`(يتجمّد) …لا أحد يتنفّس.`},{who:`A · أ`,en:`(after a beat) …We are never sleeping again, are we?`,ar:`(بعد لحظة) …لن ننام مجددًا أبدًا، أليس كذلك؟`},{who:`B · ب`,en:`(whisper) …No. No, we are not.`,ar:`(همسًا) …لا. لن ننام.`}],outroEn:`Improvise: the baby wakes anyway. Go.`,outroAr:`ارتجلا: يستيقظ الرضيع رغم ذلك. ابدآ.`},{no:`66`,cat:`couple`,tone:`Romantic`,cast:`2 actors`,titleEn:`Vows, No Preparation`,titleAr:`عهود بلا تحضير`,setupEn:`Say your wedding vows on the spot — no notes, just what you feel right now.`,setupAr:`قولا عهود زواجكما ارتجالًا — بلا أوراق، فقط ما تشعران به الآن.`,lines:[{who:`A · أ`,en:`I didn't write anything down. I thought I'd know what to say when I looked at you.`,ar:`لم أكتب شيئًا. ظننت أنني سأعرف ما أقول حين أنظر إليك.`},{who:`B · ب`,en:`And do you?`,ar:`وهل تعرف؟`},{who:`A · أ`,en:`I do. You make the ordinary days feel like the good ones.`,ar:`أعرف. أنت تجعلين الأيام العادية تبدو كأجملها.`},{who:`B · ب`,en:`(softly) My turn. I'm not good with words —`,ar:`(بهدوء) دوري. لست بارعة بالكلمات —`},{who:`A · أ`,en:`You don't have to be.`,ar:`لست مضطرّة أن تكوني.`},{who:`B · ب`,en:`Then just this: wherever you are, that's the place I want to be.`,ar:`إذًا فقط هذا: أينما كنت، فذلك المكان الذي أريد أن أكون فيه.`},{who:`A · أ`,en:`(barely) …Okay. Now I'm the one who can't talk.`,ar:`(بالكاد) …حسنًا. الآن أنا مَن لا يستطيع الكلام.`}],outroEn:`Finish the vows in your own words.`,outroAr:`أكملا العهود بكلماتكما.`},{no:`71`,cat:`any`,tone:`Funny`,cast:`1 actor`,titleEn:`The Hero and the Bug`,titleAr:`البطل والحشرة`,setupEn:`A solo scene. A fearless action hero faces their one true enemy: a tiny bug.`,setupAr:`مشهد فردي. بطل حركة لا يخاف شيئًا يواجه عدوّه الوحيد: حشرة صغيرة.`,lines:[{who:`Hero · البطل`,en:`They said I feared nothing. They were wrong. (points, trembling) There. On the wall.`,ar:`قالوا إنني لا أخشى شيئًا. كانوا مخطئين. (يشير، مرتجفًا) هناك. على الجدار.`},{who:`Hero · البطل`,en:`It has… eight legs. Or six. I won't get close enough to count.`,ar:`لديها… ثماني أرجل. أو ستّ. لن أقترب بما يكفي لأعدّها.`},{who:`Hero · البطل`,en:`I've faced armies. Explosions. A very rude landlord. But THIS?`,ar:`واجهتُ جيوشًا. انفجارات. ومالك عقار وقحًا جدًا. لكن هذه؟`},{who:`Hero · البطل`,en:`(grabbing a shoe like a sword) Steady. Steady. We do this together, old friend.`,ar:`(يمسك حذاءً كالسيف) بثبات. بثبات. سنفعلها معًا يا صديقي القديم.`},{who:`Hero · البطل`,en:`It moved. IT MOVED. That is NOT allowed.`,ar:`لقد تحرّكت. لقد تحرّكت. هذا غير مسموح.`},{who:`Hero · البطل`,en:`(whisper) If I don't make it… tell my mother I was brave. Mostly.`,ar:`(همسًا) إن لم أنجُ… أخبروا أمي أنني كنت شجاعًا. في الغالب.`}],outroEn:`Improvise the final showdown.`,outroAr:`ارتجل المواجهة الأخيرة.`},{no:`72`,cat:`any`,tone:`Heartfelt`,cast:`2 actors`,titleEn:`The Goodbye You Never Said`,titleAr:`الوداع الذي لم يُقَل`,setupEn:`Two people finally speak the farewell they never got to say. Slow. Honest.`,setupAr:`شخصان يقولان أخيرًا الوداع الذي لم يُتَح لهما قوله. ببطء. وبصدق.`,lines:[{who:`A · أ`,en:`I used to practice this in my head. What I'd say if I ever saw you again.`,ar:`كنت أتدرّب على هذا في رأسي. ما سأقوله إن رأيتك يومًا من جديد.`},{who:`B · ب`,en:`And?`,ar:`و؟`},{who:`A · أ`,en:`And now you're here, and all of it's gone.`,ar:`والآن أنت هنا، وكل ذلك تبخّر.`},{who:`B · ب`,en:`You don't need the speech. Just say the true part.`,ar:`لست بحاجة للخطبة. قل الجزء الصادق فقط.`},{who:`A · أ`,en:`The true part is… I never got to say goodbye. So I carried it. For years.`,ar:`الجزء الصادق هو… لم يُتَح لي أن أودّعك. فحملت ذلك. لسنوات.`},{who:`B · ب`,en:`Then say it now. I'm here. I'm listening.`,ar:`إذًا قله الآن. أنا هنا. أنا أنصت.`},{who:`A · أ`,en:`(breath) …Goodbye. And thank you. For all of it.`,ar:`(نفَس) …وداعًا. وشكرًا. على كل شيء.`}],outroEn:`Let the moment land. What comes after goodbye?`,outroAr:`اتركا اللحظة تستقرّ. ماذا يأتي بعد الوداع؟`}],games:[{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`conversation`,en:{name:`Two Truths and a Lie`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Each person, in turn, says three statements about themselves — two true, one made up. Everyone else debates and guesses which one is the lie. The trick is making your truths sound unbelievable and your lie sound ordinary. Great for getting to know new people or surprising old friends.`},ar:{name:`حقيقتان وكذبة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يقول كل شخص بدوره ثلاث عبارات عن نفسه: اثنتان صحيحتان وواحدة مختلقة. على البقية أن يتناقشوا ويخمّنوا أيّها الكذبة. الحيلة أن تجعل حقائقك تبدو غير معقولة وكذبتك تبدو عادية. لعبة رائعة للتعرّف على الآخرين أو لمفاجأة الأصدقاء القدامى.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`guessing`,en:{name:`20 Questions`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One person secretly thinks of a person, place, or object. Everyone else has twenty yes-or-no questions to narrow it down and guess what it is. Smart players start wide ("Is it alive?") before zeroing in. Guess it in time and the guessers win; stump them and the thinker does.`},ar:{name:`عشرون سؤالًا`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يفكّر شخص سرًّا في إنسان أو مكان أو شيء. على البقية طرح عشرين سؤالًا إجابتها بنعم أو لا لتضييق الاحتمالات والتخمين. الأذكياء يبدؤون بأسئلة واسعة («هل هو كائن حيّ؟») ثم يقتربون. من يخمّن ضمن العدد يفوز، ومن يعجز يفوز صاحب السرّ.`}},{tags:[`two`,`small`,`nosupplies`],meter:1,cat:`conversation`,en:{name:`The Question Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing — a written list of prompts is optional.`,how:`Take turns asking each other one honest question, from light to deep. Anything goes as long as both people agree to answer truthfully. It's a favourite for couples and close friends because it turns curiosity into a whole evening. Pass if a question is too much — no penalty.`},ar:{name:`لعبة الأسئلة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء — وقائمة أسئلة مكتوبة اختيارية.`,how:`تبادلوا الأسئلة الصادقة، من الخفيف إلى العميق. كل شيء مسموح ما دام الطرفان متّفقين على الإجابة بصدق. مفضّلة للأزواج والأصدقاء المقرّبين لأنها تحوّل الفضول إلى أمسية كاملة. تجاوز أي سؤال ثقيل بلا عقوبة.`}},{tags:[`small`,`big`],meter:2,cat:`guessing`,en:{name:`Who Am I?`,players:`3+ players`,needs:`<b>You need:</b> Sticky notes and a pen.`,how:`Write a famous name (real or fictional) on a sticky note and press it to someone's forehead without letting them see it. Everyone wears one. On your turn you ask the group yes-or-no questions — "Am I alive? Am I an athlete?" — until you work out who you are. First to guess their own name wins.`},ar:{name:`من أنا؟`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> أوراق لاصقة وقلم.`,how:`اكتب اسم شخصية مشهورة (حقيقية أو خيالية) على ورقة لاصقة وألصقها على جبين لاعب دون أن يراها. الجميع يرتدي واحدة. في دورك تسأل المجموعة أسئلة بنعم أو لا — «هل أنا حيّ؟ هل أنا رياضي؟» — حتى تعرف من أنت. أول من يخمّن اسمه يفوز.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`word`,en:{name:`Categories`,players:`3+ players`,needs:`<b>You need:</b> Nothing — clap out a rhythm to keep the pace.`,how:`Pick a category — say, fruits — and a starting letter. Going around the circle in rhythm, each person names something in that category that hasn't been said. Hesitate, repeat, or blank out and you're eliminated. Last one standing wins the round, then choose a new category.`},ar:{name:`الفئات`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء — صفّقوا بإيقاع للحفاظ على السرعة.`,how:`اختاروا فئة — مثلًا الفواكه — وحرفًا للبداية. بالتناوب على الإيقاع، يذكر كل شخص عنصرًا من الفئة لم يُقَل بعد. من يتردّد أو يكرّر أو ينسى يخرج. آخر من يبقى يفوز بالجولة، ثم اختاروا فئة جديدة.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`word`,en:{name:`Telephone`,players:`4+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Sit in a line or circle. The first person whispers a sentence once to the next, who whispers what they heard to the next, and so on. No repeats allowed. The last person says it out loud — comparing the mangled result to the original is the whole joy of it.`},ar:{name:`الهاتف (الأُذُن الطائشة)`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`اجلسوا في صفّ أو دائرة. يهمس الأول جملةً مرة واحدة للتالي، الذي يهمس ما سمعه للذي يليه، وهكذا. لا تكرار. يقول الأخير الجملة بصوت عالٍ — ومقارنة النتيجة المشوّهة بالأصل هي كل المتعة.`}},{tags:[`small`,`big`],meter:2,cat:`paper`,en:{name:`Consequences`,players:`3+ players`,needs:`<b>You need:</b> A sheet of paper and pen for each player.`,how:`Everyone writes the first line of a story on their paper, folds it to hide it, and passes it on. Round by round you each add the next part — a character, a place, some dialogue, what happened next — always folding and passing so no one sees the whole thing. Unfold the papers at the end and read the absurd tales aloud.`},ar:{name:`العواقب`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> ورقة وقلم لكل لاعب.`,how:`يكتب كلٌّ سطرًا أول من قصة على ورقته، يطويها ليخفيها، ثم يمرّرها. جولة بعد جولة يضيف كلٌّ الجزء التالي — شخصية، مكان، حوار، ماذا حدث بعد ذلك — مع الطيّ والتمرير دائمًا حتى لا يرى أحد كل شيء. افتحوا الأوراق في النهاية واقرؤوا الحكايات العبثية بصوت عالٍ.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`guessing`,en:{name:`The Secret Wink`,players:`5+ players`,needs:`<b>You need:</b> A way to secretly pick one "murderer" (drawn slips work).`,how:`Secretly assign one player as the secret winker. Everyone mingles or sits in a circle making eye contact; the secret winker "tag outs" people by discreetly winking at them, and a winked player dramatically pretends to die moments later. One detective tries to spot the winker before too many fall. Catch the culprit to win.`},ar:{name:`الغمزة السرّية`,players:`5 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> وسيلة لاختيار «قاتل» واحد سرًّا (قصاصات مسحوبة تفي بالغرض).`,how:`عيّنوا لاعبًا واحدًا قاتلًا سرًّا. يتبادل الجميع النظرات في دائرة، ويُخرج صاحب الغمزة ضحاياه بغمزة خفية، ومن غُمِز يتظاهر بالموت بعد لحظات بطريقة مسرحية. يحاول محقّق واحد كشف الغامز قبل سقوط الكثيرين. اكشف الجاني لتفوز.`}},{tags:[`big`],meter:3,cat:`guessing`,en:{name:`Mafia / Werewolf`,players:`6+ players (best 8+)`,needs:`<b>You need:</b> Cards or slips to assign hidden roles, plus a moderator.`,how:`Players are secretly split into a hidden group of villains and an unsuspecting town. Each "night" the villains silently pick someone to eliminate; each "day" everyone debates who's suspicious and votes to remove one person. Town wins by rooting out all the villains; the villains win by outnumbering the town. It's a game of bluffing, reading faces, and accusing your friends.`},ar:{name:`المافيا / المستذئبون`,players:`6 لاعبين فأكثر (الأفضل 8)`,needs:`<b>تحتاج إلى:</b> بطاقات أو قصاصات لتوزيع الأدوار السرّية، ومنسّق للّعبة.`,how:`يُقسَّم اللاعبون سرًّا إلى مجموعة أشرار خفيّة وأهل بلدة لا يشكّون بشيء. كل «ليل» يختار الأشرار بصمت من يُقصونه، وكل «نهار» يتناقش الجميع في المشبوهين ويصوّتون لإخراج شخص. تفوز البلدة باستئصال كل الأشرار، ويفوز الأشرار حين يتساوى عددهم مع البلدة. لعبة خداع وقراءة وجوه واتهام أصدقائك.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`active`,en:{name:`Sardines`,players:`4+ players`,needs:`<b>You need:</b> A house or roomy space to hide in.`,how:`Hide-and-seek in reverse. One person hides while everyone else counts, then all the seekers search separately. When you find the hider, you quietly squeeze into the hiding spot with them instead of announcing it. The group slowly piles in like sardines until the last person left searching loses — and hides next.`},ar:{name:`السردين`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> منزل أو مساحة واسعة للاختباء.`,how:`استغماية معكوسة: يختبئ شخص واحد بينما يعدّ الباقون، ثم يبحث الجميع كلٌّ على حدة. حين تجد المختبئ، تنسلّ بهدوء إلى مخبئه بدل أن تعلن. تتكدّس المجموعة كالسردين شيئًا فشيئًا حتى يخسر آخر من يبقى يبحث — ويختبئ في الجولة التالية.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Musical Chairs`,players:`4+ players`,needs:`<b>You need:</b> Chairs (one fewer than players) and music.`,how:`Set chairs in a circle facing out, one short of the number of players. Play music while everyone walks around them; the moment it stops, everyone scrambles for a seat. Whoever's left standing is out. Remove one chair each round until two players fight over the final seat.`},ar:{name:`الكراسي الموسيقية`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> كراسٍ (أقل بواحد من عدد اللاعبين) وموسيقى.`,how:`رتّبوا الكراسي في دائرة تتّجه للخارج، أقل بكرسيّ من عدد اللاعبين. شغّلوا الموسيقى والجميع يدور حولها؛ وحين تتوقّف يتسابق الكل على مقعد. من يبقى واقفًا يخرج. أزيلوا كرسيًّا كل جولة حتى يتنافس لاعبان على المقعد الأخير.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Freeze Dance`,players:`3+ players`,needs:`<b>You need:</b> Music and someone to control it.`,how:`Everyone dances while the music plays and freezes instantly when it stops. Anyone caught still moving after the music cuts is out. The person on music duty should stop it at sneaky, unexpected moments. Last dancer frozen the cleanest wins.`},ar:{name:`رقصة التجمّد`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> موسيقى وشخص يتحكّم بها.`,how:`يرقص الجميع ما دامت الموسيقى تعزف، ويتجمّدون فورًا حين تتوقّف. من يُضبَط متحرّكًا بعد توقّف الموسيقى يخرج. على المتحكّم أن يوقفها في لحظات ماكرة غير متوقّعة. آخر راقص يتجمّد بإتقان يفوز.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`active`,en:{name:`Simon Says`,players:`3+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One person is "Simon" and calls out actions. Players only obey a command if it begins with "Simon says" — if Simon just says "touch your nose" and you do it, you're out. Simon tries to trick everyone with a fast mix of real and fake commands. Last player still in becomes the next Simon.`},ar:{name:`سايمون يقول`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يكون شخص هو «سايمون» ويطلق الأوامر. لا ينفّذ اللاعبون الأمر إلا إذا بدأ بعبارة «سايمون يقول» — فإن قال سايمون «المس أنفك» فقط وفعلتها، خرجت. يحاول سايمون خداع الجميع بمزيج سريع من الأوامر الحقيقية والزائفة. آخر لاعب يبقى يصبح سايمون التالي.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Hot Potato`,players:`4+ players`,needs:`<b>You need:</b> A soft object to pass and some music.`,how:`Sit in a circle and pass an object — the "hot potato" — from hand to hand as fast as you can while music plays. Whoever's holding it when the music suddenly stops is out. Keep going, dropping one player each round, until a single winner remains.`},ar:{name:`البطاطا الساخنة`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> غرض ليّن للتمرير، وبعض الموسيقى.`,how:`اجلسوا في دائرة ومرّروا غرضًا — «البطاطا الساخنة» — من يد إلى يد بأسرع ما يمكن ما دامت الموسيقى تعزف. من يمسكه حين تتوقّف الموسيقى فجأة يخرج. واصلوا وإسقاط لاعب كل جولة حتى يبقى فائز واحد.`}},{tags:[`small`,`big`],meter:2,cat:`cards`,en:{name:`Spoons`,players:`3+ players`,needs:`<b>You need:</b> A deck of cards and spoons (one fewer than players).`,how:`Place spoons in the middle, one short of the number of players. Everyone tries to collect four matching cards by rapidly passing cards around the table. The instant someone gets four of a kind they grab a spoon — and everyone else dives for the rest. The one left without a spoon takes a letter (S-P-O-O-N); spell the whole word and you're out.`},ar:{name:`الملاعق`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب وملاعق (أقل بواحدة من عدد اللاعبين).`,how:`ضعوا الملاعق في الوسط، أقل بواحدة من عدد اللاعبين. يحاول الجميع جمع أربع ورقات متطابقة بتمرير الورق حول الطاولة بسرعة. لحظة أن يجمع أحدهم أربعًا متطابقة يخطف ملعقة — ويندفع الباقون لالتقاط البقية. من يبقى بلا ملعقة يأخذ حرفًا من كلمة «ملعقة»؛ من يكمل الكلمة يخرج.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`active`,en:{name:`Rock, Paper, Scissors Tournament`,players:`2+ players`,needs:`<b>You need:</b> Nothing but your hands.`,how:`The schoolyard classic scaled up. Pair off and play best-of-three; winners advance and losers become loud cheerleaders for whoever beat them, forming a growing entourage. Keep bracketing until two finalists face off in front of the whole crowd. Instant, chaotic, and weirdly thrilling.`},ar:{name:`بطولة حجر ورقة مقص`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى يديك.`,how:`الكلاسيكية المدرسية على نطاق أوسع. تبارَوا ثنائيًّا بأفضل ثلاث جولات؛ الفائزون يتقدّمون والخاسرون يتحوّلون إلى مشجّعين صاخبين لمن هزمهم، فتكبر حاشية كل فائز. واصلوا حتى يتواجه متأهّلان أمام الجمهور كله. فورية وفوضوية ومثيرة على نحو غريب.`}},{tags:[`big`],meter:3,cat:`acting`,en:{name:`Celebrity (The Hat Game)`,players:`6+ (two teams)`,needs:`<b>You need:</b> Slips of paper, a bowl or hat, a timer.`,how:`Everyone writes several famous names on slips and folds them into a bowl. The game runs in three rounds using the same names each time: round one you describe the name with any words except the name itself; round two you get only one word; round three you act it out silently. Teams take turns pulling slips against the clock, and remembering names from earlier rounds is the secret to winning.`},ar:{name:`المشاهير (لعبة القبعة)`,players:`6 لاعبين فأكثر (فريقان)`,needs:`<b>تحتاج إلى:</b> قصاصات ورق، ووعاء أو قبعة، ومؤقّت.`,how:`يكتب الجميع عدة أسماء مشاهير على قصاصات تُطوى في الوعاء. تجري اللعبة في ثلاث جولات بالأسماء نفسها: في الأولى تصف الاسم بأي كلمات عدا الاسم نفسه؛ في الثانية بكلمة واحدة فقط؛ في الثالثة تمثّله بصمت. تتناوب الفرق سحب القصاصات ضدّ الوقت، وتذكُّر الأسماء من الجولات السابقة هو سرّ الفوز.`}},{tags:[`two`,`small`,`nosupplies`],meter:1,cat:`guessing`,en:{name:`I Spy`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One person picks something they can see and says "I spy with my little eye something beginning with…" and the first letter. Everyone else looks around and guesses what it is. Whoever guesses correctly chooses the next object. Perfect for waiting rooms, car rides, or quiet moments with no supplies.`},ar:{name:`أرى بعيني`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يختار شخص شيئًا يراه ويقول: «أرى بعيني الصغيرة شيئًا يبدأ بحرف…» ثم الحرف الأول. يبحث الباقون حولهم ويخمّنون. من يخمّن بصواب يختار الشيء التالي. مثالية لغرف الانتظار أو رحلات السيارة أو اللحظات الهادئة بلا أدوات.`}},{tags:[`two`,`small`,`nosupplies`],meter:1,cat:`word`,en:{name:`Ghost`,players:`2+ players`,needs:`<b>You need:</b> Nothing — just a shared vocabulary.`,how:`Players take turns adding one letter to a growing string, always with a real word in mind, but never completing a word. Finish a word (of four letters or more) and you earn a letter of the word G-H-O-S-T. Bluffing is allowed: if you think someone added a letter with no real word in mind, challenge them — if they can't name one, they take a letter instead. Spell GHOST and you're out.`},ar:{name:`الشبح`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء — سوى حصيلة لغوية مشتركة.`,how:`يضيف اللاعبون بالتناوب حرفًا إلى سلسلة متنامية، وفي ذهن كلٍّ كلمة حقيقية، دون إكمال أي كلمة. من يُكمل كلمة (من أربعة أحرف فأكثر) يكسب حرفًا من كلمة «ش‑ب‑ح». والخداع مسموح: إن ظننت أن أحدهم أضاف حرفًا بلا كلمة حقيقية في ذهنه فتحدَّه — فإن عجز عن ذكرها أخذ حرفًا بدلًا منك. من يُكمل «شبح» يخرج.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`The Yes/No Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One player fires off a rapid stream of questions, and the person in the hot seat must answer every one without ever saying "yes" or "no" — or nodding or shaking their head. Slip up and your turn ends. The questioner's job is to lull you into an automatic "yeah." See who can survive the longest.`},ar:{name:`لعبة نعم/لا`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يطلق لاعب سيلًا سريعًا من الأسئلة، وعلى من في «كرسي الاستجواب» أن يجيب عن كلٍّ دون أن يقول «نعم» أو «لا» — ولا حتى بإيماءة رأس. أي زلّة تُنهي دوره. مهمّة السائل أن يستدرجك إلى «أيوه» تلقائية. جرّبوا من يصمد أطول.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Hide and Seek`,players:`3+ players`,needs:`<b>You need:</b> A space with hiding spots.`,how:`One player closes their eyes and counts to an agreed number while everyone else hides. The seeker then hunts for the others, and the last person found becomes the next seeker. A timeless favourite that works in a house, a garden, or a park — just agree on the boundaries first.`},ar:{name:`الاستغماية (الغمّيضة)`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مكان به مخابئ.`,how:`يغمض لاعب عينيه ويعدّ إلى رقم متّفق عليه بينما يختبئ الباقون. ثم يبحث عنهم، وآخر من يُعثَر عليه يصبح الباحث التالي. لعبة خالدة تصلح في منزل أو حديقة أو حديقة عامة — فقط اتفقوا على الحدود أولًا.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Red Light, Green Light`,players:`3+ players`,needs:`<b>You need:</b> A bit of open space.`,how:`One player is the caller and stands at the far end with their back turned. On "green light" everyone creeps forward; on "red light" the caller spins around, and anyone caught still moving is sent back to the start. The first player to sneak up and tag the caller wins and takes over calling.`},ar:{name:`إشارة حمراء، إشارة خضراء`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> بعض المساحة المفتوحة.`,how:`يقف لاعب واحد مناديًا في الطرف البعيد وظهره للجميع. عند «إشارة خضراء» يتسلّل الجميع للأمام؛ وعند «إشارة حمراء» يستدير المنادي فجأة، ومن يُضبَط متحرّكًا يعود إلى نقطة البداية. أول من يتسلّل ويلمس المنادي يفوز ويتولّى المناداة.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Duck, Duck, Goose`,players:`5+ players`,needs:`<b>You need:</b> Floor space to sit in a circle.`,how:`Everyone sits in a circle while one person walks around the outside, tapping each head and saying "duck… duck… duck…" — until they tap someone and shout "goose!" That person leaps up and chases the tapper around the circle, trying to tag them before they steal the empty spot. Get caught and you go again.`},ar:{name:`بطة، بطة، إوزة`,players:`5 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مساحة أرضية للجلوس في دائرة.`,how:`يجلس الجميع في دائرة بينما يدور شخص حول الخارج، يربّت على الرؤوس قائلًا «بطة… بطة… بطة…» حتى يربّت على أحدهم ويصيح «إوزة!». يقفز ذلك اللاعب ويطارد الملامِس حول الدائرة محاولًا لمسه قبل أن يخطف مكانه الفارغ. من يُمسَك يعيد الكرّة.`}},{tags:[`small`,`big`],meter:2,cat:`cards`,en:{name:`I Doubt It`,players:`3+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Deal the whole deck out. Players take turns placing cards face-down and announcing them in rank order — "two threes" — but you're allowed to lie about what you put down. If anyone suspects a bluff they shout "Cheat!" and the pile is flipped: a caught liar takes the whole pile, but a wrong accuser takes it themselves. First to empty their hand wins.`},ar:{name:`لا أصدّقك`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`وزّعوا كل الورق. يضع اللاعبون بالتناوب ورقات مقلوبة معلنين رتبتها بالترتيب — «ثلاثتان من فئة الثلاثة» — ويُسمح بالكذب في ما تضعه. إن شكّ أحد في كذبة صاح «غش!» فيُقلَب الكومة: الكاذب المضبوط يأخذها كلها، لكن المتّهِم المخطئ يأخذها هو. أول من يُفرِغ يده يفوز.`}},{tags:[`two`,`small`],meter:1,cat:`cards`,en:{name:`Go Fish`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Everyone gets a hand of cards and the rest form a draw pile. On your turn you ask another player for a rank you're holding — "Got any sevens?" If they do, they hand them over; if not, they say "Go fish" and you draw from the pile. Collect four of a kind to set them aside. Most sets when the cards run out wins.`},ar:{name:`اصطَد سمكة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`يأخذ الجميع أوراقًا وتُشكّل البقية كومة سحب. في دورك تطلب من لاعب آخر رتبةً تحملها — «هل لديك سبعات؟» فإن كان لديه يسلّمها، وإلا قال «اصطَد سمكة» فتسحب من الكومة. اجمع أربعًا متطابقة وضعها جانبًا. من يجمع أكثر المجموعات عند نفاد الورق يفوز.`}},{tags:[`two`,`small`],meter:1,cat:`paper`,en:{name:`Save the Word`,players:`2+ players`,needs:`<b>You need:</b> Paper and a pen.`,how:`One player thinks of a word and draws a blank for each letter. The others guess letters one at a time: correct guesses get filled in, wrong ones add a piece to a little stick figure. Solve the word before the drawing is completed to win — leave it unsolved and the word-setter does. Great one-on-one or with a guessing team.`},ar:{name:`أنقذ الكلمة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> ورقة وقلم.`,how:`يفكّر لاعب في كلمة ويرسم فراغًا لكل حرف. يخمّن الباقون الحروف واحدًا تلو الآخر: الصحيح يُملأ، والخاطئ يضيف جزءًا إلى رسم رجل صغير. حلّوا الكلمة قبل اكتمال الرسم لتفوزوا — واتركوها دون حلّ ليفوز واضع الكلمة. رائعة لاثنين أو مع فريق يخمّن.`}},{tags:[`two`,`nosupplies`],meter:1,cat:`paper`,en:{name:`Dots and Boxes`,players:`2 players`,needs:`<b>You need:</b> Paper and a pen.`,how:`Draw a grid of dots. Players take turns joining two neighbouring dots with a line. Complete the fourth side of a small box and you claim it with your initial — and take another turn. When every box is filled, whoever owns the most wins. Deceptively simple, quietly cutthroat.`},ar:{name:`النقاط والمربّعات`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> ورقة وقلم.`,how:`ارسموا شبكة من النقاط. يصل اللاعبون بالتناوب بين نقطتين متجاورتين بخطّ. من يكمل الضلع الرابع لمربّع صغير يملكه بوضع حرفه الأول — ويحصل على دور إضافي. حين تمتلئ كل المربّعات، من يملك الأكثر يفوز. بسيطة في ظاهرها، شرسة في باطنها.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`dice`,en:{name:`Yacht (Dice)`,players:`2+ players`,needs:`<b>You need:</b> Five dice and a scoresheet.`,how:`On your turn you roll five dice, then get two re-rolls where you can keep the dice you like and throw the rest again. You're chasing combinations — three of a kind, a run, a full house, five alike — and each scores into a category you can only fill once. The whole table
