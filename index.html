plays the same categories; the highest total after everyone fills their sheet wins. This is the folk ancestor of the boxed dice games you may know.`},ar:{name:`اليخت (نرد)`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> خمسة أحجار نرد وورقة تسجيل.`,how:`في دورك ترمي خمسة أحجار نرد، ثم تحصل على رميتين إضافيتين تحتفظ فيهما بما يعجبك وترمي الباقي. تطارد تركيبات — ثلاثة متماثلة، تسلسل، بيت مليء، خمسة متماثلة — وتُسجَّل كلٌّ في خانة تُملأ مرة واحدة. الجميع يلعب الخانات نفسها؛ وأعلى مجموع بعد أن يملأ الكل ورقته يفوز. هذه الجدّة الشعبية لألعاب النرد المعلّبة التي قد تعرفها.`}},{tags:[`small`,`big`],meter:2,cat:`dice`,en:{name:`Liar's Dice`,players:`3+ players`,needs:`<b>You need:</b> Five dice and a cup per player.`,how:`Everyone rolls their dice under a cup, hidden from the others. Players take turns making bolder and bolder bids about how many of a given number are on the table across all cups — "there are six fives." You can raise the bid or call the last player a liar. Lift the cups: if the bid was a lie the bluffer loses a die, otherwise the challenger does. Lose all your dice and you're out.`},ar:{name:`نرد الكذّاب`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> خمسة أحجار نرد وكوب لكل لاعب.`,how:`يرمي كلٌّ نرده تحت كوب مخفيًّا عن الآخرين. يقدّم اللاعبون بالتناوب مزايدات أجرأ فأجرأ حول عدد ظهور رقم معيّن على الطاولة في كل الأكواب — «هناك ستّ خمسات». يمكنك رفع المزايدة أو اتهام السابق بالكذب. ارفعوا الأكواب: إن كانت المزايدة كذبًا خسر المخادع حجرًا، وإلا خسر المتحدّي. من يخسر كل نرده يخرج.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`dice`,en:{name:`Pig (Dice)`,players:`2+ players`,needs:`<b>You need:</b> A single die.`,how:`A pure nerve game. On your turn you keep rolling one die, adding each roll to a running tally — but if you ever roll a one, you lose everything gained that turn and pass the die on. Stop and "bank" whenever you like to lock in the points. First to a hundred wins. The agony is deciding when greed becomes foolish.`},ar:{name:`الخنزير (نرد)`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> حجر نرد واحد.`,how:`لعبة أعصاب خالصة. في دورك تواصل رمي حجر واحد وتضيف كل رمية إلى رصيد الجولة — لكن إن ظهر الرقم واحد خسرت كل ما جمعته في هذا الدور ومرّرت النرد. توقّف و«أودِع» متى شئت لتثبّت نقاطك. أول من يبلغ مئة يفوز. العذاب في تحديد متى يتحوّل الطمع إلى حماقة.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`dice`,en:{name:`Beetle`,players:`2+ players`,needs:`<b>You need:</b> One die, paper, and pens.`,how:`Race to draw a complete bug. Each number on the die unlocks a body part — you must roll a six for the body before anything else can attach, a five for the head, and so on down to the legs, eyes, and feelers. Roll, draw the part you're allowed, and pass the die. First to finish a full beetle shouts "Beetle!" and wins. A gentle, giggly one that even small children can play.`},ar:{name:`الخنفساء`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> حجر نرد واحد، وورق، وأقلام.`,how:`تسابقوا على رسم حشرة كاملة. يفتح كل رقم على النرد جزءًا من الجسم — عليك رمي ٦ للجسم قبل أي شيء، و٥ للرأس، ونزولًا إلى الأرجل والعينين وقرون الاستشعار. ارمِ، وارسم الجزء المسموح، ومرّر النرد. أول من ينهي خنفساء كاملة يصيح «خنفساء!» ويفوز. لطيفة ومضحكة ويلعبها الصغار بسهولة.`}},{tags:[`two`,`small`],meter:1,cat:`cards`,en:{name:`Snap`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Deal the whole deck out face-down. Players take turns flipping their top card onto a shared pile, and the instant two cards of the same rank land in a row, the first person to slap the pile and yell "Snap!" wins it all. Fast reflexes beat everything. Win all the cards and you win the game.`},ar:{name:`سناب (المطابقة)`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`وزّعوا كل الورق مقلوبًا. يقلب اللاعبون بالتناوب ورقتهم العليا في كومة مشتركة، ولحظة أن تتوالى ورقتان بالرتبة نفسها، أول من يصفع الكومة ويصيح «سناب!» يكسبها كلها. السرعة تتغلّب على كل شيء. من يفوز بكل الورق يفوز باللعبة.`}},{tags:[`two`],meter:1,cat:`cards`,en:{name:`War`,players:`2 players`,needs:`<b>You need:</b> A deck of cards.`,how:`Split the deck evenly, face-down. Both players flip their top card at once; the higher card takes both. If they tie, it's "war" — each player lays a few cards down and flips again, winner takes the whole stack. Keep going until one player holds every card. No skill, all suspense — perfect for passing time with a kid.`},ar:{name:`الحرب`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`اقسموا الورق بالتساوي مقلوبًا. يقلب اللاعبان ورقتهما العليا معًا؛ الأعلى يأخذ الاثنتين. عند التعادل تقع «حرب» — يضع كلٌّ بضع ورقات ويقلب مجدّدًا، والفائز يأخذ الكومة كلها. واصلوا حتى يملك أحدهما كل الورق. لا مهارة، كل التشويق — مثالية لتمضية الوقت مع طفل.`}},{tags:[`two`,`small`],meter:1,cat:`cards`,en:{name:`Crazy Eights`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Everyone gets a hand and one card is turned up to start a discard pile. On your turn you must play a card matching the top one by suit or rank, or draw until you can. Eights are wild — play one and you name the suit everyone must follow. First to empty their hand wins. It's the folk game that inspired many modern shedding card games.`},ar:{name:`الثمانيات المجنونة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`يأخذ الجميع أوراقًا وتُقلَب ورقة لبدء كومة الرمي. في دورك تلعب ورقة تطابق العليا في النوع أو الرتبة، أو تسحب حتى تستطيع. الثمانيات جوكر — العبها وسمِّ النوع الذي يجب أن يتبعه الجميع. أول من يُفرِغ يده يفوز. هي الجدّة الشعبية لكثير من ألعاب الورق الحديثة.`}},{tags:[`small`,`big`],meter:2,cat:`cards`,en:{name:`President`,players:`4+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Deal all the cards out. Players take turns shedding cards of ever-higher value, and anyone who can't or won't beat the last play passes. The first to run out becomes President for the next round, the last stuck holding cards becomes the Scum — and in the following deal the Scum hands their best cards up to the President. Climbing the social ladder (and gloating) is the whole point.`},ar:{name:`الرئيس`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`وزّعوا كل الورق. يرمي اللاعبون بالتناوب ورقات ذات قيمة أعلى فأعلى، ومن لا يستطيع أو لا يريد تجاوز آخر رمية يمرّر دوره. أول من ينفد ورقه يصبح «الرئيس» في الجولة التالية، وآخر من يعلق بورقه يصبح «الحقير» — وفي التوزيع التالي يسلّم الحقير أفضل ورقاته إلى الرئيس. تسلّق السلّم الاجتماعي (والتباهي) هو كل الهدف.`}},{tags:[`two`,`small`],meter:1,cat:`cards`,en:{name:`Rummy`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Draw and discard one card each turn, trying to organise your hand into "melds" — runs of the same suit in sequence, or sets of the same rank. Lay them down when you can. The first player to arrange their entire hand into valid melds and discard their last card wins the round. A relaxed classic that rewards a little planning.`},ar:{name:`الرَّمي (رَمّي)`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`اسحب وارمِ ورقة كل دور، محاولًا تنظيم يدك إلى «مجموعات» — تسلسلات من النوع نفسه، أو مجموعات من الرتبة نفسها. اعرضها متى استطعت. أول من يرتّب يده كلها في مجموعات صحيحة ويرمي ورقته الأخيرة يفوز بالجولة. كلاسيكية هادئة تكافئ قليلًا من التخطيط.`}},{tags:[`small`,`big`],meter:2,cat:`cards`,en:{name:`Kemps`,players:`4+ (pairs)`,needs:`<b>You need:</b> A deck of cards.`,how:`Play in pairs sitting across from each other. Before the game each pair invents a secret signal — a wink, a tap, a stretch. As cards are swapped through a shared middle, you try to collect four of a kind, then signal your partner so they can shout "Kemps!" and win the round. But if an opposing player spots your signal and calls "Kemps!" on you first, you lose. Half card game, half spy game.`},ar:{name:`كِمبس`,players:`4 لاعبين فأكثر (أزواج)`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`العبوا في أزواج يجلس كلٌّ مقابل شريكه. قبل اللعبة يبتكر كل زوج إشارة سرّية — غمزة، نقرة، تمطٍّ. مع تبادل الورق عبر وسط مشترك، تحاول جمع أربع متطابقة ثم تشير لشريكك ليصيح «كِمبس!» ويفوز بالجولة. لكن إن رصد خصم إشارتك وصاح «كِمبس!» عليك أولًا، خسرت. نصفها لعبة ورق، ونصفها لعبة تجسّس.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`Fortunately, Unfortunately`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Tell a story together, alternating turns, where every sentence flips the mood. One person adds a line starting "Fortunately…" and the next must answer with "Unfortunately…" — a lucky break followed by a fresh disaster, over and over. The story lurches from triumph to catastrophe and back until it collapses in laughter. No supplies, endless replay.`},ar:{name:`لحسن الحظ، لسوء الحظ`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`احكوا قصة معًا بالتناوب، وكل جملة تقلب المزاج. يضيف أحدهم سطرًا يبدأ بـ«لحسن الحظ…» وعلى التالي أن يردّ بـ«لسوء الحظ…» — فرصة سعيدة تتبعها كارثة جديدة، مرارًا وتكرارًا. تتأرجح القصة بين الظفر والنكبة حتى تنهار ضحكًا. بلا أدوات، وإعادة لا تنتهي.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`The Minister's Cat`,players:`2+ players`,needs:`<b>You need:</b> Nothing — clap a steady beat.`,how:`Going around the circle in rhythm, each person describes "the minister's cat" with an adjective starting with the letter A — "an angry cat, an amazing cat" — no repeats. When everyone's had a go, move on to B, then C, all the way through the alphabet. Miss the beat or repeat a word and you're out. Simple, musical, and quietly competitive.`},ar:{name:`قطّة الوزير`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء — صفّقوا بإيقاع ثابت.`,how:`حول الدائرة على الإيقاع، يصف كلٌّ «قطّة الوزير» بصفة تبدأ بالحرف «أ» — «قطّة أنيقة، قطّة أليفة» — بلا تكرار. حين يأخذ الجميع دورهم، انتقلوا إلى «ب» ثم «ت»، وهكذا عبر الحروف. من يفوّت الإيقاع أو يكرّر يخرج. بسيطة وموسيقية وتنافسية بهدوء.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`Word Association`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One person says a word; the next instantly says the first word it makes them think of, and so on around the circle without pausing. Hesitate too long, repeat a word, or say something with no clear link and you drop out. It's fast, revealing, and often hilarious where the chain ends up compared to where it started.`},ar:{name:`تداعي الكلمات`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يقول شخص كلمة؛ ويقول التالي فورًا أول كلمة تخطر له مرتبطة بها، وهكذا حول الدائرة بلا توقّف. من يتردّد طويلًا أو يكرّر أو يقول شيئًا بلا رابط واضح يخرج. سريعة وكاشفة وغالبًا مضحكة أين تنتهي السلسلة مقارنة ببدايتها.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`guessing`,en:{name:`Botticelli`,players:`3+ players`,needs:`<b>You need:</b> Nothing but general knowledge.`,how:`One player thinks of a famous person and reveals only the first letter of their surname. The others try to guess by asking indirect questions — "Are you a scientist?" — which the thinker must deflect by naming any matching person themselves ("No, I'm not Einstein"). Only when the group stumps them do they earn a direct yes-or-no question. Piece together the clues to unmask the mystery figure.`},ar:{name:`بوتيتشيلّي`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى الثقافة العامة.`,how:`يفكّر لاعب في شخصية مشهورة ويكشف الحرف الأول من لقبها فقط. يحاول الباقون التخمين بأسئلة غير مباشرة — «هل أنت عالِم؟» — وعلى صاحب السرّ صدّها بذكر أي شخص مطابق («لا، لست أينشتاين»). فقط حين تعجزه المجموعة يكسبون سؤالًا مباشرًا بنعم أو لا. اجمعوا الأدلّة لكشف الشخصية الغامضة.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Tag & Freeze Tag`,players:`3+ players`,needs:`<b>You need:</b> Open space to run.`,how:`One player is "it" and chases everyone else; whoever gets tagged becomes "it" instead. In the freeze version, a tagged player must freeze in place until a teammate crawls under or touches them to set them free — so "it" tries to freeze everyone at once. Pure, breathless fun that needs nothing but room to move.`},ar:{name:`المطاردة والتجمّد`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مساحة مفتوحة للجري.`,how:`يكون لاعب «هو» ويطارد الجميع؛ ومن يُلمَس يصبح «هو» بدلًا منه. في صيغة التجمّد، على من يُلمَس أن يتجمّد مكانه حتى يزحف زميل تحته أو يلمسه لتحريره — فيحاول «هو» تجميد الجميع دفعة واحدة. متعة خالصة لا تحتاج سوى مساحة للحركة.`}},{tags:[`big`],meter:3,cat:`outdoor`,en:{name:`Capture the Flag`,players:`6+ (two teams)`,needs:`<b>You need:</b> A large space, two markers for flags, two teams.`,how:`Split into two teams, each guarding a flag at their end of a divided field. The goal is to sneak into enemy territory, grab their flag, and carry it back to your side — but if you're tagged on their half, you're sent to "jail" until a teammate frees you. Combines stealth, speed, and strategy. First team to capture the other's flag wins.`},ar:{name:`اختطاف العلَم`,players:`6 لاعبين فأكثر (فريقان)`,needs:`<b>تحتاج إلى:</b> مساحة واسعة، وعلامتان للعلَمين، وفريقان.`,how:`انقسموا إلى فريقين، يحرس كلٌّ علَمه في طرفه من ملعب مقسوم. الهدف التسلّل إلى أرض الخصم وخطف علَمه وحمله إلى جهتك — لكن إن لُمِست في نصفهم أُرسِلت إلى «السجن» حتى يحرّرك زميل. تمزج التخفّي والسرعة والتخطيط. أول فريق يخطف علَم الآخر يفوز.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`What's the Time, Mr. Wolf?`,players:`3+ players`,needs:`<b>You need:</b> A bit of open space.`,how:`One player is the Wolf, standing with their back to the others at the far end. The group calls "What's the time, Mr. Wolf?" and creeps forward by however many steps the Wolf's answer suggests ("Three o'clock" = three steps). But if the Wolf turns and shouts "Dinner time!" they give chase — and anyone caught becomes the next Wolf. Reach the Wolf without being caught to win.`},ar:{name:`كم الساعة يا سيّد ذئب؟`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> بعض المساحة المفتوحة.`,how:`يكون لاعب هو الذئب، واقفًا وظهره للآخرين في الطرف البعيد. تنادي المجموعة «كم الساعة يا سيّد ذئب؟» فتتقدّم خطوات بعدد ما توحي به إجابته («الثالثة» = ثلاث خطوات). لكن إن استدار الذئب وصاح «وقت العشاء!» انطلق مطاردًا — ومن يُمسَك يصبح الذئب التالي. صِل إلى الذئب دون أن تُمسَك لتفوز.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Marco Polo`,players:`3+ players`,needs:`<b>You need:</b> A swimming pool (or a safe open space).`,how:`One player closes their eyes and is "it," calling out "Marco!" — to which everyone else must answer "Polo!" Using only those sounds to locate people, the blind player tries to tag someone, who then takes over. Usually played in a pool, but it works anywhere flat and hazard-free. A game of ears over eyes.`},ar:{name:`ماركو بولو`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> حوض سباحة (أو مساحة آمنة مفتوحة).`,how:`يغمض لاعب عينيه وهو «هو»، مناديًا «ماركو!» — وعلى الجميع أن يردّوا «بولو!». مستخدمًا هذه الأصوات وحدها لتحديد مواقع الآخرين، يحاول الملامسة، فيتولّى من يُلمَس الدور. تُلعب عادة في المسبح، لكنها تصلح في أي مكان مستوٍ وآمن. لعبة الأذن على العين.`}},{tags:[`small`,`big`],meter:2,cat:`outdoor`,en:{name:`Classic Relay Races`,players:`4+ players`,needs:`<b>You need:</b> Simple props — spoons, eggs or balls, sacks, scarves.`,how:`The staples of every fete and field day, best run as teams. Balance an egg on a spoon and don't drop it; hop to the finish inside a sack; tie your ankle to a partner's for the three-legged dash. Line up, race to a marker and back, then tag the next runner. Mix and match events for a whole afternoon of friendly chaos.`},ar:{name:`سباقات التتابع الكلاسيكية`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> أدوات بسيطة — ملاعق، بيض أو كرات، أكياس، أوشحة.`,how:`أساسيات كل مهرجان ويوم رياضي، وأفضلها بالفرق. وازن بيضة على ملعقة دون أن تسقط؛ اقفز إلى النهاية داخل كيس؛ اربط كاحلك بكاحل شريك للركض ثلاثيّ الأرجل. اصطفّوا، اركضوا إلى علامة وارجعوا، ثم المسوا العدّاء التالي. امزجوا الفعاليات لعصر كامل من الفوضى المرحة.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`travel`,en:{name:`The License Plate Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing but a journey and passing traffic.`,how:`A road-trip classic. Watch the license plates of passing cars and try to spot ones from as many different regions or states as you can, ticking each off as you go. Whoever spots the most by the end of the trip wins. A variant: make words or silly phrases from the plates' letters. Turns a boring drive into a hunt.`},ar:{name:`لعبة لوحات السيارات`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى رحلة وسيارات عابرة.`,how:`كلاسيكية الطريق. راقبوا لوحات السيارات العابرة وحاولوا رصد أكبر عدد من مناطق أو مدن مختلفة، مع شطب كلٍّ عند رؤيته. من يرصد الأكثر بنهاية الرحلة يفوز. صيغة أخرى: كوّنوا كلمات أو عبارات طريفة من حروف اللوحات. تحوّل رحلة مملّة إلى مطاردة.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`travel`,en:{name:`The Movie Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing but film knowledge.`,how:`Name an actor. The next player names a film that actor was in; the following player names someone else from that film; then another film with that person, and so on, back and forth. Stall for too long or get a link wrong and you're out. A great one for the car or a lazy evening, and it settles who really knows their movies.`},ar:{name:`لعبة الأفلام`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى معرفة بالأفلام.`,how:`اذكر ممثّلًا. يذكر التالي فيلمًا شارك فيه؛ ثم يذكر من يليه شخصًا آخر من ذلك الفيلم؛ ثم فيلمًا آخر لذلك الشخص، وهكذا ذهابًا وإيابًا. من يتأخّر طويلًا أو يخطئ في الرابط يخرج. رائعة للسيارة أو لأمسية كسولة، وتحسم من يعرف أفلامه حقًّا.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`memory`,en:{name:`Kim's Game`,players:`2+ players`,needs:`<b>You need:</b> A tray of small objects, a cloth, paper and pens.`,how:`Gather a dozen or so random objects on a tray and let everyone study them for a minute. Cover the tray with a cloth, then have each player write down as many items as they can remember. Whoever recalls the most wins — and for a harder round, secretly remove one object and see who can name what's missing. A brilliant test of observation.`},ar:{name:`لعبة كِم`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> صينية أغراض صغيرة، وقطعة قماش، وورق وأقلام.`,how:`اجمعوا نحو اثني عشر غرضًا عشوائيًّا على صينية ودعوا الجميع يتأمّلونها دقيقة. غطّوا الصينية بقماش، ثم يكتب كلٌّ ما يتذكّره من الأغراض. من يتذكّر الأكثر يفوز — وللجولة الأصعب، أزيلوا غرضًا سرًّا وانظروا من يكتشف المفقود. اختبار بديع للملاحظة.`}},{tags:[`two`],meter:1,cat:`paper`,en:{name:`Sea Battle`,players:`2 players`,needs:`<b>You need:</b> Paper and a pen each.`,how:`Each player secretly draws a grid and marks a small fleet of ships across squares. Taking turns, you call out grid coordinates to "fire" at your opponent's hidden fleet; they tell you hit or miss, and you track it on a second grid. Pinpoint and sink every enemy ship before yours are destroyed. The classic pen-and-paper guessing duel.`},ar:{name:`المعركة البحرية`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> ورقة وقلم لكل لاعب.`,how:`يرسم كل لاعب شبكة سرًّا ويوزّع أسطولًا صغيرًا من السفن عبر المربّعات. بالتناوب، تنادي إحداثيات لـ«قصف» أسطول خصمك الخفي؛ يخبرك بإصابة أو خطأ، وتتتبّع ذلك على شبكة ثانية. حدّد وأغرِق كل سفن العدو قبل أن تُدمَّر سفنك. مبارزة التخمين الكلاسيكية بالورقة والقلم.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`conversation`,en:{name:`Desert Island`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Everyone answers what they'd take to a desert island — a few songs, books, foods, or luxuries — and then defends their choices to the group. Swap the category each round for endless variations. It's a warm, revealing conversation starter that shows what people truly treasure.`},ar:{name:`جزيرة مهجورة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يجيب الجميع عمّا سيأخذونه إلى جزيرة مهجورة — بضع أغانٍ أو كتب أو أطعمة أو أشخاص — ثم يدافعون عن اختياراتهم. غيّروا الفئة كل جولة لتنويعات لا تنتهي. بداية حديث دافئة تكشف ما يعزّه كلٌّ منّا.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`Word Chain`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Each player says a word that begins with the last letter of the word before it — "apple, elephant, tiger, rabbit." No repeats, and no long pauses. Stumble or stall and you drop out. Restrict it to a single category, like animals or cities, to crank up the challenge.`},ar:{name:`سلسلة الكلمات`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يقول كل لاعب كلمة تبدأ بالحرف الأخير من الكلمة السابقة — «قمر، رمل، لبن، نور». بلا تكرار ولا توقّف طويل. من يتعثّر أو يتردّد يخرج. اقصروها على فئة واحدة، كالحيوانات أو المدن، لزيادة الصعوبة.`}},{tags:[`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`Fizz Buzz`,players:`3+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Count upward around the circle, but swap any multiple of three for "fizz," any multiple of five for "buzz," and any multiple of both for "fizzbuzz." Say the wrong thing or hesitate and you're out. It sounds easy until the numbers climb and your brain ties itself in knots.`},ar:{name:`فِز باز`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`عُدّوا تصاعديًّا حول الدائرة، لكن استبدلوا كل مضاعف للعدد ثلاثة بكلمة «فِز»، وكل مضاعف للعدد خمسة بكلمة «باز» (و«فِزباز» لِما يقبل القسمة عليهما معًا). أي خطأ يُخرجك. تبدو سهلة حتى تعلو الأرقام فيتشابك عقلك.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`word`,en:{name:`Spelling Bee`,players:`2+ players`,needs:`<b>You need:</b> A word list or dictionary.`,how:`One person reads out words of rising difficulty, and each player in turn must spell theirs aloud, letter by letter. Get it right and you stay in; miss one and you're eliminated. The last speller standing takes the crown — a living-room version of the schoolroom classic.`},ar:{name:`مسابقة التهجئة`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> قائمة كلمات أو معجم.`,how:`يقرأ شخص كلمات متصاعدة الصعوبة، وعلى كل لاعب بدوره تهجئة كلمته بصوت عالٍ حرفًا حرفًا. الصواب يبقيك، والخطأ يُخرجك. آخر من يبقى يفوز — نسخة منزلية من كلاسيكية المدرسة.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`word`,en:{name:`Contact`,players:`3+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One player thinks of a secret word and reveals only its first letter. The guessers try to work it out by giving each other cryptic clues ("a jungle cat?") and, when two of them think of the same answer, they count down and say it together — "contact!" If they match and the thinker can't guess their word first, the next letter is revealed.`},ar:{name:`تواصُل`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يفكّر لاعب في كلمة سرّية ويكشف حرفها الأول. يحاول المخمّنون الوصول إليها بإعطاء بعضهم أدلّة خفية («قطّة برّية؟»)، وحين يفكّر اثنان في الكلمة نفسها يعدّان ويقولانها معًا — «تواصُل!». إن تطابقا وعجز صاحب السرّ عن تخمين كلمتهما أولًا، كُشِف الحرف التالي.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`word`,en:{name:`Tongue Twister Challenge`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Take turns attempting fiendish tongue twisters — "she sells seashells," "red lorry, yellow lorry" — faster and faster each round. Trip over the words and you're out or you pass the challenge on. Whoever can rattle theirs off cleanest at top speed wins the giggles and the glory.`},ar:{name:`تحدّي عثرة اللسان`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`تناوبوا على محاولة جُمَل مربكة للّسان — «خيط حرير على حائط خليل» — أسرع فأسرع كل جولة. من يتعثّر في الكلمات يخرج أو يمرّر التحدّي. من ينطقها أنظف بسرعة يفوز بالضحك والمجد.`}},{tags:[`small`,`big`,`nosupplies`],meter:2,cat:`guessing`,en:{name:`Psychiatrist`,players:`4+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`One player, the "psychiatrist," steps away while the group secretly agrees on a rule for how they'll answer — say, everyone responds as though they were the person on their left. The psychiatrist returns and asks anyone questions, trying to diagnose the hidden pattern behind the strange, mismatched answers. Crack the rule to win.`},ar:{name:`الطبيب النفسي`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`يبتعد لاعب ليكون «الطبيب»، وتتّفق المجموعة سرًّا على قاعدة لإجاباتها — مثلًا يجيب كلٌّ كأنه الشخص على يساره. يعود الطبيب ويسأل الجميع، محاولًا تشخيص النمط الخفي من الإجابات الغريبة المتنافرة. من يكتشف القاعدة يفوز.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`guessing`,en:{name:`Hot and Cold`,players:`2+ players`,needs:`<b>You need:</b> A small object to hide.`,how:`One player hides an object or picks a secret target while another searches for it. The rest guide the seeker purely with temperature — "warmer" as they close in, "colder" as they drift away, "boiling!" when they're almost on it. Simple, gleeful, and endlessly replayable, especially with little ones.`},ar:{name:`ساخن وبارد`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> غرض صغير للإخفاء.`,how:`يخفي لاعب غرضًا أو يختار هدفًا سرّيًّا بينما يبحث آخر عنه. يوجّهه الباقون بالحرارة — «أسخن» كلما اقترب، و«أبرد» كلما ابتعد، و«يغلي!» حين يكاد يصل. بسيطة ومبهجة وإعادتها لا تنتهي، خصوصًا مع الصغار.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`guessing`,en:{name:`Name That Tune`,players:`2+ players`,needs:`<b>You need:</b> Nothing but songs in your head.`,how:`One person hums, whistles, or taps out the rhythm of a song and everyone races to name it. For a bolder round, challenge each other to guess a tune from just the first few notes. A point for every correct call, and bonus bragging rights for naming it fastest.`},ar:{name:`خمّن اللحن`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى أغانٍ في رأسك.`,how:`يدندن أحدهم لحن أغنية أو ينقر إيقاعها ويتسابق الجميع على تسميتها. لجولة أجرأ، تحدّوا بعضكم على تخمين اللحن من أول بضع نغمات فقط. نقطة لكل تخمين صحيح، وتباهٍ إضافي لأسرع من يسمّيها.`}},{tags:[`small`,`big`],meter:2,cat:`acting`,en:{name:`Reverse Charades`,players:`4+ (teams)`,needs:`<b>You need:</b> Word slips and a timer.`,how:`Charades turned upside down: instead of one actor, the whole team acts out the word together while a single teammate tries to guess it. It's gloriously chaotic and takes the pressure off any one person. Race to land as many words as you can before the timer runs out.`},ar:{name:`التمثيل الصامت المعكوس`,players:`4 لاعبين فأكثر (فِرق)`,needs:`<b>تحتاج إلى:</b> قصاصات كلمات ومؤقّت.`,how:`التمثيل الصامت بالمقلوب: يمثّل الفريق كله الكلمة معًا بينما يحاول زميل واحد معيّن تسميتها. فوضوية وسريعة ورائعة لأنها ترفع الضغط عن أي شخص بمفرده. تسابقوا على أكبر عدد من الكلمات قبل انتهاء الوقت.`}},{tags:[`small`,`big`],meter:2,cat:`acting`,en:{name:`Drawing Telephone`,players:`4+ players`,needs:`<b>You need:</b> Paper and pens for everyone.`,how:`A hilarious cross between Telephone and sketching. Everyone writes a phrase at the top of their page and passes it on; the next person draws it, folds the words out of sight, and passes just the picture; the next writes what they think the drawing shows. Unfold the stacks at the end to watch "a cat riding a bicycle" mutate into glorious nonsense.`},ar:{name:`الهاتف بالرسم`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> ورق وأقلام للجميع.`,how:`مزيج مضحك بين «الهاتف» والرسم. يكتب الجميع عبارة أعلى ورقتهم ويمرّرونها؛ يرسمها التالي، ويطوي الكلمات بعيدًا، ويمرّر الرسم فقط؛ ثم يكتب من يليه ما يظنّ أن الرسم يصوّره — وهكذا. افتحوا الأكوام في النهاية لتروا كيف تحوّلت «قطّة تركب دراجة» إلى شيء لا يُعرَف.`}},{tags:[`small`,`big`],meter:1,cat:`cards`,en:{name:`The Unmatched Card`,players:`3+ players`,needs:`<b>You need:</b> A deck with one card removed to leave an odd one out.`,how:`Deal the cards out and everyone discards any pairs from their hand. Then take turns drawing a card from the player beside you, making and discarding new pairs as you go. One lonely card has no match — whoever's left holding the "unmatched card" when everything else is paired off loses the round.`},ar:{name:`البطاقة المنفردة`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق تُنزَع منها ورقة لتبقى فردية.`,how:`وزّعوا الورق ويرمي الجميع أي أزواج في أيديهم. ثم تناوبوا سحب ورقة من اللاعب المجاور، وتكوين ورمي أزواج جديدة. ورقة واحدة وحيدة — «البطاقة المنفردة» — بلا شريك؛ من يبقى ممسكًا بها بعد نفاد كل الأزواج يخسر الجولة.`}},{tags:[`two`,`small`],meter:1,cat:`cards`,en:{name:`Slapjack`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Split the deck evenly, face-down. Players take turns flipping their top card onto a central pile, and the instant a Jack appears, everyone races to slap it. First hand down claims the whole pile. Win all the cards to win the game — but slap a non-Jack and you forfeit cards. Pure reflexes.`},ar:{name:`صفعة الولد`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`اقسموا الورق بالتساوي مقلوبًا. يقلب اللاعبون بالتناوب ورقاتهم في كومة وسطى، ولحظة ظهور ورقة «الولد» (J) يتسابق الجميع على صفعها. أول يد تنزل تأخذ الكومة. اجمع كل الورق لتفوز — لكن الصفعة الخاطئة تكلّفك ورقًا.`}},{tags:[`two`],meter:1,cat:`cards`,en:{name:`Speed`,players:`2 players`,needs:`<b>You need:</b> A deck of cards.`,how:`A frantic, turn-free duel. Both players lay cards at the same time onto two shared piles, stacking up or down in rank, drawing fresh cards from their own stack as fast as their hands allow. There's no waiting and no mercy. First to shed every card shouts "Speed!" and wins.`},ar:{name:`السرعة`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`مبارزة ثنائية محمومة بلا أدوار. يلعب اللاعبان ورقاتهما في الوقت نفسه على كومتين وسطيّتين، بالبناء صعودًا أو نزولًا بالرتبة، مع السحب من كومتهما الخاصة بأسرع ما تسمح اليدان. لا انتظار ولا رحمة. أول من يُفرِغ يده وكومته يصيح «سرعة!» ويفوز.`}},{tags:[`small`],meter:2,cat:`cards`,en:{name:`Hearts`,players:`4 players`,needs:`<b>You need:</b> A deck of cards.`,how:`A trick-taking classic where you want the fewest points, not the most. Each heart you're forced to take costs a point, and the dreaded Queen of Spades costs thirteen. Lowest score after several rounds wins — unless you're bold enough to "shoot the moon" by taking every penalty card and flipping the score onto everyone else.`},ar:{name:`القلوب`,players:`4 لاعبين`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`كلاسيكية أخذ الأكلات هدفها أقل عدد من النقاط لا أكثرها. كل ورقة قلب نقطة، وملكة البستوني ثلاث عشرة نقطة مؤلمة، فتتفادى أخذها. أقل مجموع بعد عدة جولات يفوز — إلا إن تجرّأ أحدهم على «إصابة القمر» بأخذ كل ورقات العقاب فتنقلب النقاط على الجميع.`}},{tags:[`small`],meter:2,cat:`cards`,en:{name:`Palace`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`You juggle cards in your hand plus face-up and face-down "palace" cards on the table, shedding them onto a central pile in rising rank. Certain cards reset the pile, reverse the order, or blow it up, and if you can't play, you scoop the whole stack into your hand. The last player still holding cards loses.`},ar:{name:`القصر`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`توازن بين ورق في يدك وورق «قصر» مكشوف ومقلوب على الطاولة، ترميه في كومة بترتيب صاعد. أوراق خاصة تعيد ضبط الكومة أو تعكسها أو تفجّرها، وإن عجزت عن اللعب أخذت الكومة كلها. آخر من يبقى ممسكًا بالورق يخسر.`}},{tags:[`big`],meter:2,cat:`dice`,en:{name:`Bunco`,players:`6+ players (great for 12)`,needs:`<b>You need:</b> Three dice, groups of players, and scoresheets.`,how:`A breezy dice game of pure luck played in six rounds at multiple tables. You roll three dice trying to match the round's target number for points, shouting "Bunco!" when all three come up as the target. Players shuffle between tables each round, so it's really a wonderfully social excuse to chat and roll.`},ar:{name:`بونكو`,players:`6 لاعبين فأكثر (الأفضل 12)`,needs:`<b>تحتاج إلى:</b> ثلاثة أحجار نرد، ومجموعات لاعبين، وأوراق تسجيل.`,how:`لعبة نرد اجتماعية حظّية خالصة تُلعب في جولات على عدة طاولات. ترمي ثلاثة أحجار محاولًا مطابقة رقم الجولة لتحصد النقاط، وتصيح «بونكو!» عند ثلاثية. يتنقّل اللاعبون بين الطاولات بين الجولات، فهي حقًّا ذريعة لأمسية ثرثارة.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`dice`,en:{name:`Ship, Captain, Crew`,players:`2+ players`,needs:`<b>You need:</b> Five dice.`,how:`Roll five dice in up to three throws, aiming to lock in a six (the ship), a five (the captain), and a four (the crew) in that exact order. Only once you've got all three do your final two dice count as your cargo. Highest cargo total wins the round — but miss the ship and you score nothing.`},ar:{name:`سفينة، قبطان، طاقم`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> خمسة أحجار نرد.`,how:`ارمِ خمسة أحجار في ثلاث رميات كحد أقصى، مستهدفًا ٦ (السفينة) ثم ٥ (القبطان) ثم ٤ (الطاقم) بهذا الترتيب. فقط بعد الحصول على الثلاثة يُحتسَب حجراك الأخيران كحمولتك. أعلى حمولة تفوز بالجولة — لكن إن فاتتك السفينة لم تسجّل شيئًا.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`dice`,en:{name:`Threes`,players:`2+ players`,needs:`<b>You need:</b> Five dice.`,how:`Roll five dice and, each turn, set at least one aside, chasing the lowest possible total. The twist: threes count as zero, so they're the best thing you can grab. Once everyone has used up all their dice, the player with the lowest score wins. Learnable in a minute, replayable all night.`},ar:{name:`الثلاثات`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> خمسة أحجار نرد.`,how:`ارمِ خمسة أحجار، وفي كل دور اعزل حجرًا واحدًا على الأقل، ساعيًا لأقل مجموع — لكن الثلاثات تُحتسَب صفرًا، فهي كنز. بعد أن يستعمل الجميع كل نردهم، أقل مجموع يفوز. سريعة، حظّية، وتُتعلَّم في دقيقة.`}},{tags:[`two`],meter:1,cat:`paper`,en:{name:`Tic-Tac-Toe`,players:`2 players`,needs:`<b>You need:</b> Paper and a pen.`,how:`Take turns marking your X or O in a three-by-three grid. The first to line up three in a row — across, down, or diagonally — wins. Two careful players will usually battle to a draw, which is part of its enduring, doodle-in-the-margin charm.`},ar:{name:`إكس أو (تيك تاك تو)`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> ورقة وقلم.`,how:`تناوبوا وضع X أو O في شبكة ثلاث في ثلاث. أول من يصفّ ثلاثة في خط — أفقيًّا أو رأسيًّا أو قُطريًّا — يفوز. تشتهر بانتهائها بالتعادل بين لاعبَين حذرين، وهذا نصف سحرها.`}},{tags:[`two`],meter:1,cat:`paper`,en:{name:`Sprouts`,players:`2 players`,needs:`<b>You need:</b> Paper and a pen.`,how:`Start with a few dots. Players take turns drawing a line between two dots (or looping one back to itself) and placing a new dot somewhere on that line — but lines can never cross, and no dot may sprout more than three connections. The last player able to make a legal move wins. A tiny pencil game with surprising depth.`},ar:{name:`البراعم`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> ورقة وقلم.`,how:`ابدؤوا ببضع نقاط. يرسم اللاعبون بالتناوب خطًّا بين نقطتين (أو من نقطة إلى نفسها) ويضيفون نقطة جديدة على ذلك الخط — لكن ممنوع تقاطع الخطوط، ولا يجوز لنقطة أن تتّصل بأكثر من ثلاثة خطوط. آخر لاعب يستطيع حركة قانونية يفوز. لعبة قلم صغيرة عميقة على نحو خادع.`}},{tags:[`two`],meter:1,cat:`paper`,en:{name:`Bulls and Cows`,players:`2 players`,needs:`<b>You need:</b> Paper and a pen.`,how:`One player secretly picks a four-digit number with no repeated digits; the other tries to guess it. Each guess earns feedback: a "bull" for every correct digit in the right position and a "cow" for a correct digit in the wrong spot. Use the clues to crack the code in as few guesses as you can — the classic ancestor of code-breaking games.`},ar:{name:`الثيران والأبقار`,players:`لاعبان`,needs:`<b>تحتاج إلى:</b> ورقة وقلم.`,how:`يختار لاعب سرًّا رقمًا من أربع خانات بلا تكرار؛ والآخر يخمّن. كل تخمين يحصل على تغذية راجعة: «ثور» لكل رقم صحيح في مكانه الصحيح، و«بقرة» لرقم صحيح في مكان خاطئ. استعملوا الأدلّة لفك الشيفرة بأقل عدد من التخمينات — الجدّ الأول لألعاب كسر الشيفرة.`}},{tags:[`small`,`big`],meter:1,cat:`paper`,en:{name:`Categories Grid`,players:`2+ players`,needs:`<b>You need:</b> Paper, pens, and a timer.`,how:`Agree on a handful of categories — animal, city, food, name — and pick a random letter. Everyone races to write a word starting with that letter for each category before time runs out. Score for every answer no one else thought of; matching answers cancel each other out, so the clever, obscure pick wins.`},ar:{name:`شبكة الفئات`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> ورق وأقلام ومؤقّت.`,how:`اتّفقوا على عدة فئات — حيوان، مدينة، طعام، اسم — واختاروا حرفًا عشوائيًّا. يتسابق الجميع على ملء كلمة تبدأ بذلك الحرف لكل فئة قبل انتهاء الوقت. سجّلوا نقاطًا لكل إجابة لم يكتبها غيركم؛ الإجابات المتطابقة تُلغى بعضها بعضًا، فالاختيار الذكي النادر يفوز.`}},{tags:[`two`,`small`],meter:1,cat:`memory`,en:{name:`Concentration`,players:`2+ players`,needs:`<b>You need:</b> A deck of cards.`,how:`Lay the whole deck face-down in a neat grid. On your turn, flip two cards; if they match in rank you keep the pair and go again, otherwise flip them back and let the next player try. Remembering where each card sits is everything. Whoever collects the most pairs wins.`},ar:{name:`التركيز (المطابقة)`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> مجموعة ورق لعب.`,how:`افرشوا المجموعة كلها مقلوبة في شبكة. في دورك اقلب ورقتين؛ إن تطابقتا بالرتبة احتفظت بالزوج ولعبت مجددًا، وإلا أعِدهما مقلوبتين ودع التالي يجرّب. تذكُّر مكان كل ورقة هو كل شيء. من يجمع أكثر الأزواج في النهاية يفوز.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Limbo`,players:`3+ players`,needs:`<b>You need:</b> A broom handle or rope, and music.`,how:`Two people hold a bar (or a taut rope) while each player leans backward and shuffles underneath it without touching it or toppling over. Once everyone's cleared it, the bar drops lower. Knock the bar or fall and you're out — the last one bending under the lowest bar is the limbo champion.`},ar:{name:`الليمبو`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> عصا مكنسة أو حبل، وموسيقى.`,how:`يمسك شخصان قضيبًا (أو حبلًا مشدودًا) بينما يميل كل لاعب إلى الخلف ويتسلّل تحته دون أن يلمسه أو يقع. بعد أن يمرّ الجميع، يُخفَض القضيب. من يلمس القضيب أو يسقط يخرج — وآخر من ينحني تحت أخفض قضيب يفوز.`}},{tags:[`two`,`small`,`big`],meter:1,cat:`active`,en:{name:`Keepy Uppy`,players:`2+ players`,needs:`<b>You need:</b> A balloon.`,how:`Blow up a balloon and keep it from touching the floor using any part of your body. Play together to beat a group record or add rules — heads only, elbows only, everyone must touch it once before it lands. Astonishingly frantic and perfect for burning energy indoors on a rainy day.`},ar:{name:`أبقِها في الهواء`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> بالون.`,how:`انفخوا بالونًا وامنعوه من لمس الأرض بأي جزء من الجسم. العبوا معًا لتحطيم رقم قياسي، أو أضيفوا قواعد — بالرأس فقط، بالمرفقين فقط، عُدّوا عدد اللمسات قبل أن يهبط. محمومة على نحو مدهش ومثالية للداخل في يوم ممطر.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Musical Statues`,players:`3+ players`,needs:`<b>You need:</b> Music and someone to pause it.`,how:`Everyone dances while the music plays and must freeze like a statue the very instant it stops. The person on music duty prowls around watching for the slightest wobble and calls out anyone who moves. Hold the stillest, steadiest pose to be the last statue standing.`},ar:{name:`التماثيل الموسيقية`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> موسيقى وشخص يوقفها.`,how:`يرقص الجميع ما دامت الموسيقى تعزف، وعليهم التجمّد كتمثال لحظة توقّفها. يراقب المتحكّم أي اهتزاز ويستبعد من يتحرّك. اثبتوا في أثبت وضعية لتكونوا آخر تمثال باقٍ.`}},{tags:[`small`,`big`],meter:2,cat:`active`,en:{name:`Skipping Rope Games`,players:`3+ players`,needs:`<b>You need:</b> A long skipping rope.`,how:`Two players turn a long rope while others jump in one at a time, usually to a chanted rhyme that sets the rhythm and calls out playful moves. Miss a beat or snag the rope and you swap in to turn the rope instead. A schoolyard tradition with countless rhymes to learn and race through.`},ar:{name:`ألعاب حبل النطّ`,players:`3 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> حبل نطّ طويل.`,how:`يدير لاعبان حبلًا طويلًا بينما يقفز الآخرون واحدًا تلو الآخر، غالبًا على وقع أهزوجة تضبط الإيقاع والحركات المرحة. من يفوّت نبضة أو يعلق بالحبل يتبادل ليدير الحبل. تقليد مدرسي بأهازيج لا تنتهي لتجرّبوها.`}},{tags:[`small`,`big`],meter:2,cat:`outdoor`,en:{name:`Kick the Can`,players:`4+ players`,needs:`<b>You need:</b> A can or object, and space to hide.`,how:`A blend of hide-and-seek and tag built around a can in the open. One seeker guards it while everyone hides, then hunts them down — but any hider who sneaks in and kicks the can before being tagged frees everyone already caught. Slip through undetected, or be the hero who boots the can and springs the whole team.`},ar:{name:`اركل العلبة`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> علبة أو غرض، ومساحة للاختباء.`,how:`مزيج من الاستغماية والمطاردة حول علبة في العراء. يحرس باحث واحد العلبة بينما يختبئ الجميع، ثم يطاردهم — لكن أي مختبئ يتسلّل ويركل العلبة قبل أن يُلمَس يحرّر كل من أُمسِك. اعبر دون أن تُكتَشف، أو كن البطل الذي يركل العلبة ويحرّر الفريق.`}},{tags:[`small`,`big`],meter:2,cat:`outdoor`,en:{name:`Tug of War`,players:`4+ players`,needs:`<b>You need:</b> A strong rope.`,how:`Two teams grip opposite ends of a rope with a marker (often a ribbon) tied at its centre over a line on the ground. On the signal, both sides heave with everything they've got. Drag the centre marker past your side's line to win. Pure muscle, timing, and teamwork — dig in and pull as one.`},ar:{name:`شدّ الحبل`,players:`4 لاعبين فأكثر`,needs:`<b>تحتاج إلى:</b> حبل متين.`,how:`يمسك فريقان بطرفي حبل تُربَط علامة في وسطه فوق خط على الأرض، وعند الإشارة يشدّان بكل قوّة. اسحب العلامة الوسطى إلى ما بعد خطّك لتفوز. عضلات وتوقيت وعمل جماعي خالص — ثبّتوا أقدامكم واشدّوا كجسد واحد.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`travel`,en:{name:`The Alphabet Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing but passing signs.`,how:`On a journey, race to spot the letters A through Z in order on road signs, billboards, and number plates. Call out each letter the moment you find it and move to the next. First to reach Z wins — and the desperate hunt for a Q and a Z always turns into the best part.`},ar:{name:`لعبة الحروف الأبجدية`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى اللافتات العابرة.`,how:`في رحلة، تسابقوا على رصد الحروف من الألف إلى الياء بالترتيب على اللافتات واللوحات وأرقام السيارات. نادِ كل حرف لحظة إيجاده وانتقل للتالي. أول من يبلغ آخر الحروف يفوز — والبحث اليائس عن الحروف النادرة هو أطرف ما فيها.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`travel`,en:{name:`Geography`,players:`2+ players`,needs:`<b>You need:</b> Nothing but a bit of world knowledge.`,how:`Name a place — a country, city, mountain, or river. The next player must name another place beginning with the last letter of yours: "Canada, Athens, Spain, Nairobi." No repeats allowed; anyone stumped drops out. A gentle geography workout that's ideal for the car or the dinner table.`},ar:{name:`الجغرافيا`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء سوى بعض المعرفة بالعالم.`,how:`اذكر مكانًا — دولة أو مدينة أو نهرًا. على التالي ذكر مكان يبدأ بالحرف الأخير من مكانك: «كندا، أثينا، إسبانيا». بلا تكرار؛ ومن يعجز يخرج. اختبار جغرافيا لطيف مثالي للسيارة أو لطاولة العشاء.`}},{tags:[`two`,`small`,`big`,`nosupplies`],meter:1,cat:`travel`,en:{name:`The Quiet Game`,players:`2+ players`,needs:`<b>You need:</b> Nothing at all.`,how:`Beloved by weary parents everywhere. On "go," everyone must stay completely silent, and the last person to make a single sound wins. It's deceptively hard, quietly competitive, and blissfully peaceful — the only game whose real prize goes to whoever suggested playing it.`},ar:{name:`لعبة الصمت`,players:`لاعبان فأكثر`,needs:`<b>تحتاج إلى:</b> لا شيء على الإطلاق.`,how:`محبّبة للآباء المرهَقين في كل مكان. عند «ابدؤوا» على الجميع أن يلتزموا الصمت التام، وآخر من يصدر صوتًا يفوز. صعبة على نحو خادع وهادئة على نحو مريح — اللعبة الوحيدة التي تُكافئ من اقترح لعبها.`}}]},f=[{key:`situations`,nameAr:`مواقف: ماذا ستفعل؟`,nameEn:`Situations: What would you do?`,icon:`🎭`,questions:[`اكتشفت أن أصدقاءك لديهم مجموعة خاصة بدونك`,`عرفت سرًا قد يغيّر قرار زواج صديقك`,`نُسبت فكرة زميلك إليك وحصلت على التقدير`,`وصل إلى حسابك مبلغ كبير بالخطأ`,`صديقك بدأ مشروعًا تعتقد أنه سيفشل`,`شخص ظلمك سابقًا وأصبح بحاجة لمساعدتك`,`وجدت هاتفًا مفتوحًا وفيه رسالة حساسة`,`لديك فرصة عمل ممتازة في بلد بعيد عن عائلتك`,`عرفت أن زميلًا يغش للوصول إلى ترقية`,`شخص قريب يسألك رأيك الصريح في شيء سيئ صنعه`]},{key:`debate`,nameAr:`جدل: اختر جانبًا`,nameEn:`Debate: Pick a side`,icon:`🔥`,questions:[`المال يشتري جزءًا كبيرًا من السعادة`,`الصديق الغيور أخطر من العدو`,`ليس كل شخص يستحق فرصة ثانية`,`الحب وحده لا يكفي للزواج`,`الجمال يجعل الحياة أسهل`,`الذكاء الاجتماعي أهم من الذكاء الأكاديمي`,`الحظ أهم في النجاح مما نعترف به`,`العمل الجاد لا يضمن النجاح`,`التسامح لا يعني المصالحة`,`الصراحة الكاملة ليست دائمًا فضيلة`]},{key:`self`,nameAr:`اكتشف نفسك`,nameEn:`Discover Yourself`,icon:`🧠`,questions:[`لو قابلت نفسك قبل عشر سنوات، هل ستعجبك شخصيتك الحالية؟`,`ما الصفة التي يلاحظها الناس فيك قبل أن تلاحظها أنت؟`,`ما رأي غيّرته جذريًا خلال السنوات الأخيرة؟`,`ما شيء كان مهمًا لك ولم يعد كذلك؟`,`هل أنت الشخص نفسه مع العائلة والأصدقاء والعمل؟`,`أي نسخة منك هي الأقرب لحقيقتك؟`,`ما قرار صغير غيّر حياتك كثيرًا؟`,`هل ستنسجم مع نسخة مطابقة منك؟`,`ما صفة فيك ستزعجك لو وجدتها في غيرك؟`,`هل تتقبل النقد أم فقط النقد الذي تتفق معه؟`]},{key:`relationships`,nameAr:`العلاقات والصداقة`,nameEn:`Relationships & Friendship`,icon:`💞`,questions:[`هل يمكن للرجل والمرأة أن يكونا أصدقاء مقربين فقط؟`,`هل يمكن العودة للصداقة بعد علاقة عاطفية؟`,`هل يجب أن يعرف الشريك كلمة مرور هاتفك؟`,`هل إخفاء رسالة يعتبر خيانة؟`,`أيهما أصعب: الخيانة العاطفية أم الجسدية؟`,`هل يحق للشريك أن يطلب قطع علاقة بصديق؟`,`هل يجب إخبار الشريك بكل تفاصيل الماضي؟`,`هل يمكن استعادة الثقة بالكامل؟`,`هل الغيرة دليل حب أم عدم أمان؟`,`هل الحب يقل أم يتغير مع الوقت؟`]},{key:`work`,nameAr:`المال والعمل والنجاح`,nameEn:`Money, Work & Success`,icon:`💼`,questions:[`وظيفة تحبها براتب متوسط أم وظيفة تكرهها براتب مرتفع؟`,`هل تقبل تخفيض راتبك مقابل أربعة أيام عمل؟`,`مبلغ ضخم مقابل ترك مجال تحبه للأبد`,`هل يمكن أن يصبح شخص غنيًا جدًا بطريقة أخلاقية تمامًا؟`,`هل يجب أن يعرف أصدقاؤك راتبك؟`,`هل يدفع الأغنى أكثر عند الخروج مع الأصدقاء؟`,`هل تخبر الناس إذا أصبحت ثريًا؟`,`هل المال يعقّد العلاقات؟`,`وظيفة مستقرة أم مشروع عالي المخاطرة؟`,`هل النجاح المهني يستحق التضحية بالوقت الشخصي؟`]},{key:`science`,nameAr:`علم ونفس: خمن ثم ابحث`,nameEn:`Science & Mind`,icon:`🔬`,questions:[`هل الشخصية تتغير مع العمر؟`,`هل يمكن أن نتذكر شيئًا لم يحدث؟`,`لماذا يبدو الوقت أسرع مع العمر؟`,`هل الحيوانات تعرف أنها ستموت؟`,`هل بعض الحيوانات تكذب أو تخدع؟`,`هل النباتات تتواصل؟`,`لماذا الأخطبوط ذكي بطريقة مختلفة؟`,`لماذا تعيد الروائح ذكريات قوية؟`,`لماذا نحلم؟`,`هل كثرة الخيارات تقلل السعادة؟`]},{key:`whatif`,nameAr:`ماذا لو؟`,nameEn:`What If?`,icon:`🌀`,questions:[`لو عرف الجميع موعد وفاتهم`,`لو أصبح الكذب مستحيلًا`,`لو اختفى الإنترنت شهرًا`,`لو اختفت الهواتف سنة`,`لو استطاع الجميع قراءة الأفكار`,`لو لم نحتج للنوم`,`لو أصبح الجميع يملك المال نفسه غدًا`,`لو استطعت حذف اختراع من التاريخ`,`لو عشت 150 سنة بصحة جيدة`,`لو عرفت الحقيقة الكاملة عن سؤال واحد`]},{key:`tech`,nameAr:`AI والتكنولوجيا والمستقبل`,nameEn:`AI, Tech & Future`,icon:`🤖`,questions:[`لو كان AI أدق من طبيبك، من تختار؟`,`هل نحتاج المدارس بالشكل الحالي إذا أصبح AI معلمًا ممتازًا؟`,`هل تقبل أن يختار AI الموظفين؟`,`هل تقبل أن يقرر AI أهليتك لقرض؟`,`ماذا تفعل لو أصبح AI أفضل منك في وظيفتك؟`,`هل كتابة رسالة حب بـAI غش؟`,`إذا أعطيت الفكرة وكتب AI الرواية، من المؤلف؟`,`هل فن AI فن حقيقي؟`,`هل يمكن أن يكون AI صديقًا؟`,`هل يمكن أن يقع الإنسان في حب AI؟`]},{key:`fun`,nameAr:`خفيف وغريب`,nameEn:`Light & Weird`,icon:`😄`,questions:[`لو كان للحيوانات حق التصويت، أي حيوان سيكون أسوأ ناخب؟`,`وجبة واحدة فقط لسنة كاملة: ماذا تختار؟`,`مهارة غير مفيدة لكنها مبهرة: ماذا تختار؟`,`ما أسوأ شيء في أن تصبح مشهورًا غدًا؟ n:`Sun • Candle • Lamp • Lightning`,answerAr:`كلها مصادر للضوء`,answerEn:`They are all sources of light`,noteAr:`بعضها طبيعي وبعضها من صنع الإنسان.`,noteEn:`Some are natural and some are human-made.`},{ar:`جذر • ساق • ورقة • زهرة`,en:`Root • Stem • Leaf • Flower`,answerAr:`أجزاء النبات`,answerEn:`Parts of a plant`,noteAr:`لكل جزء وظيفة تساعد النبات على الحياة والتكاثر.`,noteEn:`Each part helps the plant live and reproduce.`},{ar:`مقياس حرارة • ساعة • مسطرة • ميزان`,en:`Thermometer • Clock • Ruler • Scale`,answerAr:`أدوات للقياس`,answerEn:`Tools used for measuring`,noteAr:`تقيس الحرارة والوقت والطول والكتلة.`,noteEn:`They measure temperature, time, length and mass.`},{ar:`ذاكرة • انتباه • لغة • تعلّم`,en:`Memory • Attention • Language • Learning`,answerAr:`وظائف معرفية للدماغ`,answerEn:`Cognitive functions of the brain`,noteAr:`تتعاون شبكات متعددة في الدماغ لإنجازها.`,noteEn:`Multiple brain networks work together to support them.`},{ar:`مطر • نهر • بحر • سحابة`,en:`Rain • River • Sea • Cloud`,answerAr:`دورة الماء`,answerEn:`The water cycle`,noteAr:`ينتقل الماء باستمرار بين الأرض والغلاف الجوي.`,noteEn:`Water continually moves between Earth and the atmosphere.`},{ar:`نحل • فراشة • طائر • خفاش`,en:`Bee • Butterfly • Bird • Bat`,answerAr:`قد تساعد كلها في التلقيح`,answerEn:`All can act as pollinators`,noteAr:`ينقل بعضها حبوب اللقاح بين الأزهار.`,noteEn:`Some carry pollen from flower to flower.`},{ar:`خريطة • بوصلة • نجوم • نظام تحديد المواقع`,en:`Map • Compass • Stars • GPS`,answerAr:`وسائل لمعرفة الاتجاه والموقع`,answerEn:`Ways to navigate and locate`,noteAr:`تجمع بين أدوات قديمة وتقنيات حديثة.`,noteEn:`They span ancient tools and modern technology.`},{ar:`إعادة استخدام • إصلاح • تدوير • تقليل`,en:`Reuse • Repair • Recycle • Reduce`,answerAr:`طرق لتقليل النفايات`,answerEn:`Ways to reduce waste`,noteAr:`الأفضل غالبًا تقليل الاستهلاك قبل الحاجة إلى التدوير.`,noteEn:`Reducing consumption often comes before recycling.`}]},{key:`whatHappens`,icon:`🧪`,color:`#A35E45`,seconds:0,competitive:!0,reveal:!0,ar:{name:`ماذا سيحدث؟`,players:`لاعبان فأكثر`,description:`توقعوا نتيجة موقف علمي أو حياتي ثم اكتشفوا السبب.`,how:`اختاروا الإجابة قبل كشف النتيجة. كل توقع صحيح نقطة، والأهم قراءة التفسير ومناقشة السبب.`},en:{name:`What Happens Next?`,players:`2+ players`,description:`Predict the result of a science or everyday situation.`,how:`Choose an answer before revealing the result. Each correct prediction earns a point; then read and discuss the explanation.`},items:[{ar:`ماذا يحدث لظل جسم عندما نقرّبه من مصدر الضوء؟`,en:`What happens to an object’s shadow as it moves closer to a light source?`,optionsAr:[`يكبر`,`يصغر`,`يختفي دائمًا`],optionsEn:[`It grows`,`It shrinks`,`It always disappears`],answerAr:`يكبر غالبًا`,answerEn:`It usually grows`,noteAr:`يحجب الجسم زاوية أكبر من الضوء عندما يقترب من المصدر.`,noteEn:`The object blocks a wider angle of light when closer to the source.`},{ar:`أي قطعة ثلج تذوب أسرع: فوق معدن أم فوق خشب في الغرفة نفسها؟`,en:`Which ice cube melts faster: one on metal or one on wood in the same room?`,optionsAr:[`المعدن`,`الخشب`,`بالسرعة نفسها دائمًا`],optionsEn:[`Metal`,`Wood`,`Always the same`],answerAr:`فوق المعدن غالبًا`,answerEn:`Usually the one on metal`,noteAr:`المعدن ينقل حرارة الغرفة إلى الثلج أسرع من الخشب.`,noteEn:`Metal transfers room heat to the ice faster than wood.`},{ar:`إذا زرعنا نبتة قرب نافذة من جهة واحدة، كيف تنمو غالبًا؟`,en:`If a plant receives window light from one side, how will it usually grow?`,optionsAr:[`نحو الضوء`,`بعيدًا عن الضوء`,`إلى الأسفل`],optionsEn:[`Toward the light`,`Away from the light`,`Downward`],answerAr:`نحو الضوء`,answerEn:`Toward the light`,noteAr:`تُسمّى هذه الاستجابة الانتحاء الضوئي.`,noteEn:`This response is called phototropism.`},{ar:`ماذا يحدث للصوت عندما نبتعد عن مصدره؟`,en:`What happens to a sound as we move farther from its source?`,optionsAr:[`يضعف عادة`,`يقوى دائمًا`,`لا يتغير`],optionsEn:[`It usually weakens`,`It always grows louder`,`It does not change`],answerAr:`يضعف عادة`,answerEn:`It usually weakens`,noteAr:`تنتشر طاقة الموجة الصوتية على مساحة أكبر.`,noteEn:`The sound wave’s energy spreads over a larger area.`},{ar:`إذا وضعنا ورقة جافة في الماء، ماذا يحدث أولًا؟`,en:`What happens first when dry paper is placed in water?`,optionsAr:[`تمتص الماء`,`تتحول إلى زجاج`,`تطفو للأبد دون تغير`],optionsEn:[`It absorbs water`,`It turns to glass`,`It floats forever unchanged`],answerAr:`تمتص الماء`,answerEn:`It absorbs water`,noteAr:`تدخل المياه في الفراغات الدقيقة بين ألياف الورق.`,noteEn:`Water enters tiny spaces between the paper fibres.`},{ar:`ماذا يحدث لمعدل التنفس غالبًا بعد الجري؟`,en:`What usually happens to breathing rate after running?`,optionsAr:[`يزداد`,`يتوقف`,`ينخفض فورًا`],optionsEn:[`It increases`,`It stops`,`It drops immediately`],answerAr:`يزداد`,answerEn:`It increases`,noteAr:`يحتاج الجسم إلى مزيد من الأكسجين والتخلص من ثاني أكسيد الكربون.`,noteEn:`The body needs more oxygen and must remove more carbon dioxide.`}]},{key:`ifWriter`,icon:`✍️`,color:`#7B5A45`,seconds:0,competitive:!1,ar:{name:`لو كنت كاتبًا…`,players:`لاعبان فأكثر`,description:`تخيّل قصة عن الموضوع الظاهر واحكِ بدايتها أو نهايتها.`,how:`يقرأ اللاعب البطاقة ويأخذ لحظة للتفكير، ثم يروي بداية القصة أو نهايتها في دقيقة تقريبًا. يمكن للباقين إضافة سؤال واحد يوسّع الفكرة.`},en:{name:`If You Were a Writer…`,players:`2+ players`,description:`Imagine a story about the prompt and tell its beginning or ending.`,how:`Read the card, take a moment to think, then tell the beginning or ending in about a minute. The group may ask one question that expands the idea.`},items:[{ar:`لو كتبت قصة عن مدينة لا ينام سكانها، كيف ستبدأ؟`,en:`If you wrote about a city whose people never sleep, how would it begin?`},{ar:`لو كتبت قصة عن رسالة وصلت بعد مئة عام، ماذا ستكون نهايتها؟`,en:`If you wrote about a letter delivered one hundred years late, how would it end?`},{ar:`لو كتبت قصة عن طفل يفهم لغة الحيوانات، كيف ستبدأ؟`,en:`If you wrote about a child who understands animals, how would it begin?`},{ar:`لو كتبت قصة عن مكتبة تختفي كل صباح، ماذا ستكون نهايتها؟`,en:`If you wrote about a library that disappears every morning, how would it end?`},{ar:`لو كتبت قصة عن آخر شجرة في المدينة، كيف ستبدأ؟`,en:`If you wrote about the last tree in a city, how would it begin?`},{ar:`لو كتبت قصة عن ساعة تعيد خمس دقائق فقط، ماذا ستكون نهايتها؟`,en:`If you wrote about a clock that rewinds only five minutes, how would it end?`},{ar:`لو كتبت قصة عن عائلة وجدت خريطة داخل كتاب قديم، كيف ستبدأ؟`,en:`If you wrote about a family finding a map inside an old book, how would it begin?`},{ar:`لو كتبت قصة عن روبوت يريد تعلّم الضحك، ماذا ستكون نهايتها؟`,en:`If you wrote about a robot learning to laugh, how would it end?`},{ar:`لو كتبت قصة عن قرية تتبدل أماكن بيوتها ليلًا، كيف ستبدأ؟`,en:`If you wrote about a village whose houses move at night, how would it begin?`},{ar:`لو كتبت قصة عن رحلة لا يعرف ركابها وجهتها، ماذا ستكون نهايتها؟`,en:`If you wrote about a journey whose passengers do not know the destination, how would it end?`},{ar:`لو كتبت قصة عن عالم اكتشف لونًا جديدًا، كيف ستبدأ؟`,en:`If you wrote about a scientist discovering a new colour, how would it begin?`},{ar:`لو كتبت قصة عن باب لا يفتح إلا عند قول الحقيقة، ماذا ستكون نهايتها؟`,en:`If you wrote about a door that opens only when someone tells the truth, how would it end?`},{ar:`لو كتبت قصة عن يوم اختفت فيه كل الشاشات، كيف ستبدأ؟`,en:`If you wrote about a day when every screen stopped working, how would it begin?`},{ar:`لو كتبت قصة عن جزيرة تظهر يومًا واحدًا كل سنة، ماذا ستكون نهايتها؟`,en:`If you wrote about an island that appears one day each year, how would it end?`},{ar:`لو كتبت قصة عن صديقين وجدا بذرة مضيئة، كيف ستبدأ؟`,en:`If you wrote about two friends finding a glowing seed, how would it begin?`},{ar:`لو كتبت قصة عن متحف تتحدث معروضاته ليلًا، ماذا ستكون نهايتها؟`,en:`If you wrote about museum exhibits that talk at night, how would it end?`}]},{key:`storyMaker`,icon:`🎬`,color:`#6F4D73`,seconds:0,competitive:!1,ar:{
